# pi-worker — sandbox kit (kit-spec v2) that bakes the toolchain and the
# in-VM pi configuration into a reusable image, then gets snapshotted as the
# `pi-worker:v1` template by .pi/sandboxes/build.sh.
schemaVersion: "2"
kind: sandbox
name: pi-worker
version: "1.0.0"

sandbox:
  # Base image expected by the delegate extension: agent UID 1000, Node/npm and
  # the sandbox proxy plumbing, shell entrypoint.
  image: docker/sandbox-templates:shell-docker
  # No `entrypoint`/`command` on purpose: nothing may auto-run on boot. The
  # delegate extension starts `pi` itself through `sbx exec`, and the image's
  # own shell-compatible launcher keeps the sandbox alive.

environment:
  variables:
    # Never try to download a different toolchain than the pinned one.
    GOTOOLCHAIN: local
    # Module proxy only: no `,direct` fallback, so a module fetch can only use
    # the allowlisted proxy endpoints (see permissions.network.allow).
    GOPROXY: https://proxy.golang.org
    GOSUMDB: sum.golang.org
    # Directory the in-VM pi reads its settings/models/auth from.
    PI_AGENT_HOME: /home/agent/.pi/agent
    # GOCACHE and GOMODCACHE are deliberately NOT set: they stay at the in-VM
    # defaults (/home/agent/.cache/go-build, /home/agent/go/pkg/mod) so that the
    # caches warmed below live inside the filesystem snapshot that
    # `sbx template save` captures.

permissions:
  network:
    # kit-spec v2: one allow list governs both the install phase and runtime for
    # sandboxes created WITH THIS KIT. Task sandboxes are created from the
    # `pi-worker:v1` template instead, so the extension can scope per-sandbox
    # egress down to the four task hosts.
    allow:
      - registry.npmjs.org:443
      - opencode.ai:443
      - "*.opencode.ai:443"
      - go.dev:443
      - dl.google.com:443
      - storage.googleapis.com:443
      - proxy.golang.org:443
      - sum.golang.org:443

setup:
  install:
    # Install commands run as root through `sh -c`, start in the image WORKDIR
    # (not the workspace), so every path here is absolute.
    - command: |
        set -eu
        GO_VERSION="1.27.1"
        case "$(uname -m)" in
          aarch64|arm64) GOARCH=arm64 ;;
          x86_64|amd64) GOARCH=amd64 ;;
          *) echo "pi-worker kit: unsupported machine type $(uname -m)" >&2; exit 1 ;;
        esac
        URL="https://go.dev/dl/go${GO_VERSION}.linux-${GOARCH}.tar.gz"
        echo "pi-worker kit: installing Go ${GO_VERSION} (${GOARCH}) from ${URL}"
        TMP="$(mktemp -d)"
        if command -v curl >/dev/null 2>&1; then
          curl -fsSL "$URL" -o "$TMP/go.tgz"
        elif command -v wget >/dev/null 2>&1; then
          wget -q "$URL" -O "$TMP/go.tgz"
        else
          node -e 'const [u,f]=process.argv.slice(1);fetch(u).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.arrayBuffer()}).then(b=>require("node:fs").writeFileSync(f,Buffer.from(b))).catch(e=>{console.error(e);process.exit(1)})' "$URL" "$TMP/go.tgz"
        fi
        rm -rf /usr/local/go
        tar -C /usr/local -xzf "$TMP/go.tgz"
        rm -rf "$TMP"
        ln -sf /usr/local/go/bin/go /usr/local/bin/go
        ln -sf /usr/local/go/bin/gofmt /usr/local/bin/gofmt
        mkdir -p /home/agent/.pi/agent
        chown 1000:1000 /home/agent /home/agent/.pi /home/agent/.pi/agent
        /usr/local/go/bin/go version
    - command: |
        set -eu
        echo "pi-worker kit: installing @earendil-works/pi-coding-agent@1.6.0 globally"
        npm install -g --ignore-scripts @earendil-works/pi-coding-agent@1.6.0
        npm cache clean --force >/dev/null 2>&1 || true
        pi --version
  files:
    # Providers live in models.json (settings.json has no provider section);
    # settings.json carries the startup defaults. No secret is stored in either
    # file: apiKey is the $OPENCODE_GO_API_KEY sentinel that the host proxy
    # replaces with the real key on requests to opencode.ai.
    - path: /home/agent/.pi/agent/models.json
      mode: "0644"
