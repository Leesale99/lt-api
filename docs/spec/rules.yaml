      - internal/e2e/rides_test.go::TestCreateRideHandler
  notes: >
    The decision is the service's (every command must run the gate inside its own unit
    of work, before its write); the *guarantee* is the FOR SHARE row lock in schedule's
    own SECURITY DEFINER functions (round_open_guard / destination_open_guard, 000018),
    which is why the guard is listed as defense-in-depth at the repository layer: Postgres
    executes it, but the ordering decision — gate before write, same transaction — is
    the use case's. The advisory phase read (PhaseForMatch) proves nothing and is not
    listed. Tie: the two repository sites fail loudly — they never drift silently, because
