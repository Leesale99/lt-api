    but pairs cannot commit half-posted without breaking R-LEDGER-002, and the ordering
    across the legs is the use case's — hence authority: service. Nothing exists in code:
    no reserve, wallet, pool or currency table (grep for BuyFromReserve / TransferCurrency
    / reserve finds only comments). Doc-vs-doc note: phase-03's §"First transactional
    operations" names the same operation BuyFromReserve with three legs and no common pool
