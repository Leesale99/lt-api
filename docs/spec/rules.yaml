- id: R-SCHEDULE-001
  title: A new schedule record is born in its created state
  statement: |
    A season, a round and a match always come into existence in their created
    state. The client cannot choose it — the create request carries no status —
    so no organiser can plant a live or finished season, round or match with a
    single call.
  module: schedule
  entity: season
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: row-local
  enforcement:
    - site: internal/schedule/internal/handler/seasons.go::createSeason
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/handler/rounds.go::createRound
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/handler/matches.go::createMatch
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/model/season.go::ValidateNewSeason
      layer: validator
      role: defense-in-depth
      pinned_by: null
    - site: internal/schedule/internal/model/round.go::ValidateNewRound
      layer: validator
      role: defense-in-depth
      pinned_by: null
    - site: internal/schedule/internal/model/match.go::ValidateNewMatch
      layer: validator
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 422
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/model/matches_validation_test.go::TestValidateNewMatch
    e2e:
      - internal/e2e/seasons_test.go::TestCreateSeasonHandler
      - internal/e2e/rounds_test.go::TestCreateRoundHandler
      - internal/e2e/matches_test.go::TestCreateMatchHandler
  notes: >
    Three request DTOs, one rule: none of the create bodies has a status field
    (an attempt to send one is a 400 unknown key, the frozen wire contract), and
    each handler writes the created constant itself. Tie: the three validators
    fail loudly at the transport — a create that carried any other status would
    be refused 422 before the use case, and the e2e create suites pin the
    responses. The database is not a copy of this rule and could not be: no
    CHECK forces 'created' on INSERT, and rounds_progress_gate only constrains
    an insert that is already beyond created. A direct writer can therefore
    insert an open round under a live season with an unbroken sequence (the
    seed's vocabulary drift detector relies on exactly that door). For matches
    the create SQL does not even send the status column — the 000001 column
    DEFAULT 'created' is what stores it, which makes the handler's assignment
    for matches inert (it is the validator plus the DEFAULT that hold). The two
    new-record validators, ValidateNewSeason and ValidateNewRound, have no unit
    test today; only their match counterpart is pinned.

- id: R-SCHEDULE-002
  title: A fixture is scheduled forward in time
  statement: |
    A match may only be created for a start that lies strictly in the future.
    Calendar entries are announcements, so a past or exactly-now start is
    refused at creation; editing an existing match may still adjust a start
    that has already passed.
  module: schedule
  entity: match
  category: policy
  status: implemented
  authority: domain
  mechanism: null
  scope: row-local
  enforcement:
    - site: internal/schedule/internal/model/match.go::ValidateNewMatch
      layer: validator
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 422
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/model/matches_validation_test.go::TestValidateNewMatch
    e2e:
      - internal/e2e/matches_test.go::TestCreateMatchHandler
    gherkin:
      - docs/spec/features/schedule/fixtures.feature::A fixture cannot be announced for a kickoff that has arrived
  notes: >
    The clock is injected (ValidateNewMatch takes `now`) so the boundary is
    testable without sleeping; the three cases — past, exactly now, one second
    after — are pinned. The asymmetry with update is deliberate and is stated in
    ValidateMatchUpdate: an existing match keeps being editable after it has
    started. Nothing in the database sees this rule (matches.starts_at has no
    CHECK against now()), so it is a domain policy for every creator, not a
    storage invariant.

- id: R-SCHEDULE-003
  title: A schedule lifecycle never moves backwards
  statement: |
    A season, a round and a match only ever advance through their vocabularies:
    created, then open (or in progress), then closed. A status may not return to
    an earlier stage, a same-status rewrite is allowed, and a closed match is
    final — it never changes state again, even back to in_progress.
  module: schedule
  entity: season
  category: policy
  status: implemented
  authority: database
  mechanism: trigger
  scope: row-local
  enforcement:
    - site: migrations/000019_add_status_rank_gates.up.sql
      layer: db-trigger
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/model/status.go::checkStatusRegression
      layer: domain
      role: advisory-copy
      pinned_by: null
    - site: internal/schedule/internal/model/season.go::ValidateSeasonUpdate
      layer: validator
      role: advisory-copy
      pinned_by: null
    - site: internal/schedule/internal/model/round.go::ValidateRoundUpdate
      layer: validator
      role: advisory-copy
      pinned_by: null
    - site: internal/schedule/internal/model/match.go::ValidateMatchUpdate
      layer: validator
      role: advisory-copy
      pinned_by: null
  refusal:
    code: P0001
    constraint:
      - match_status_regression
      - round_status_regression
      - season_status_regression
    sentinel: ErrRecordInUse
    http: 409
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/model/lifecycle_test.go::TestValidateSeasonUpdate
      - internal/schedule/internal/model/lifecycle_test.go::TestValidateRoundUpdate
      - internal/schedule/internal/model/matches_validation_test.go::TestValidateMatchUpdate
      - internal/schedule/internal/repository/constraints_test.go::TestStatusRankGatesMirrorGoRanks
      - internal/schedule/internal/repository/gates_test.go::TestRoundFreezeGate
      - internal/schedule/internal/repository/gates_test.go::TestSeasonFreezeGate
    e2e:
      - internal/e2e/rounds_test.go::TestUpdateRoundHandler
      - internal/e2e/matches_test.go::TestUpdateMatchHandler
    gherkin:
      - docs/spec/features/schedule/lifecycle.feature::A closed match cannot go back to running
  notes: >
    One rule, three vocabularies: each entity owns a rank map and the shared
    statusRegresses verdict rejects a lower rank (disjoint cases, one statement;
    the generic signature makes a cross-vocabulary comparison a compile error).
    The rank maps are why a same-status rewrite passes. Since migration 000019
    the database is the authoritative home: the three gate functions mirror the
    Go ranks and refuse every regression with the three P0001 names
    (match_status_regression / round_status_regression /
    season_status_regression), including a closed match moved back to
    in_progress, a closed round with nothing started moved back to open, and a
    live season moved back a stage — all reachable by a direct writer before.
    The rank check runs BEFORE the started-freeze rule, so a row tripping both
    reports the rank message deterministically. The Go rank maps stay the
    authority the DB copies must not drift from: the model's three exported
    StatusRegresses functions are the oracle and the drift matrix
    (TestStatusRankGatesMirrorGoRanks) probes every ordered status pair,
    asserting the exact rank message on regressions and acceptance elsewhere
    (fixtures isolate the rank rule from the freeze / season-live / sequence
    gates). The advisory validators still run first, so the API path keeps its
    friendly 422 and the DB's 409 is reachable only by writers that skip them.
    stale-pointer: migration 000008's header ("Regressions ... are NOT gated
    here — they belong to rounds_freeze_gate, which already refuses them")
    overstates the gate — resolved by 000019: it refused regressions only once a
    match of the round had started, and the rank half now lives in the same
    function's 000019 body, so the 000008 header is historical, not current;
    000008 is applied and stays byte-identical.

