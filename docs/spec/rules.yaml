    Specified only. Phase 06 §"Important rule" makes idempotency one of the four things
    the ledger enforces in its one place, and "idempotent financial operations" is a
    stated research topic of the phase. Today the ledger has no idempotency of its own:
    the HTTP command's Idempotency-Key (kernel/idempotency, migrations/000010) and the
    settlement handlers' EventID claim protect the callers, not the operation — a
    redelivered ledger intent would apply twice, since AccrueBonus is a blind increment
    (`UPDATE rides SET bonus_acc = bonus_acc + $2`) and LockTokens/Burn are no-ops. The
    claim belongs to the ledger operation (its own transaction boundary), hence
    authority: service.
    Related but distinct: R-KERNEL-001..004 and R-KERNEL-014 (with R-GAME-018) make *HTTP*
    commands and settlement events idempotent; this rule is about the ledger operation
    itself, which is the unbuilt half.

- id: R-LEDGER-007
  title: Buying tokens posts both sides of the purchase
  statement: |
    Buying tokens is one movement with two sides: the player pays currency into the common
    pool and receives tokens from the team reserve, and both sides are posted together, so
    no leg of a purchase can survive on its own.
  module: ledger
