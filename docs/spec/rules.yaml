# ─────────────────────────────────────────────────────────────────────────────
# game — settlement and decisions: ordering, exactly-once writes
# ─────────────────────────────────────────────────────────────────────────────

- id: R-GAME-015
  title: A forfeit is posted before the ride's state moves
  statement: |
    Whenever a ride forfeits its accrued bonus — a player unlock, a lost result,
    the season-close force-unlock — the money is released first and the state
    changes after, both inside one transaction. The order is what makes the
    arrival legal: a ride cannot reach unlocked or lost still carrying a bonus.
  module: game
  entity: ride
  category: orchestration
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/game/internal/core/service/ride_commands.go::Service.RideUnlock
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/settlement.go::Service.settleRideFromResult
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/settlement.go::Service.OnRoundCompleted
      layer: service
      role: authoritative
      pinned_by: null
    - site: migrations/000013_add_rides_money_state_coupling.up.sql
      layer: db-constraint
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: "23514"
    constraint: rides_money_state_coupling
    sentinel: ErrInvalidTransition
    http: 409
  fixture: null
  verification:
    unit:
      - internal/game/internal/core/service/service_test.go::TestService_RideUnlock
      - internal/game/internal/core/service/service_test.go::TestService_OnMatchResultRecorded
      - internal/game/internal/core/service/service_test.go::TestService_OnRoundCompleted
      - internal/game/internal/core/service/constraints_test.go::TestRideMoneyStateCoupling
  notes: >
    Ordering is a use-case decision (which statement runs first, and that both
    share the command's transaction), so the authority is the service; the money
    write itself belongs to the ledger behind its intent seam, and the ride
    repository deliberately omits every money column from its SET clause. Three
    authoritative sites are the three roads into a forfeiting arrival (player
    unlock, the lost half of a match settlement, the round-close sweep) — one
    statement, disjoint cases. The constraint site is a data-carrying copy that
    fails loudly, hence defense-in-depth with no fixture: Tie: if the flip were
    written before the release, 000013 refuses the UPDATE with 23514 and the
    whole transaction (release included) rolls back, so the drift cannot land
    silently. Related but distinct: R-GAME-005 owns the coupling predicate
    itself, this rule owns the order in which the two writes are issued.

- id: R-GAME-016
  title: A settlement reaches each ride once
  statement: |
    A settlement arrival only lands on a ride that is still in the state the
    handler read and at the version it read; a ride another writer already moved
    is left alone and the arrival reports the invalid-transition conflict. A
    settlement therefore never overwrites a decision, a replay or a sibling
    settlement.
  module: game
  entity: ride
  category: orchestration
  status: implemented
  authority: repository
  mechanism: null
  scope: row-local
  enforcement:
    - site: internal/game/internal/adapter/outbound/postgres/ride_repo.go::RideRepository.ArriveTx
      layer: repository
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/adapter/outbound/postgres/ride_repo.go::RideRepository.classifyArrivalRefusal
      layer: repository
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/adapter/outbound/postgres/ride_repo.go::RideRepository.LockedForMatchTx
      layer: repository
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrInvalidTransition
    http: 409
  fixture: null
  verification:
    unit:
      - internal/game/internal/core/service/rides_concurrency_test.go::TestSettlementHandlersSerializeOnTheRound
      - internal/game/internal/core/service/service_test.go::TestService_OnMatchResultRecorded
      - internal/game/internal/core/service/service_test.go::TestService_OnRoundCompleted
    e2e:
      - internal/e2e/matches_test.go::TestResolveMatchSettlesRowOnce
    gherkin:
      - docs/spec/features/game/settlement.feature::The same result arriving twice pays the bonus once
  notes: >
    Authority is the repository, which deviates from the orchestration default
    (service) on purpose: the use case decides *which* rides are candidates, but
    the guarantee that only a still-arrivable ride is written is a conditional
    UPDATE whose WHERE carries the from-state and the version — the check and
    the write are one statement under READ COMMITTED, so no use-case code can be
    the authority for it. classifyArrivalRefusal is listed as authoritative too
    because the refusal's *name* is decided there (row gone → not found, version
    moved → invalid transition) and the seed's refusal surface is the 409. The
    trigger path is the other half of the same answer: a P0001 from the state
    graph also maps to the invalid-transition conflict. LockedForMatchTx is
    listed because the candidate set is part of the statement — only rides still
    named locked are settled, so a won_pending ride is never settled twice.
    Deliberately not part of this rule: what the destination must be (R-GAME-010),
    the event claim (R-KERNEL-014) and the per-round serialization (R-GAME-023).
    Verification gap: no unit test calls ArriveTx with a stale pre-state
    directly; the CAS is pinned through the settlement races and the store's
    other guarded write (TestRideRepository_DecisionGuardedTx), which applies the
    same from-state + version predicate. The one ArriveTx case that is unit-pinned
    is the store boundary itself (TestRideRepository_ArriveTx): the write lands
    without a result-agreement check, because that refusal is the service's
    (R-GAME-010).
    Related but distinct: R-KERNEL-014 claims the *event* at the service, this rule claims
    the *ride row* at the repository — the authorities differ, so they are two rules (a
    replay can be dropped by the claim and still be settled idempotently per ride, and
    vice versa).

# ─────────────────────────────────────────────────────────────────────────────
# game — players: the optimistic version claim
# ─────────────────────────────────────────────────────────────────────────────

- id: R-GAME-017
  title: A player write may claim the version it read
  statement: |
    A player patch may state the version it read; if the stored registration has
    moved on since, the write is refused as a conflict instead of silently
    overwriting the other change. Without a claim the write still re-checks the
    row's version at the statement, so a concurrent edit can never be lost.
  module: game
  entity: player
  category: policy
  status: implemented
  authority: service
  mechanism: null
  scope: row-local
  enforcement:
    - site: internal/game/internal/core/service/player_commands.go::Service.PlayerUpdate
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/adapter/outbound/postgres/player_repo.go::PlayerRepository.Update
      layer: repository
      role: defense-in-depth
      pinned_by: null
    - site: internal/game/internal/adapter/inbound/http/players.go::updatePlayer
      layer: handler
      role: advisory-copy
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrEditConflict
    http: 409
  fixture: null
  verification:
    unit: []
    e2e:
      - internal/e2e/players_test.go::TestUpdatePlayerHandler
    gherkin:
      - docs/spec/features/game/players.feature::An edit claiming a version the registration has moved past is refused as a stale reading
  notes: >
    Authority is the service (deviation from the policy default of domain): the
    comparison is against a version the caller claims, which is request-shaped,
    not a domain fact. The repository site fails loudly (UPDATE ... WHERE
    version = $n, zero rows → the same conflict), so it is defense-in-depth
    without a fixture — Tie: a dropped WHERE would make the lost update
    possible, but the service's own check still refuses the stale claim; only
    the no-claim path would regress, which is exactly the branch the E2E
    "matching/stale X-Expected-Version" cases pin. The handler site is advisory:
    it turns an unreadable expected-version header into the same conflict
    instead of a 400 (a deliberate choice: a header that cannot name a stored
    version cannot match one). Second, quieter fact in the same use case: the
    merged row — not the patch — is what is validated and written.

# ─────────────────────────────────────────────────────────────────────────────
# game — idempotency of the ride commands (ADR-024) and request framing
# ─────────────────────────────────────────────────────────────────────────────

- id: R-GAME-018
  title: A ride command claims its key before it runs
  statement: |
    Every ride command first claims its idempotency key inside its own
    transaction, and only then reads, gates and writes; a command whose key is
    already completed returns the recorded answer without executing. The claim
    commits with the answer, so a failed command leaves nothing recorded and its
    retry runs for real.
  module: game
  entity: idempotency_key
  category: orchestration
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/game/internal/core/service/ride_commands.go::Service.RideCreate
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/ride_commands.go::Service.RideLock
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/ride_commands.go::Service.RideBurn
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/ride_commands.go::Service.RideUnlock
      layer: service
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/game/internal/core/service/idempotency_test.go::TestService_RideLockIdempotency
      - internal/game/internal/core/service/idempotency_test.go::TestService_RideCreateIdempotent
    e2e:
      - internal/e2e/rides_test.go::TestCreateRideIdempotentHandler
      - internal/e2e/rides_test.go::TestRideLockIdempotentHandler
    gherkin:
      - docs/spec/features/game/idempotency.feature::A retry under the same key comes back with the recorded answer
  expert-ref: docs/league-tokens-learning-phases/phase-04-concurrency-and-idempotency.md
  notes: >
    Four authoritative sites, one per command: the ordering (claim first, then
    execute, then store, then commit) is the same statement applied to four
    disjoint commands, so it is one rule with four sites, not four rules. No
    refusal: a claim that loses is not a refusal — it returns the recorded
    answer, which is a success. The recorded answer is the transport's
    presentation callback output (status + marshaled body), stored byte for byte
    so the replay is byte-identical, and create's Location header is re-derived
    from the stored body rather than persisted. The claim table and the
    single-flight mechanics are the kernel engine's; what this rule owns is that
    the *game* commands call it first and inside one transaction.
    Related but distinct: R-KERNEL-004 owns the transactional coupling (the claim commits
    with the command's effect, or not at all); this rule owns the ordering inside the
    command, and the kernel claim rule (R-KERNEL-003) owns what the caller sees on a
    replay.
    stale-pointer: phase-04's §"Later, for HTTP commands, add an idempotency key table" is
    superseded sequencing, not a disagreement — migrations/000010 and this rule's sites
    are that table. Nothing else in the doc names a path that no longer exists.

