# ─────────────────────────────────────────────────────────────────────────────
# game — settlement event seam (exactly-once behaviors)
# ─────────────────────────────────────────────────────────────────────────────

- id: R-GAME-023
  title: The two settlements of one round run back to back
  statement: |
    A match settlement and a round settlement of the same round never run beside
    each other: each takes the round's settlement lock before reading any ride,
    so the second one sees the first one's committed transitions instead of
    racing them. Without that order the later settlement would lose its write,
    roll back — its event claim with it — and the event would be dropped.
  module: game
  entity: ride
  category: orchestration
  status: implemented
  authority: repository
  mechanism: null
  scope: null
  enforcement:
    - site: internal/game/internal/adapter/outbound/postgres/transactor.go::Transactor.LockSettlementRound
      layer: repository
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/settlement.go::Service.runEvent
      layer: service
      role: defense-in-depth
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/game/internal/core/service/rides_concurrency_test.go::TestSettlementHandlersSerializeOnTheRound
  notes: >
    Authority is the repository (the ordering/locking primitive is the
    transactor's, exactly the taxonomy's "ordering/locking/atomicity mechanics →
    repository"), a deviation from the orchestration default (service) recorded
    here: the use case decides *that* the lock is taken and *when* in its
    sequence (before any ride read), the adapter decides *how* (a
    transaction-scoped advisory lock, one key namespace plus the round id). The
    service site therefore is a copy that fails loudly — Tie: dropping the call
    lets the two handlers race, and the lost CAS strands a ride, which is what
    TestSettlementHandlersSerializeOnTheRound reproduces (the delivery must
    wait, not fail). No refusal: the rule's failure mode is a stranded ride and
    a rolled-back claim, never a client-facing error.
    Renumbered at merge (was provisional R-GAME-024): the request-identity fragment went into R-KERNEL-002 and R-GAME-027 merged into R-SCHEDULE-026, so the game block was renumbered densely.

# ─────────────────────────────────────────────────────────────────────────────
# game — refusal mapping: the ride repository's classification order
# ─────────────────────────────────────────────────────────────────────────────

- id: R-GAME-024
  title: A refused ride write names its cause in a fixed order
  statement: |
    When a ride write is refused, the reason is classified in a fixed order —
    the row is gone, the state or version the command claimed no longer holds,
    then the database's own refusal — so the client always gets the refusal that
    actually happened. A write that matched nothing while every predicate still
    holds is reported as a defect, never dressed up as a business refusal.
  module: game
  entity: ride
  category: refusal-mapping
  status: implemented
  authority: repository
  mechanism: null
  scope: row-local
  enforcement:
    - site: internal/game/internal/adapter/outbound/postgres/ride_repo.go::RideRepository.classifyDecisionRefusal
      layer: repository
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/adapter/outbound/postgres/ride_repo.go::RideRepository.classifyArrivalRefusal
      layer: repository
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/adapter/outbound/postgres/ride_repo.go::RideRepository.DecisionGuardedTx
      layer: repository
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrInvalidTransition
    http: 409
  fixture: null
  verification:
    unit:
      - internal/game/internal/core/service/rides_concurrency_test.go::TestService_RideCommandsRaceOnOneRide
      - internal/game/internal/core/service/rides_concurrency_test.go::TestService_RideBurnRacesExactlyOnce
      - internal/game/internal/adapter/outbound/postgres/ride_repo_test.go::TestRideRepository_DecisionGuardedTx
  notes: >
    This is the catalog's first refusal-mapping rule (the category the schema
    reserves for rules *about* the mapping). The order is: the statement's own
    SQLSTATEs first (a trigger refusal and the money-state check both mean the
    state machine refused → 409; a foreign-key refusal is the parent gone → 404),
    then, for a zero-row write, a follow-up read on the pool: no row → not found,
    row moved (version, or state no longer the claimed pre-state) → invalid
    transition, otherwise a wrapped error with no sentinel → 500. Two
    authoritative classifier sites because the two guarded writes have different
    pre-states (a decision claims won_pending; an arrival claims its own
    from-state, which may be locked *or* won_pending) — disjoint cases of one
    statement. The design point worth preserving: the follow-up read may legally
    see a snapshot from before the concurrent commit, so the "everything still
    holds" branch must not be folded into a named refusal — that is the loud
    error. The round's facts are deliberately absent from this classification:
    a close that slipped in between the gate and the write is the round
    refusal, decided before the write (R-GAME-008).
    Renumbered at merge (was provisional R-GAME-025): the request-identity fragment went into R-KERNEL-002 and R-GAME-027 merged into R-SCHEDULE-026, so the game block was renumbered densely.
    stale-pointer: two comments in the ride adapter still name the old shape —
    DecisionGuardedTx's doc comment says a destination deleted between the port gate and
    the write "surfaces as the FK 23503 -> ErrNotFound", while the inline comment two
    screens down says (correctly) that since 000016 no FK is left on rides and the branch
    is only the generic race-mapping shape; ride_repo_test.go's comments still cite
    classifyUpdateRefusal, a symbol that no longer exists (the classifiers are
    classifyDecisionRefusal, classifyArrivalRefusal and classifyResolveRefusal).

# ─────────────────────────────────────────────────────────────────────────────
# game — ride state machine, remainder (trigger check 2)
