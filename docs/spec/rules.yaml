    gherkin:
      - docs/spec/features/game/ride_lifecycle.feature::A won match leaves the ride waiting on a decision
  expert-ref: docs/league-tokens-learning-phases/phase-02-domain-model-and-state-machines.md
  notes: >
    The graph is OLD-vs-NEW, so it must live in the trigger (check 3 of
    rides_block_illegal_transition, unchanged since 000006, re-created verbatim by
    000017 as game.rides_block_illegal_transition). The domain's `transitions` map is
    the same graph in Go, used by every command guard; it is a copy that fails loud
    (the trigger refuses the write, TestRide_InvalidTransitions fails first).
    `canTransition` is the lookup, listed separately because a change to the map alone
    would not show up in a diff of the command methods. Tie: both Go sites fail loudly —
    they never drift silently, because the trigger refuses the arrival and the refused
    ride's own test fails first. The store's guarded writes are the two transactional
    production paths (DecisionGuardedTx for decisions, ArriveTx for settlement arrivals);
    the test-only RideRepository.Update that used to stand in for them was removed in
    Phase G, and its cases moved onto those paths (misalignment-report §6 item 21).

