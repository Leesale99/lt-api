# ─────────────────────────────────────────────────────────────────────────────
# game — round settlement (the event seam)
# ─────────────────────────────────────────────────────────────────────────────

- id: R-GAME-009
  title: Round completion force-resolves undecided rides
  statement: |
    When a round completes, every ride still waiting on a decision is resolved by the
    system: on rounds one to thirty-seven it is unlocked and the accrued bonus is
    released; on the season's final round it is burned and the accrued bonus is kept,
    because a chase option no longer exists. Still-locked rides of the round's matches
    are settled first, and all of it happens in the one claimed settlement transaction.
  module: game
  entity: ride
  category: policy
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/game/internal/core/service/settlement.go::Service.OnRoundCompleted
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/settlement.go::Service.runEvent
      layer: service
      role: defense-in-depth
      pinned_by: null
    - site: internal/schedule/internal/service/round_lifecycle.go::RoundService.Close
      layer: service
      role: authoritative
      pinned_by: null
  refusal:
    code: P0001
    constraint: null
    sentinel: ErrInvalidTransition
    http: 409
  fixture: null
  verification:
    unit:
      - internal/game/internal/core/service/service_test.go::TestService_OnRoundCompleted
      - internal/game/internal/core/service/rides_concurrency_test.go::TestSettlementHandlersSerializeOnTheRound
  expert-ref: docs/league-tokens-learning-phases/phase-08-transactional-outbox-and-events.md
  notes: >
    Authority is the service, not the domain, and that is a deliberate deviation from
    the policy default: settlement is system-initiated, so the domain commands'
    DecisionPhase guards (R-GAME-007) do not apply — the settlement writes go through
    the same DB transition graph as every other writer, via guarded arrivals. The
    final-round fact is the publisher's (RoundService.Close derives IsFinal from
    closed.Number == model.RoundsPerSeason) and reaches game only in the payload, which
    is why two contexts' services appear as authoritative sites: each owns one half of
    the fact across the event seam. runEvent is listed because the ordering is
    load-bearing — claim the event id, take the per-round settlement lock, then read
    rides: without it two settlement handlers of one round race and the second reads a
    stale snapshot (TestSettlementHandlersSerializeOnTheRound). Tie: runEvent fails
    loudly — it never drifts silently, because a dropped claim lets a replay re-run the
    arrivals, which the state gate then refuses (P0001 → 409). Refusal surface: the
    force-resolve arrivals can only fail on the state gate (P0001 → ErrInvalidTransition,
    409). The accepted crash gap (close committed, settlement not yet run) is
    deliberately not a rule — it is swept in Phase 07.

