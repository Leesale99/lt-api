      role: defense-in-depth
      pinned_by: scoreStateRule
    - site: internal/schedule/internal/model/match.go::Match.Winner
      layer: domain
      role: defense-in-depth
      pinned_by: scoreStateRule
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrInvalidTransition
    http: 409
  fixture: scoreStateRule
  verification:
    unit:
