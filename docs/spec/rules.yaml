    tokens - locked amount" plus "ride created", and §"Tasks 2-3" demand transaction
    boundaries drawn by business operation, not by table. Only the ride half is real:
    Service.RideCreate writes the row inside one transaction with the idempotency claim
    and the calendar's write-instant round gate, while the ledger's LockTokens intent
    writes nothing (internal/ledger/postgres.go) because no wallet or token balance
    exists — the locked amount lives on the ride row only. Naming collision to be aware of
    when matching against the code sweep: the doc's Lock is the creation move, while
    `POST /v1/rides/:id/lock` in code is the continuation re-point on an existing ride
