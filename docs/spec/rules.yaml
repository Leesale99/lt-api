- id: R-GAME-011
  title: A registration is managed by its owner or an admin
  statement: |
    The player who registered a season entry may always change or withdraw it;
    any other principal may do so only with the administrative permission. A
    registration that belongs to nobody is admin-only by design, and a
    non-owner's attempt is refused before anything is written.
  module: game
  entity: player
  category: policy
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/game/internal/core/service/player_commands.go::canManagePlayer
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/player_commands.go::Service.PlayerUpdate
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/player_commands.go::Service.PlayerDelete
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/adapter/inbound/http/players.go::actorOf
      layer: handler
      role: advisory-copy
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrForbidden
    http: 403
  fixture: null
  verification:
    unit: []
    e2e:
      - internal/e2e/players_test.go::TestUpdatePlayerOwnership
      - internal/e2e/players_test.go::TestDeletePlayerHandler
    gherkin:
      - docs/spec/features/game/players.feature::A change to someone else's registration is refused
  notes: >
    Authority is the service, which deviates from the policy default (domain):
    ownership is a use-case fact — the domain Player knows its UserID but not
    who is asking, so the decision needs the Actor the transport hands in and
    lives at the use-case door. Three authoritative sites on purpose: the
    predicate (canManagePlayer) plus the two use cases that apply it to a
    different command (patch, delete are disjoint cases, not copies). The
    handler site is advisory only: actorOf turns the request's permissions into
    Actor and therefore shapes *which* refusal the caller sees, but the
    authority still refuses. Verification gap: there is no service-level unit
    test of canManagePlayer — the only pin today is the E2E ownership probe
    (schema policy 3 wants a unit pointer). Ordering fact recorded here because
    it is part of the same refusal: PlayerUpdate/PlayerDelete check the route's
    season against the row before the ownership test, so a player of another
    season answers not-found rather than forbidden (existence is not leaked).
    Scope limit: no equivalent authorization exists for rides — ride commands
    carry no actor at all and no route permission gate, so any authenticated
    principal may spend any player's tokens. That absence is a gap, not a rule.

- id: R-GAME-012
  title: A registration belongs to the caller and the season in the route
  statement: |
    A season entry is created only for the authenticated principal: the request
    can never name a different owner, and the season comes from the route, not
    the body. A create without a principal is refused, never stored ownerless.
  module: game
  entity: player
  category: policy
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/game/internal/core/service/player_commands.go::Service.PlayerCreate
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/adapter/inbound/http/players.go::createPlayer
      layer: handler
      role: advisory-copy
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrForbidden
    http: 401
  fixture: null
  verification:
    unit: []
    e2e:
      - internal/e2e/players_test.go::TestCreatePlayerHandler
      - internal/e2e/players_test.go::TestUpdatePlayerOwnership
    gherkin:
      - docs/spec/features/game/players.feature::A registration made in a season belongs to the member who made it
  notes: >
    Authority is the service (deviation from the policy default of domain,
    because the fact is "who is asking" — the Actor, which the domain never
    sees). The service stamps SeasonID from the route and UserID from the
    principal, overwriting anything the caller supplied, and refuses an
    unauthenticated actor with ErrForbidden. The handler site is advisory: it
    answers a keyless request with the authentication-required 401 before the
    use case runs, so the caller sees 401 rather than the service's 403 — the
    authority still refuses either way. Consequence of both sites: the service's
    ErrForbidden branch is unreachable through HTTP today (the handler's 401
    fires first); it is defence for a non-HTTP caller. Verification gap: the
    only pins are E2E (the "season takes effect from URL, not body" case and the
    owner-registration case); no unit test drives Actor directly.

- id: R-GAME-013
  title: Another context's records are checked when game writes a reference to them
  statement: |
    A registration's season and favourite team must exist in the calendar, and a
    ride's team must exist, at the moment game writes them — the cross-context
    foreign keys no longer do it. A missing favourite team is refused on the
    field, a missing season or team elsewhere is not-found, and a registration
    also requires its user to exist in the identity context.
