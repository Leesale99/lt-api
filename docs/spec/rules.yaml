    Specified only. Phase 06 §"Start simple" (use `accounts`, `journal_entries`,
    `balances`; task 1 "introduce account identities") and §"An account could represent",
    which enumerates the four kinds — player currency, player tokens for a team, team
    reserve, common pool. The enumeration is the doc's whole account budget, so an extra
    kind is a design change, not an implementation detail; the predicate is row-local
    (the kind value), which is why it is a constraint and not a trigger. No such table
    exists: no accounts/journal/balances anywhere in migrations/, and no ledger schema
    (000015 creates schedule/game/identity only; 000018's closing comment defers "the
    Phase 08 outbox, Phase 06 balances" to later migrations).
    Refusal surface undesigned in the doc.

- id: R-LEDGER-005
  title: A balance is the journal's projection
  statement: |
    A balance is only ever an explanation of what the journal says. Every balance change
    is accompanied, in the same transaction, by the journal entries for it, so a player's
    visible balance can always be traced back to the postings that produced it.
  module: ledger
  entity: balance
  category: invariant
  status: specified-only
  authority: database
  mechanism: trigger
