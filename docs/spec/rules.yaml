- id: R-PLATFORM-001
  title: Configuration is resolved flag over environment over default
  statement: |
    A deployment's settings come from its environment, and an operator may override them
    per run with a flag; when neither says anything, a built-in default applies. Values
    that are deployment data rather than per-run operator choices — the cross-origin
    allowlist, the build version — are not overridable at all.
  module: platform
  entity: configuration
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/platform/config/config.go::Parse
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/platform/config/config.go::readEnv
      layer: handler
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/platform/config/config_test.go::TestParse
  notes: >
    One entry point (ADR-014): the binary reduces to Parse(os.Args[1:]) plus wiring, and
    no other code reads os.Getenv or a flag. The flag set is private to the binary (no
    global CommandLine, ContinueOnError so a bad flag is an error, not an exit) — an
    unknown flag fails with the flag named. Authority note: `handler` here means the
    process's intake edge, not a request; the frozen layer enum has no config/startup
    value.
    No refusal of its own: reading a setting cannot fail — a bad or missing value is
    R-PLATFORM-002/003's startup refusal, and this rule only fixes where a value comes
    from.

- id: R-PLATFORM-002
  title: Startup refuses a configuration it cannot honour, and names the variable
  statement: |
    A configuration value that is missing, unparseable or out of its allowed range stops
    the process before it serves anything, and the message names the variable that must
    change. Every bad environment value is reported in one refusal instead of one at a
    time, and nothing degrades into a silent default.
  module: platform
  entity: configuration
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/platform/config/config.go::Parse
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/platform/config/config.go::readEnv
      layer: handler
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: null
  fixture: null
  verification:
    unit:
      - internal/platform/config/config_test.go::TestParse
      - internal/platform/config/config_test.go::TestValidate
  notes: >
    The refusal is a startup error, not an HTTP status (hence http: null): the caller is
    the process, which logs and exits 1. Contract details the tests pin: env values are
    parsed and joined before flags ever parse, so all bad variables surface together;
    flag parse errors are ordinary errors, not exits; a returned error is always safe to
    log verbatim. Two recorded gaps in the "name the variable" contract: the SMTP
    variables are not validated here at all (R-PLATFORM-006 validates them later, in the
    mailer), and the values that do have semantic checks never name the *flag* form —
    validate() reports the env name (PORT, LT_API_DB_MAX_CONNS) even when the bad value
    arrived as a flag.

- id: R-PLATFORM-003
  title: Every setting has a bound, and the bound holds when the feature is off
  statement: |
    Each setting is either usable or refused: the listen port is a real port, the
    environment is one of the three the deployment knows, a database connection string is
    present and parseable, the pool is at least one connection with a positive idle
    limit, and the throttle rates are positive. A setting is judged on its own merits —
    a throttle that is switched off must still be configured with usable values, because
    config that is only correct while something else is off fails unpredictably when it
    is switched on.
  module: platform
  entity: configuration
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/platform/config/config.go::validate
      layer: validator
      role: authoritative
      pinned_by: null
    - site: internal/platform/config/config.go::parseLogLevel
      layer: validator
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: null
  fixture: null
  verification:
    unit:
      - internal/platform/config/config_test.go::TestValidate
      - internal/platform/config/config_test.go::TestParse
  notes: >
    Judgment calls worth naming: the database URL is validated by pgx's own parser, not
    by hand ("pgx is the authority on what a DSN is"), and an empty URL is refused
    explicitly because ParseConfig("") would fall back to libpq environment defaults and
    fail later as a connection error instead of a config error; the per-context URL
    overrides must each parse when present. Not covered by this rule, and worth the
    report's attention: the SMTP port has no bound (any integer is accepted, including
    0 and negatives) and the sender address is not format-checked — both are caught only
    as a non-empty check in the mailer, or not at all. A per-context override that names
    a *database* the context's role cannot see is also not detectable here; that failure
    is deferred to the pool ping at boot.

- id: R-PLATFORM-004
  title: A log level is an enumerated name, never a silent fallback
  statement: |
    The logging level is one of the four names the deployment documents — debug, info,
    warn, error — matched without regard to case. An unrecognized level stops startup and
    the message names where the bad value came from, because a fallback would either
    flood or silence a deployment whose level was mistyped.
  module: platform
  entity: configuration
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/platform/config/config.go::parseLogLevel
      layer: validator
      role: authoritative
      pinned_by: null
    - site: internal/platform/config/config.go::readEnv
      layer: validator
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: null
  fixture: null
  verification:
    unit:
      - internal/platform/config/config_test.go::TestParse
  notes: >
    Kept separate from R-PLATFORM-003 because the refusal carries an extra obligation:
    the source is named ("LOG_LEVEL" from the environment, "-log-level" from args), and
    the environment value is validated before flags parse so a failure at that point can
    only be the flag's. The parser itself is the standard library's — numeric offsets
    such as INFO+2 are therefore accepted even though the message advertises four names.

- id: R-PLATFORM-005
  title: The cross-origin allowlist holds bare origins, never a wildcard
  statement: |
    The deployment lists the origins it serves cross-origin, one bare origin each; a
    wildcard is refused at startup rather than degraded into "allow everything". Origins
    are normalized to lowercase scheme and host with any trailing slash removed, a value
    carrying a path, query or fragment is refused as not an origin, duplicates collapse,
    and an empty list means cross-origin access is simply off.
  module: platform
  entity: cors_origin
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/platform/config/config.go::parseCORSOrigins
      layer: validator
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: null
  fixture: null
  verification:
    unit:
      - internal/platform/config/config_test.go::TestParseCORSOrigins
      - internal/platform/config/config_test.go::TestParse
  notes: >
    The half of CORS the deployment owns (config.Parse is the only caller and wraps any
    failure as "invalid CORS_ORIGINS"; there is deliberately no flag for this value — an
    allowlist is deployment data, not an operator override). The matching half is
    R-KERNEL-010, which compares the canonicalized strings exactly. Normalization is what makes that exact
    comparison correct (schemes and hosts are case-insensitive in URLs), so the two rules
    are paired by the string form they agree on — a shared table of vectors would be the
    ideal fixture and does not exist; the config suite pins the normalization and the
    e2e CORS suite pins exact matching from the other end. Empty (or whitespace/comma
    only) yields nil, which the middleware reads as "no origin is allowed".

# ─────────────────────────────────────────────────────────────────────────────
# platform — mailer, logging, server lifecycle
# ─────────────────────────────────────────────────────────────────────────────

- id: R-PLATFORM-006
  title: Mail cannot be sent from an incomplete configuration
  statement: |
    If the outbound mail settings are incomplete — no host, no credentials, no sender —
    the process refuses to start instead of accepting requests it cannot honour. The
    refusal is distinguished from a delivery failure, so a configuration mistake is never
    retried as if it were a network problem.
  module: platform
  entity: email_delivery
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/platform/mailer/mailer.go::New
      layer: handler
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrMissingCredentials
    http: null
  fixture: null
  verification:
    unit:
      - internal/platform/mailer/mailer_test.go::TestNewRefusesIncompleteConfig
      - internal/platform/mailer/mailer_test.go::TestNewAcceptsCompleteConfig
      - internal/platform/mailer/mailer_test.go::TestSendFailureIsNotConfigError
  notes: >
    Refusal happens at construction, and the composition root builds the mailer *before*
    it dials any database, so a configuration error fails before a connection error (that
    ordering is main's, and it is what makes this a boot rule rather than a first-send
    surprise). The mailer suite now constructs the real adapter: it pins the boot
    refusal for each missing setting and pins that a delivery failure is not reported
    as a configuration error. Recorded asymmetry for the report: the check
    is non-empty only — a sender string that is not an address passes here and fails at
    the first send.

- id: R-PLATFORM-007
  title: A failed delivery is retried a bounded number of times, then reported
  statement: |
    One email delivery is attempted at most three times, with a growing pause between
    attempts that is randomized so that many failing senders do not retry in a
    synchronized wave. A cancelled request stops the ladder at once instead of letting it
    run on after the caller and the process have given up.
  module: platform
  entity: email_delivery
  category: policy
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/platform/mailer/mailer.go::Mailer.Send
      layer: service
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/platform/mailer/mailer_test.go::TestSendRetriesBoundedAttempts
      - internal/platform/mailer/mailer_test.go::TestSendJitterIsRandomized
      - internal/platform/mailer/mailer_test.go::TestSendStopsOnCancellation
  notes: >
    Authority deviates from the category default (policy → domain): the retry decision
    belongs to the delivery adapter, and no domain operation participates. The numbers
    are the code's, not a phase document's: three total attempts, base 500ms doubling per
    attempt, jitter added on top of the base (sleep = base·2^attempt + random(0,
    base·2^attempt), i.e. in [base·2^attempt, 2·base·2^attempt)), no sleep after the last
    attempt, and the cancellation check before each redial and inside each sleep. The
    final error returned is the transport error of the last attempt — the refusal surface
    is a worker-side log line, not an HTTP status (a delivery is booked on the server's
    background tracker, never on the request path). The mailer suite now pins the
    ladder: three bounded attempts, a jitter that varies between runs, and a cancelled
    context that stops the sleep.
    No refusal: a delivery failure is retried and then logged on the server's background
    tracker, never answered to a client, so there is no status to name.

- id: R-PLATFORM-008
  title: One structured log stream per process
  statement: |
    The process emits one machine-readable log stream on standard output at the level the
    deployment chose, and everything that logs — the application and the database driver
    — writes into that same stream. Call-site source locations are attached in
    development only, so production records carry no path bulk.
  module: platform
  entity: log_stream
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/platform/logging/logging.go::New
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/platform/logging/logging.go::newLogger
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/platform/logging/logging.go::Pgx
      layer: handler
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/platform/logging/logging_test.go::TestNewJSONOutput
      - internal/platform/logging/logging_test.go::TestNewLevelFiltering
      - internal/platform/logging/logging_test.go::TestNewSourceShortFileInDevelopment
      - internal/platform/logging/logging_test.go::TestPgxLevelMapping
      - internal/platform/logging/logging_test.go::TestPgxDataBecomesSortedAttributes
  notes: >
    The adapter is the interesting half: the database driver logs through the same
    handler at warn, with sorted attributes (map order would make two records of one
    event non-comparable) and the elapsed-time key renamed to elapsed_ns so it cannot
    collide with the JSON handler's own timestamp field — a record with two "time" keys
    is ambiguous to any parser. Source paths are shortened to <dir>/<file>:<line> in
    development, where a human reads them.
    No refusal: a log stream has nothing to refuse — the failures it records are other
    rules' refusals.

- id: R-PLATFORM-009
  title: Every connection is bounded in time
  statement: |
    The HTTP server bounds how long it will spend on a connection: a read must finish
    within five seconds, a write within ten, and an idle connection is closed after a
    minute. A client that cannot meet those bounds does not hold a server resource
    indefinitely.
  module: platform
  entity: http_server
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/platform/server/server.go::Server.Serve
      layer: handler
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/platform/server/server_test.go::TestServeReadTimeoutClosesSilentConnection
      - internal/platform/server/server_test.go::TestServeWriteTimeoutClosesStreamingResponse
      - internal/platform/server/server_test.go::TestServeIdleTimeoutClosesKeepAlive
  notes: >
    The three values are written once, where the server is built, and are not configurable
    — a deployment cannot tune them today. The server suite now pins all three: a silent
    reader, a stalled streaming write and an idle keep-alive connection are each closed
    at their bound, so a removed or lengthened timeout fails a test. Refusal surface
    is null on purpose: exceeding a write deadline truncates the response and closes the
    connection; there is no named refusal.

- id: R-PLATFORM-010
  title: Shutdown is bounded and never hangs
  statement: |
    When the process is asked to stop, it stops accepting work, gives in-flight requests a
    fixed grace period to finish, and force-closes whatever is left when that period
    expires. A second stop request during the drain closes connections immediately, and
    after the drain the process waits a bounded time for background work before exiting.
    A drain that had to be forced is still a successful stop, not a failure.
  module: platform
  entity: process_lifecycle
  category: orchestration
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/platform/server/server.go::Server.runServer
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/platform/server/server.go::Server.shutdown
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/platform/server/consts.go::ShutdownGracePeriod
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/platform/server/consts.go::BackgroundTaskBudget
      layer: service
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/platform/server/shutdown_test.go::TestDrainTimeoutForceCloses
      - internal/platform/server/shutdown_test.go::TestSecondSignalForceClosesDuringDrain
      - internal/platform/server/shutdown_test.go::TestBackgroundTaskBudgetBoundsWait
  notes: >
    Budgets: ten seconds to drain, five for background work — deliberately nested so the
    worst case stays inside a typical orchestrator kill window. The budgets are options
    (zero value = the package defaults) only so tests can shrink them; the composition
    root passes none. The escalation is asserted, not assumed: a second signal during the
    drain force-closes, a handler that never finishes cannot hold the process, and a
    timeout on the background wait is logged and abandoned rather than returned as an
    error. Recorded gap for the report: nothing asserts the shutdown path end to end from
    cmd/api (the signal→root-context wiring, the pool closes), only the server's own
    lifecycle.
    No refusal: nothing is refused at shutdown — a drain that had to be forced is still a
    successful stop.

- id: R-PLATFORM-011
  title: Background work may fail without taking the process down
  statement: |
    Work that runs after a response has been sent — a mail delivery, a background sweep —
    is tracked by the server and runs under the process's cancellation root. If it fails
    or panics, the failure is recorded and the process keeps serving: once a response has
    been committed, no downstream task may kill it.
  module: platform
  entity: process_lifecycle
  category: policy
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/platform/server/server.go::Server.Background
      layer: service
      role: authoritative
      pinned_by: null
    - site: cmd/api/main.go::main
      layer: service
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/platform/server/server_test.go::TestBackgroundPanicIsContainedAndRecorded
  notes: >
    Authority deviates from the category default (policy → domain): the decision is a
    lifecycle mechanic owned by the process host, with no domain participant. The
    composition root is the other site because booking is explicit there — the identity
    module receives the tracker and the rate-limiter sweep is booked before serving
    starts, so the drain cannot miss it. The panicking task is logged with its value and
    no stack. The server suite now pins the containment: a panicking background task is
    recorded and the process keeps serving, and the wait budget keeps its own test.
    No refusal: containment is about surviving a failure, not refusing a request.

# ─────────────────────────────────────────────────────────────────────────────
# platform — the composition root (boundary rules; ADR-028 is cited in notes
# because no ADR file exists in this repo — the numbers come from code comments)
# ─────────────────────────────────────────────────────────────────────────────

- id: R-PLATFORM-012
  title: Each context owns one schema and speaks only as its own role
  statement: |
    Each bounded context owns one database schema and nothing else: the calendar its
    teams, seasons, rounds and matches; the game its rides, players and idempotency keys;
    identity its users, tokens, roles and permissions. A context reaches the database as
    its own role, which holds privileges on its own schema alone, so an attempt to read
    or write another context's tables is refused by the database itself rather than by
    code review.
  module: platform
  entity: context_schema
  category: boundary
  status: implemented
  authority: composition-root
  mechanism: null
  scope: cross-table
  enforcement:
    - site: migrations/000015_split_context_schemas.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
    - site: migrations/000018_context_roles.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
  refusal:
    code: "42501"
    constraint: null
    sentinel: null
    http: null
  fixture: null
  verification:
    unit:
      - internal/testdb/boundary_test.go::TestGameAppBoundary
      - internal/testdb/boundary_test.go::TestScheduleAppBoundary
      - internal/testdb/boundary_test.go::TestIdentityAppBoundary
  notes: >
    Authority is the composition root (ADR-028): only it decides which pool a context
    receives, and the pools are the boundary's runtime half — the migrations are the
    other (schemas own the tables, 000015; one role per context with CRUD on its own
    schema only, 000018): two authoritative sites for two disjoint facts — which schema
    holds which table, and which role may touch it. The runtime half (each pool's SET ROLE
    pairing, and the rule that no context is ever handed another context's pool) is a
    different authority — the Go connection hook — and is catalogued separately as
    R-PLATFORM-015 precisely because the privilege and the pool's role are enforced in two
    different places.
    Deliberately NOT re-catalogued here: 000018's two SECURITY DEFINER round guards are
    already the defense-in-depth sites of R-GAME-008 — this rule is the role/schema
    separation itself, not the ride gate. game_app therefore holds USAGE on the schedule
    schema and EXECUTE on those two functions, and no table privilege at all. Refusal
    surface: SQLSTATE 42501, unmapped in Go — a boundary violation that ever reached a
    handler would be a generic 500. The boundary suite connects AS the roles directly, so
    it pins these two migrations and says nothing about how production acquires a role
    (that gap is recorded on R-PLATFORM-015).

- id: R-PLATFORM-013
  title: Contexts depend one way and meet only at facades
  statement: |
    A context uses another context only through the other's public operations, in one
    allowed direction, and never reaches into its tables. The context that owns the fact
    answers; the context that needs it declares what it needs and has it satisfied from
    outside; and where the two vocabularies meet, the translation happens in one place so
    neither context speaks the other's error language.
  module: platform
  entity: context_dependency
  category: boundary
  status: implemented
  authority: composition-root
  mechanism: null
  scope: cross-table
  enforcement:
    - site: cmd/api/main.go::main
      layer: service
      role: authoritative
      pinned_by: null
    - site: cmd/api/gamerefs.go::gameRefs.DeletePlayersForSeasonTx
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/identity/identity.go::Module
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/kernel/httpx/middleware.go::UserLookup
      layer: handler
      role: defense-in-depth
      pinned_by: null
    - site: internal/kernel/httpx/middleware.go::PermissionLookup
      layer: handler
      role: defense-in-depth
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/arch/arch_test.go::TestImportBoundaries
      - internal/arch/arch_test.go::TestNonModulesNeverImportModules
      - internal/arch/arch_test.go::TestModulesNeverImportPlatform
      - internal/arch/arch_test.go::TestKernelImportsOnlyKernel
    e2e:
      - internal/e2e/teams_test.go::TestDeleteTeamHandler
  expert-ref: docs/league-tokens-learning-phases/phase-05-modular-monolith-boundaries.md
  notes: >
    Authority is the composition root (ADR-028): it is the only place that may import
    everything, so it is where every direction is chosen — the game context receives the
    calendar facade (wrapped by its own anti-corruption layer), the identity facade
    (as a consumer-side lookup), the ledger and the idempotency engine; the calendar
    receives the game-reference port from outside rather than importing game. Layer note:
    the wiring has no layer of its own in the frozen enum; it is recorded as service.
    The pinned direction itself lives in internal/arch/arch_test.go's allowedImports
    matrix (test-time enforcement, so it appears under verification, not as a site): a
    module reaches another module's root only, nothing below the modules reaches a
    module, no module reaches the platform, the kernel reaches the kernel only. The
    gamerefs adapter is the single vocabulary translator (game's record-in-use becomes
    the calendar's), which is what keeps the delete refusals byte-identical.
    Merged with provisional R-IDENTITY-021 (Phase B3): identity's own statement of this
    rule — other parts reach identity through its published surface only (the two lookups
    httpx declares and the account read the player flow needs), never its models,
    repositories or tables, and the transport layer holds no identity import — is the same
    composition-root decision seen from one edge, so it is one rule with the union of
    sites and identity's slot is freed. The three identity sites are the facade the root
    builds once (identity.Module, authoritative) and the two consumer-side shapes that let
    httpx stay identity-free (defense-in-depth). Identity's facade also re-exports the
    model's types and sentinels as aliases, so callers name identity's vocabulary without
    importing its internals; game's player handler mapping identity.ErrNotFound onto its
    own validation error is the only caller that depends on one of those sentinels. Tie:
    the copies cannot drift silently — TestImportBoundaries walks every import in the tree
    against internal/arch's allowedImports, so an httpx -> identity edge or a schedule ->
    identity edge fails the build's test first. No refusal of its own: the drift is a
    compile- or test-time failure, never a status a client sees — which is also why the
    layer value is approximate (the frozen enum has no composition-root layer; `handler`
    is the seam the facade satisfies). R-GAME-026 is the distinct publisher-language half
    of the same boundary at game's edge.
    stale-pointer: phase-05 §"As built" names `cmd/server` as the composition root and the
    hoisted `internal/idempotency`, and lists "api — the HTTP gateway" as a component; the
    binary is cmd/api, the idempotency engine is internal/kernel/idempotency and there is
    no api package (each module owns its transport). The doc's §"Suggested ownership" is
    already flagged in the extraction as superseded by its own §"As built".

- id: R-PLATFORM-014
  title: The request chain order is fixed
  statement: |
    Every request traverses the same chain in the same order: panic recovery outermost,
    then cross-origin handling, then throttling, then credential resolution, then the
    route. That order is what guarantees a panic is always answered, a preflight never
    spends a throttle token and never needs a credential, and a caller is throttled
    before any work is done on its behalf.
  module: platform
  entity: http_request
  category: orchestration
  status: implemented
  authority: composition-root
  mechanism: null
  scope: null
  enforcement:
    - site: cmd/api/routes.go::routes
      layer: handler
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    e2e:
      - internal/e2e/cors_test.go::TestEnableCORS
      - internal/e2e/auth_test.go::TestAuthenticateMiddleware
  notes: >
    Authority deviates from the category default (orchestration → service): the chain is
    assembled once, at the composition root, over modules that register their own routes
    behind a gate they are handed — no module can reorder the chain, and the router's
    own 404/405 writers sit inside it. The nesting
    RecoverPanic(EnableCORS(RateLimit(Authenticate(router)))) is stated in both
    cmd/api/routes.go and the middleware doc, and the CORS suite asserts the
    preflight-before-router short-circuit. Recorded pinning gap: the e2e harness rebuilds
    the same chain in internal/e2e/compose_test.go::newTestApplication, and nothing ties
    the copy to cmd/api/routes.go — a chain-order change in one place leaves the suite
    green while production differs.

- id: R-PLATFORM-015
  title: A context's pool speaks as that context's role
  statement: |
    The connection pool a context is given runs every one of its statements as that
    context's role, and no context is ever handed another context's pool. The role is
    bound when a connection is established, together with the search path that resolves
    the context's own unqualified table names, so no statement can run with broader
    privileges than the context it serves.
  module: platform
  entity: context_schema
  category: boundary
  status: implemented
  authority: repository
  mechanism: null
  scope: cross-table
  enforcement:
    - site: cmd/api/main.go::openContextPool
      layer: repository
      role: authoritative
      pinned_by: null
    - site: cmd/api/main.go::openPools
      layer: repository
      role: authoritative
      pinned_by: null
  refusal:
    code: "42501"
    constraint: null
    sentinel: null
    http: null
  fixture: null
  verification:
    unit:
      - internal/testdb/context_roles_test.go::TestContextPoolsRunAsContextRole
  notes: >
    Authority deviates from the category default (boundary → composition-root): the
    database half of the boundary is R-PLATFORM-012's, while this is a connection
    mechanic — the pool hook is the only place that decides which role a context's
    statements run as, which makes it a repository decision rather than a wiring choice.
    Both lines are one binding: SET ROLE is what grants the privileges, SET search_path is
    what lets the stores keep unqualified SQL (role-level settings apply at session start,
    not on SET ROLE, so the hook must carry both), and each pool is built from its own
    per-context URL override or from the server's. The migration runner and the seed keep
    unrestricted connections that are never handed to a repository. The harness now pins
    the hook's shape: its ContextPool — the deliberate structural copy of cmd/api's
    openContextPool — is asserted to run every context's statements as that context's
    role, so a dropped SET ROLE or a mis-wired pool fails a test. The residual stands:
    production's own hook is verified by structural identity with that copy, not by a
    direct test.


# ─────────────────────────────────────────────────────────────────────────────
# platform — specified in the phase docs, not built (doc sweep: phase-07 workers)
# ─────────────────────────────────────────────────────────────────────────────

- id: R-PLATFORM-016
  title: A failing background pass never kills the process
  statement: |
    A background pass that fails is logged and retried later: the failure never takes the
    process down and never stops the next pass from running.
  module: platform
  entity: worker
  category: orchestration
  status: specified-only
  authority: composition-root
  mechanism: null
  scope: null
  enforcement: []
  refusal: null
  fixture: null
  verification: {}
  expert-ref: docs/league-tokens-learning-phases/phase-07-background-workers.md
  notes: >
    Specified only. Phase 07 §"Start with one worker" (the loop logs and continues:
    `slog.Error("auto burn failed", ...)` with no return) and task 4 "handle worker errors
    without killing the process". No worker exists, so there is nothing to test. The
    process-level host that would carry it does exist — internal/platform/server
    (Background(fn) tracked on the same waitgroup Serve drains, RootCtx canceled on
    SIGTERM/SIGINT) — but no domain job registers on it. Authority is the composition
    root: the loop and its error containment live in the wiring (main), not in a module.
    Numbered from the phase-doc sweep (was provisional R-PLATFORM-201).

- id: R-PLATFORM-017
  title: A background worker stops on cancellation and is waited for
  statement: |
    A background worker runs under the process's cancellation context and is waited for at
    shutdown: on a signal it stops taking new work, the process waits for what it already
    started, and only then exits.
  module: platform
  entity: worker
  category: orchestration
  status: specified-only
  authority: composition-root
  mechanism: null
  scope: null
  enforcement: []
  refusal: null
  fixture: null
  verification: {}
  expert-ref: docs/league-tokens-learning-phases/phase-07-background-workers.md
  notes: >
    Specified only as a rule about workers. Phase 07 §"Graceful shutdown" shows the
    shape — signal.NotifyContext, a WaitGroup, stop then wg.Wait() — and tasks 5-6 ask for
    context cancellation plus graceful-shutdown or focused lifecycle tests; avoiding
    duplicate work and the "long-running process lifecycle" lessons are the same subject.
    The generic machinery is built for HTTP handlers (internal/platform/server: RootCtx,
    bounded drain, second-signal escalation, waitgroup for Background tasks) but no worker
    is started on it, so the rule has no subject yet. Kept separate from R-PLATFORM-016
    because the two are independently falsifiable: a worker can survive errors while
    failing to drain.
    Numbered from the phase-doc sweep (was provisional R-PLATFORM-202).

# ─────────────────────────────────────────────────────────────────────────────
# Deliberately NOT catalogued yet (still deferred after the Phase B merge)
#
