    recognises, and the database accepts exactly the set the code knows. A
    status word nobody defined is unrepresentable, so no reader ever has to
    guess at an unknown state.
  module: schedule
  entity: season
  category: invariant
  status: implemented
  authority: database
  mechanism: constraint
  scope: row-local
  enforcement:
    - site: migrations/000001_create_initial_game_models.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/model/season.go::ValidateSeasonStatus
      layer: validator
      role: advisory-copy
      pinned_by: null
    - site: internal/schedule/internal/model/round.go::ValidateRoundStatus
      layer: validator
      role: advisory-copy
      pinned_by: null
    - site: internal/schedule/internal/model/match.go::ValidateMatchStatus
      layer: validator
      role: advisory-copy
      pinned_by: null
  refusal:
    code: "23514"
    constraint:
      - seasons_status_check
      - rounds_status_check
      - matches_status_check
    sentinel: null
    http: null
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/repository/constraints_test.go::TestStatusVocabularyIsInSync
      - internal/schedule/internal/model/matches_validation_test.go::TestValidateNewMatch
    e2e:
      - internal/e2e/rounds_test.go::TestUpdateRoundHandler
    gherkin:
      - docs/spec/features/schedule/lifecycle.feature::A status the league never defined cannot be stored
  notes: >
    Three CHECKs of one kind, one rule (per-constraint CHECKs of a kind are
    enforcement sites, not near-duplicate rules). The Go slices (SeasonStatuses,
    RoundStatuses, MatchStatuses) and the CHECK lists must agree — this is the
    one pair in the module tied by a live change detector:
    TestStatusVocabularyIsInSync inserts every Go value through the owner pool
    and fails if the database rejects one, so the two sides cannot drift
    silently. The validators are advisory copies that only improve the refusal
    (a lowercase-exact 422 instead of an unmapped 23514); values are matched
    exactly on the wire, with no normalisation. A 23514 from any of the three
    tables is unmapped in the schedule repositories, so a writer that bypasses
    the validators gets a 500 rather than a 4xx.

- id: R-SCHEDULE-005
  title: A started match freezes the whole hierarchy
  statement: |
    Once any match has started, nothing above it may move backwards: the match
    cannot return to created and cannot be postponed, its round cannot return to
    created or open, and its season cannot return to created or open. The
    calendar's history is durable the moment the first whistle blows.
  module: schedule
  entity: match
  category: invariant
  status: implemented
  authority: database
  mechanism: trigger
  scope: cross-row
  enforcement:
    - site: migrations/000001_create_initial_game_models.up.sql
      layer: db-trigger
      role: authoritative
      pinned_by: null
    - site: migrations/000019_add_status_rank_gates.up.sql
      layer: db-trigger
      role: authoritative
      pinned_by: null
  refusal:
    code: P0001
    constraint:
      - started_match_blocks_status_regression
      - started_match_blocks_round_regression
      - started_match_blocks_season_regression
    sentinel: ErrRecordInUse
    http: 409
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/repository/gates_test.go::TestMatchFreezeGate
      - internal/schedule/internal/repository/gates_test.go::TestRoundFreezeGate
      - internal/schedule/internal/repository/gates_test.go::TestSeasonFreezeGate
    e2e:
      - internal/e2e/matches_test.go::TestPostponeStartedMatchFrozen
    gherkin:
      - docs/spec/features/schedule/lifecycle.feature::A started match cannot be postponed
  notes: >
    Three triggers over one shared fact ("has a match of this row's subtree
    started?") — matches_freeze_gate keys on OLD.starts_at, the round and season
    gates call round_has_started_match / season_has_started_match, so the
    predicate needs a sibling read and uses OLD: only a trigger can say it. The
    gates fire on the status value, not on time passing, which is why an
    edit that moves starts_at forward cannot un-start a match. The refusal is
    P0001 with three distinct raise names but a single meaning; each repository
    maps it by SQLSTATE, not by name (persistence.IsTriggerViolation), to
    ErrRecordInUse, and the handlers answer 409 with the "hierarchy cannot move
    to an earlier stage" message. Known asymmetry: a return to in_progress is
    not in the gates' condition, so only R-SCHEDULE-003 refuses it. The split is
    explicit since 000019: these three functions own the started half (a started
    match may not become created/postponed; a round or season with a started
    match may not become created/open) and the same functions now also carry
    R-SCHEDULE-003's rank half, checked first and raising its own names
    (match_status_regression / round_status_regression /
    season_status_regression); both halves can refuse the same started row, so
    the order is the contract: a rank refusal never reports the started message.
    Two migration sites for the same functions: 000001 created them, 000019 holds
    their current bodies (000014's two-site pattern).

- id: R-SCHEDULE-006
  title: A match carries a score exactly while it is playing or finished
  statement: |
    A match has either no score at all or both halves of one, and never a
    negative number. Scores exist only from the moment the match is in progress
    or closed; a created or postponed match carries none.
  module: schedule
  entity: match
  category: invariant
  status: implemented
  authority: database
  mechanism: constraint
  scope: row-local
  enforcement:
    - site: migrations/000001_create_initial_game_models.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/model/match.go::validateMatchShape
      layer: validator
      role: advisory-copy
      pinned_by: null
  refusal:
    code: "23514"
    constraint:
      - matches_status_score_check
      - matches_score_complete_check
      - matches_home_score_check
      - matches_away_score_check
    sentinel: null
    http: null
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/repository/constraints_test.go::TestMatchConstraints
      - internal/schedule/internal/model/matches_validation_test.go::TestValidateNewMatch
      - internal/schedule/internal/model/matches_validation_test.go::TestValidateMatchUpdate
    gherkin:
      - docs/spec/features/schedule/fixtures.feature::The database refuses a score that does not fit the match
  notes: >
    Four CHECKs, one statement: the score/status matrix and the three bounds are
    the same kind of fact, so they are catalogued together with the constraint
    names kept individually mappable. matches_status_score_check states the
    one-sided matrix (in_progress/closed REQUIRE home_score, created/postponed
    FORBID it) and matches_score_complete_check makes the pair atomic — together
    they are why Match.Winner needs no nil guard on a closed match. The Go copy
    runs in validateMatchShape for both create and update and only exists to
    turn a would-be 500 into a clean 422. Same gap as the other match CHECKs:
    nothing maps 23514 to a sentinel, so a direct writer's refusal is a 500.

- id: R-SCHEDULE-007
  title: A closed match records when it ended
  statement: |
    A match carries an end time if and only if it is closed, and that end is
    later than its start. An in-progress or scheduled match has no end, so a
    reader can never mistake a running match for a finished one.
  module: schedule
  entity: match
  category: invariant
  status: implemented
  authority: database
  mechanism: constraint
  scope: row-local
  enforcement:
    - site: migrations/000005_add_matches_ended_at.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/model/match.go::validateMatchShape
      layer: validator
      role: advisory-copy
      pinned_by: null
  refusal:
    code: "23514"
    constraint: matches_ended_at_check
    sentinel: null
    http: null
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/repository/constraints_test.go::TestMatchConstraints
    gherkin:
      - docs/spec/features/schedule/fixtures.feature::The database refuses an end that does not fit the match
  notes: >
    One biconditional CHECK: (status = 'closed') = (ended_at IS NOT NULL), plus
    ended_at > starts_at. ended_at is nullable by necessity (000005 could not
    add it NOT NULL: the column only exists on closed matches). Coverage gap:
    TestMatchConstraints exercises the *accepting* side (a closed insert must
    supply ended_at, since the stamping trigger only fires on UPDATE) but there
    is no negative case for "closed without ended_at" or "ended_at before
    starts_at", so the CHECK's refusal is not directly probed. Feed-completion
    semantics that the game context reads (NextForTeam's `ended_at IS NULL`
    filter, destination_open_guard's liveness test) all depend on this
    biconditional.

- id: R-SCHEDULE-008
  title: The end of a match is stamped once by the database
  statement: |
    The end time of a match is written once, on the single transition into
    closed, and never rewritten afterwards. The resolve flow supplies the match's
    actual end time — a client fact the time policy (R-SCHEDULE-020) validates —
    and the database keeps it; when a writer supplies no end time, the database
    stamps its own clock. Editing a finished match cannot move its end time.
  module: schedule
  entity: match
  category: invariant
  status: implemented
  authority: database
  mechanism: trigger
  scope: cross-row
  enforcement:
    - site: migrations/000005_add_matches_ended_at.up.sql
      layer: db-trigger
      role: authoritative
      pinned_by: null
    - site: migrations/000020_respect_supplied_match_ended_at.up.sql
      layer: db-trigger
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/repository/constraints_test.go::TestMatchConstraints
    e2e:
      - internal/e2e/matches_test.go::TestResolveMatchHandler
    gherkin:
      - docs/spec/features/schedule/fixtures.feature::The end the organiser resolved with is the end the calendar keeps
  notes: >
    matches_set_ended_at_on_close assigns NEW.ended_at := now() when NEW.status
    becomes closed and OLD.status was not — OLD-vs-NEW, so a trigger, and
    INSERT-only tails are out of its reach. Its current body is 000020's (two
    sites, 000014's pattern: 000005 created the function, 000020 replaced the
    body). **Resolved (Phase G, §6 item #1):** the trigger keeps a supplied
    NEW.ended_at on the transition into closed and stamps now() only when it is
    NULL (000020's body), so the committed row holds the validated value rather
    than the database's clock. ResolveTx returns the row's ended_at through
    RETURNING instead of a pre-seeded request copy, and the HTTP 200 plus the
    post-commit MatchResultRecorded echo the row's values. A direct writer that
    closes without an end time still gets the database's now() backstop, which is
    the half this rule keeps for writers that do not know the fact. The old
    discrepancy is fixed and pinned end to end: TestResolveMatchHandler asserts
    the echoed value AND reads the committed row back to it. Verification gap:
    the stamp-once half is unchanged — nothing probes a second edit of a closed
    match.
    No refusal of its own: the stamp is a write the database performs, not a predicate, so
    nothing is refused and the field stays null — the refusals around it belong to
    R-SCHEDULE-003 (closed is final) and R-SCHEDULE-021 (the guarded resolve).

- id: R-SCHEDULE-009
  title: Odds are a decimal above one, recorded to two places
  statement: |
    A match's home and away odds are both strictly greater than one — a book
    never offers a stake back for nothing — and are recorded to at most two
    decimal places, the precision the bonus arithmetic is derived from.
  module: schedule
  entity: match
  category: invariant
  status: implemented
  authority: database
  mechanism: constraint
  scope: row-local
  enforcement:
    - site: migrations/000001_create_initial_game_models.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
    - site: migrations/000007_alter_matches_odds_precision.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/model/match.go::validateMatchShape
      layer: validator
      role: advisory-copy
      pinned_by: null
  refusal:
    code: "23514"
    constraint:
      - matches_home_odds_check
      - matches_away_odds_check
    sentinel: null
    http: null
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/repository/constraints_test.go::TestMatchConstraints
      - internal/schedule/internal/model/matches_validation_test.go::TestValidateNewMatch
    gherkin:
      - docs/spec/features/schedule/fixtures.feature::The database refuses a fixture priced at evens or below
  notes: >
    Two halves, one operand contract (ADR-021's scale chain: bonus_acc scale 4 =
    tokens 0 + odds 2 + streak-rate budget 2). The bound half is a real
    refusal (23514, app-mirrored, unmapped in the repository so a bypassing
    writer sees a 500); 000007 narrowed numeric(6,3) to numeric(4,2).
    stale-pointer: one finding against 000007's prose. (1) The migration says a 3-dp value
    is "unrepresentable, not rounded on arrival" — that is false: a numeric
    typmod coerces by *rounding*, so an odds of 1.234 arrives as 1.23 silently,
    and nothing (no CHECK on round(odds,2)) refuses it. The rule as the database
    actually enforces it is "at most two places are *stored*", not "a third
    place is refused"; a CHECK would be needed to make the stated claim true.
    The create path therefore echoes the stored odds, not the requested ones:
    MatchRepository.Insert's RETURNING carries home_odds/away_odds and the 201
    reports the row's rounded value (1.234 in, 1.23 out — the pattern 000020 set
    for ended_at on the resolve path), so the discrepancy between request and
    row is visible in the response instead of hidden behind an in-memory copy.
    Third, unremarked: precision 4 caps odds at 99.99, and a larger value
    surfaces as 22003 (numeric overflow), which is unmapped -> 500.

