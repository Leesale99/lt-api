      - internal/e2e/seasons_test.go::TestDeleteCreatedSeasonHandler
    gherkin:
      - docs/spec/features/schedule/deletion.feature::Deleting a season takes its rounds and fixtures with it
  notes: >
    The cascade is three FK behaviours doing the work (rounds_season_id_fkey and
    matches_season_id_fkey / matches_round_id_fkey, all ON DELETE CASCADE), so it
    is a declarative constraint, not a decision anyone makes: the delete gates
    (R-SCHEDULE-023) decide *whether* the parent may go, and once it may, the
    children follow with no code. The composite FK
    (season_id, round_id) -> rounds (season_id, id) is what makes the two paths
    agree: a season delete cannot leave a match whose round id survived, because
    the composite key ties the match's season copy to the round's own. No refusal
    of its own — a cascade cannot fail; the only e2e-visible risk is a partial
    delete, which the two tests rule out by counting rows afterwards. The unit
    pointer is the closest existing probe (TestMatchConstraints's
    "round from another season rejected" case proves the composite key exists);
    no test deletes a *season* in the repository suite.

