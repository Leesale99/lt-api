  notes: >
    Four CHECKs, one rule: the bounds are the same kind of fact, so they are catalogued
    together (constraint names stay individually mappable). The Go copies cover only
    `tokens_locked` (the request edge's own field, so the caller reads a clean 422 on the
    field) — base_at_lock is server-stamped from the ledger's token lookup (a stub today
    — the ride handler hard-codes the base), and acc/streak are written by the ledger and
    the domain, never by the request. The store maps every one of the four by name: a
    23514 becomes a domain.ValidationError naming the field the column bounds and the
    violated check (``tokens_locked: violates rides_tokens_locked_check`` …), which the
    handler renders as the module's 422 — until Phase G the four fell through as raw
    driver errors, so a caller that reached them got a 500 (misalignment-report §6 item
    2, recorded at gate A2/D6, now fixed). The ride INSERT is the only statement in this
    store that carries money — every UPDATE deliberately omits the money columns, the
    ledger's own write owns them — so insertRide is the one classification site; a money
