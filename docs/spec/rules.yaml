    The ordering is part of the rule: the key is validated and the body hashed
    before the body is decoded, so a keyless or oversized request claims
    nothing and inserts nothing. Only two things are framed here, deliberately:
    the stake's *sign and wholeness* (it arrives as an integer and becomes a
    decimal) and the ids' presence. The stake's upper bound, the base price and
    the accrual are not request facts — base_at_lock is stamped by the server
