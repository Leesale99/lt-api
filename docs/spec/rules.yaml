- id: R-KERNEL-001
  title: An idempotent command must carry a usable idempotency key
  statement: |
    Every command that promises retry safety must arrive with a key that names one
    logical request: a non-empty value of at most 255 bytes. A request without one is
    refused as a malformed request, and no writer — a script, a future service — can
    store a key outside those bounds.
  module: kernel
  entity: idempotency_key
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: row-local
  enforcement:
    - site: internal/kernel/idempotency/idempotency.go::ValidateIdempotencyToken
      layer: validator
      role: authoritative
      pinned_by: null
    - site: migrations/000010_add_idempotency_keys_table.up.sql
      layer: db-constraint
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: idempotency_keys_key_check
    sentinel: null
    http: 422
  fixture: null
  verification:
    unit:
      - internal/kernel/idempotency/idempotency_test.go::TestValidateIdempotencyToken
    e2e:
      - internal/e2e/rides_test.go::TestCreateRideHandler
  notes: >
    The validator is the authority (it produces the field error and the 422); the
    table's CHECK is the path-independent backstop, carrying the same 255-byte bound.
    Tie: a wrong copy fails loudly — a key the validator accepts but the table refuses
    makes the command's transaction fail (500), and the CHECK is the only half a
    non-Go writer meets. Two recorded absences the statement deliberately does not
    claim: keys are NOT scoped to a player or a route (000010: "no player scoping yet";
    the endpoint column is ops visibility only, and the primary key is the bare key
    text, so two clients that pick the same key collide in one global namespace), and
    there is NO retention policy — a claimed key lives forever (000010: "no retention
    policy yet"). Both are defect candidates for the Phase B report, not drift.

- id: R-KERNEL-002
  title: A request's dedup identity is a digest of the request itself
  statement: |
    Two requests are the same logical request exactly when they carry the same
    method, the same request URI and — for a command with a body — the same raw body
    bytes. The identity is a SHA-256 digest of exactly those bytes, and a body is
    capped before it is hashed so that the bytes hashed are the bytes decoded: a
    retry of an identical request is recognized as a replay, any changed field makes
    it a different request, and an oversized body claims no key at all.
  module: kernel
  entity: idempotency_key
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: row-local
  enforcement:
    - site: internal/game/internal/adapter/inbound/http/rides.go::Handler.rideCommandToken
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/adapter/inbound/http/rides.go::Handler.createRideToken
      layer: handler
      role: authoritative
      pinned_by: null
    - site: migrations/000010_add_idempotency_keys_table.up.sql
      layer: db-constraint
      role: defense-in-depth
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/game/internal/core/service/idempotency_test.go::TestService_RideCreateIdempotent
    e2e:
      - internal/e2e/rides_test.go::TestCreateRideIdempotentHandler
      - internal/e2e/rides_test.go::TestRideLockIdempotentHandler
      - internal/e2e/rides_test.go::TestCreateRideHandlerBodyTooLarge
  notes: >
    Merged rule (Phase B3): the kernel sweep stated the hash contract and the game
    sweep catalogued the same statement as the ride edge's request identity (a game
    fragment whose draft slot was later reused and has since been retired), so they are
    one rule with the union of sites — module
    kernel, because the kernel owns the claim/hash contract and game only instantiates
    it at /v1/rides (the IRequestToken/claim seam the game handler feeds). One request
    shape, one formula: every ride command — create and the body-less
    lock/burn/unlock alike — hashes method + "\n" + URI + "\n" + the raw body bytes,
    which is why both token builders drain and restore r.Body. The body-less commands
    used to hash method + URI only, so appending a body to POST /v1/rides/:id/burn left
    the dedup identity unchanged (misalignment-report §6 item 15, recorded then fixed):
    the shared formula makes the statement true for every command instead of only the
    one that decodes a body, and the e2e "same key with different body bytes" case
    pins it. Deployment note: the formula change is not backward compatible with keys
    claimed under the old one — a row stored before the deploy carries a URI-only
    digest, so a retry of that request afterwards is the 409 idempotency conflict, not
    a replay; the table keeps no expiry (§6 item 13), so those stale rows age out of
    the retry window with the old deployment rather than expiring. The table's
    request_hash CHECK (exactly 32 bytes)
    is the only backstop and it cannot verify the digest covers the right bytes; a
    second ride-shaped command must remember createRideToken's shape by hand. The
    cap-before-hash half is not decoration: the size limit wraps the body before it is
    drained, so an oversized body is refused with 413 before any hash exists and the
    key is discarded, which is what lets a correct retry with a legal body execute
    fresh instead of conflicting (R-KERNEL-013 owns the cap itself). Tie: the body
    drain is what makes the digest and the decoded body the same bytes; capping the
    body only at decode would hash more bytes than a retry re-reads and turn an
    identical retry into a 409, and the e2e replay subtest fails first. No refusal of
    its own: a digest is a computation and refuses nothing — the 409 a changed request
    under one key produces is R-KERNEL-003's (which owns the caller-facing replay
    statement too), and the 413 is R-KERNEL-013's. Verification gap: the create-side and
    command-side e2e cases (same key, different body -> 409) are the pins on the body
    half; the formula's "same key, different ride" case is asserted at the service level
    with hand-built tokens, so nothing ties the URI half to a test — a change that
    dropped the URI from the hash would replay silently instead of conflicting.

- id: R-KERNEL-003
  title: An idempotency key names exactly one logical request
  statement: |
    Once a key has been used for one request, reusing it for a different request is
    refused as key misuse and the second request never executes. The refusal is a
    conflict, not a retry: a genuine retry resends the identical request and receives
    the stored answer.
  module: kernel
  entity: idempotency_key
  category: policy
  status: implemented
  authority: repository
  mechanism: null
  scope: row-local
  enforcement:
    - site: internal/kernel/idempotency/idempotency.go::Repository.Claim
      layer: repository
      role: authoritative
      pinned_by: null
    - site: migrations/000010_add_idempotency_keys_table.up.sql
      layer: db-constraint
      role: defense-in-depth
      pinned_by: null
    - site: internal/game/internal/adapter/inbound/http/errors.go::Handler.idempotencyConflictResponse
      layer: handler
      role: advisory-copy
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrIdempotencyConflict
    http: 409
  fixture: null
  verification:
    unit:
      - internal/game/internal/core/service/idempotency_test.go::TestService_RideLockIdempotency
      - internal/game/internal/core/service/idempotency_test.go::TestService_RideCreateIdempotent
    e2e:
      - internal/e2e/rides_test.go::TestRideLockIdempotentHandler
      - internal/e2e/rides_test.go::TestCreateRideIdempotentHandler
    gherkin:
      - docs/spec/features/game/idempotency.feature::The same key on a different command is refused, never replayed
  notes: >
    Authority deviates from the category default (policy → domain): the decision is not
    a business policy but a stored-fact comparison — "does this key already name a
    different request" — executed inside the claim, by the repository that owns the
    table. Tie: the table contributes only key uniqueness (its primary key), which is why
    it is a data-carrying backstop for two rows of one key and never for two different
    requests under one key — the claim's comparison is the only site that can tell them
    apart, and it fails loudly (a misuse returns the sentinel, the handler renders 409,
    and the conflict subtest of both idempotency suites fails first). The handler site is an advisory copy in the refusal sense
    only: game translates the kernel's sentinel into the 409 envelope. Recorded gap: the
    kernel's own sentinel is unmapped outside game — any other context that adopts the
    key must add the mapping or answer 500.
    Merged at gate B5 (dupe policy): the game sweep had catalogued this same decision a
    second time, from the ride command's caller-facing side — same `Repository.Claim`
    site, same 409, same two idempotency suites — and it is now this rule's game
    instantiation, not an id of its own (retired R-GAME-019; see the header note above).
    What that statement contributes is the caller's half, and it belongs here because
    every future context inherits it: a genuine retry is never told "conflict" and never
    executes the command again; it receives the recorded answer byte for byte (status +
    raw bytes, never normalized JSON — migration 000010 chose bytea for exactly that
    reason); and single-flight is by insert conflict, so a concurrent duplicate blocks on
    the claim until the winner commits and then reads the committed answer (there is no
    in-flight state machine and no "in progress" status). The "missing row after a lost
    claim" path and a `Save` that matched no row are both the same conflict, not a silent
    re-execute. The game command call-sites that invoke this Claim are catalogued as the
    ordering on R-GAME-018 and as the transactional coupling on R-KERNEL-004 — they are
    enforcement sites of this one authority, not rules of their own.

- id: R-KERNEL-004
  title: A claim commits with its command, never before or after it
  statement: |
    The claim on a key and the stored answer are written inside the command's own
    transaction, so a command that fails leaves no claim behind (failures are never
    cached) and a command that succeeds commits its claim together with its effect. A
    concurrent duplicate waits on the claim and then receives the committed answer
    instead of executing a second time.
  module: kernel
  entity: idempotency_key
  category: orchestration
  status: implemented
  authority: service
  mechanism: null
  scope: row-local
  enforcement:
    - site: internal/game/internal/core/service/ride_commands.go::Service.RideCreate
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/ride_commands.go::Service.RideLock
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/ride_commands.go::Service.RideBurn
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/ride_commands.go::Service.RideUnlock
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/kernel/idempotency/idempotency.go::Repository.Claim
      layer: repository
      role: defense-in-depth
      pinned_by: null
    - site: internal/kernel/idempotency/idempotency.go::Repository.Save
      layer: repository
      role: defense-in-depth
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/game/internal/core/service/idempotency_test.go::TestService_RideLockIdempotency
      - internal/game/internal/core/service/idempotency_test.go::TestService_RideCreateIdempotent
    e2e:
      - internal/e2e/rides_test.go::TestCreateRideIdempotentHandler
      - internal/e2e/rides_test.go::TestRideLockIdempotentHandler
  notes: >
    Four authoritative sites are the four ride commands (disjoint cases, one per command
    — D4's granularity rule); the settlement handlers use the same shape through
    Service.runEvent, catalogued as R-KERNEL-014 because its subject is event
    redelivery. Tie: the kernel half cannot reorder anything — Claim and Save both take
    a caller-owned transaction and never commit, so the ordering decision cannot hide in
    the kernel, and a command that executed before claiming would find no key row and
    fail its own replay test first. Single-flight is by insert conflict (ON
    CONFLICT DO NOTHING), not by an in-flight state machine: there is no "in progress"
    state to time out and no lock to leak. Recorded gap: a claim left behind by a process
    crash mid-command is impossible (the transaction rolls back), but a claimed row with
    the placeholder status/body of an uncommitted command can only exist inside that
    command's transaction, so no reader ever sees it.
    No refusal of its own: the ordering is a property of where the claim is written, not a
    predicate that can refuse — a broken ordering shows up as a lost replay or a
    rolled-back claim, never as a status code of its own.

- id: R-KERNEL-005
  title: The database budget pays for storage, not for hashing
  statement: |
    A request's storage work is measured by one budget of three seconds, and that budget
    opens only around the database calls it pays for. Work that is not storage — a
    password hash on registration, a password comparison on login — runs outside it, so
    a slow machine cannot turn a healthy write into a timeout.
  module: kernel
  entity: db_budget
  category: orchestration
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/kernel/persistence/consts.go::DBTimeout
      layer: repository
      role: defense-in-depth
      pinned_by: null
    - site: internal/identity/internal/service/activation.go::Service.Register
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/service/activation.go::Service.Authenticate
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/kernel/httpx/middleware.go::Middleware.Authenticate
      layer: handler
      role: defense-in-depth
      pinned_by: null
    - site: internal/kernel/httpx/middleware.go::Middleware.RequirePermission
      layer: handler
      role: defense-in-depth
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/identity/internal/service/db_budget_test.go::TestRegisterHashesOutsideDBBudget
      - internal/identity/internal/service/db_budget_test.go::TestAuthenticateComparesOutsideDBBudget
  notes: >
    Stated in the kernel (one constant, one comment: "a database budget, not a request
    budget") and split into place by the use cases: Register hashes first and shares one
    window between its two store writes; Authenticate gives each store call its own
    window and runs the bcrypt compare between them, untimed. The two identity handlers
    that deliberately open no budget at all (users.go::createUser,
    user_tokens.go::createAuthenticationToken) are the negative half of the same rule —
    they are the sites that would silently spend the budget on crypto if the service
    stopped timing its own sections, so they are listed in this note rather than as
    enforcement. Tie: the middleware sites wrap exactly one store lookup each, so no
    CPU-bound work can leak into their window, and every call site (the middleware, every
    module handler, both identity use cases) draws the one constant, so the budget's value
    cannot drift between modules. Two probes now pin the service half: Register's
    bcrypt hash and Authenticate's comparison are asserted to run while no database
    budget is open, so a regression that moves either inside dbCtx fails a test.
    Silent-refusal surface: an exceeded budget surfaces as a 500, not as a named
    refusal.

# ─────────────────────────────────────────────────────────────────────────────
# kernel — validator, persistence (list framing)
# ─────────────────────────────────────────────────────────────────────────────

- id: R-KERNEL-006
  title: Request validation is collected, not fail-fast
  statement: |
    A malformed request reports every offending field at once, one message per field, so
    the caller can fix the whole request in one round trip. A request that fails no
    field check is the only one that reaches the operation behind the handler.
  module: kernel
  entity: http_request
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/kernel/validator/validator.go::Validator.AddError
      layer: validator
      role: authoritative
      pinned_by: null
    - site: internal/kernel/validator/validator.go::Validator.Check
      layer: validator
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 422
  fixture: null
  verification:
    e2e:
      - internal/e2e/teams_test.go::TestCreateTeamHandler
      - internal/e2e/rides_test.go::TestCreateRideHandler
  notes: >
    The kernel is the *collection* policy, not any particular check: a field keeps its
    first message (AddError is first-wins), Valid() is the single gate, and the handler
    answers one 422 carrying the whole map through httpx.FailedValidation (the renderer,
    not a second decision point). Every concrete rule (which fields, which
    bounds) belongs to the module that owns the request and is catalogued there. VERIFY
    GAP: the kernel package has no unit test of its own (no validator_test.go) — the
    first-wins behaviour and the empty-map gate are pinned only indirectly through
    handler-level 422 assertions, and "one message per field" is never asserted.

- id: R-KERNEL-007
  title: A list request is bounded, and its sort never becomes client SQL
  statement: |
    A list request selects a bounded window of results — at least one row, at most one
    hundred per page, and a page number small enough to be addressable — and it may sort
    only by a column the resource publishes. A sort name outside that list is refused as
    a malformed request rather than handed to the database.
  module: kernel
  entity: list_query
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/kernel/persistence/filters.go::ValidateFilters
      layer: validator
      role: authoritative
      pinned_by: null
    - site: internal/kernel/persistence/filters.go::Filters.SortColumn
      layer: repository
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 422
  fixture: null
  verification:
    e2e:
      - internal/e2e/teams_test.go::TestListTeamsHandler
      - internal/e2e/rides_test.go::TestListRidesHandler
  notes: >
    Two halves of one framing rule (the handler applies the defaults
    DefaultPage/DefaultPageSize = 1/20 from the kernel's tuning file, the bounds are
    page > 0 and ≤ 10,000,000,
    page_size 1..100, sort from the per-resource safelist). Tie: the panicking
    SortColumn is the loud half — if a new query path built its ORDER BY from an
    unvalidated sort it panics instead of interpolating, so the copy cannot drift
    silently in the dangerous direction; the safelist arrays (SortSafelistNameID /
    SortSafelistID) are shared, not copied per handler. VERIFY GAP: neither ValidateFilters,
    CalculateMetadata nor ReadIDParam has a unit test; the bounds are pinned only through
    two list handler e2e suites, and the panic path is untested.

# ─────────────────────────────────────────────────────────────────────────────
# kernel — httpx (the HTTP chain)
# ─────────────────────────────────────────────────────────────────────────────

- id: R-KERNEL-008
  title: A malformed credential is refused before the handler
  statement: |
    A request that presents a credential must present it as a bearer token; anything
    else — an unknown scheme, a missing value — is refused as unauthenticated before any
    handler runs. A request that presents no credential at all is not refused here: it
    proceeds as an anonymous caller and is judged by the permission gate.
  module: kernel
  entity: http_request
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/kernel/httpx/middleware.go::Middleware.Authenticate
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/kernel/httpx/errors.go::InvalidAuthenticationToken
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/kernel/httpx/context.go::SetAuthenticatedUser
      layer: handler
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrInvalidToken
    http: 401
  fixture: null
  verification:
    e2e:
      - internal/e2e/auth_test.go::TestAuthenticateMiddleware
  notes: >
    One ladder, one rule: format first (two space-separated parts, scheme Bearer), then
    resolution (the consumer-side UserLookup answers ErrInvalidToken for malformed,
    unknown and expired alike — the middleware never explains which), and an unresolved
    transport error is a 500 rather than a 401. The 401 writer sets WWW-Authenticate:
    Bearer. The deliberate asymmetry — an absent header is anonymous, not unauthorized —
    is what lets the permission gate produce the 401 with its own message; the gate's own
    two statements are catalogued separately as R-IDENTITY-016 (unactivated account) and
    R-IDENTITY-017 (missing code) because their refusal shapes differ. VERIFY GAP: no unit
    test for the middleware (only ratelimiter_test.go exists
    in kernel:httpx); the whole ladder is pinned by one DB-backed e2e suite.

- id: R-KERNEL-009
  title: Each client gets a token bucket, and overdraw is a 429
  statement: |
    Requests are throttled per client address: a client may burst a configured number of
    requests and is then refilled at a configured rate. A client over its allowance is
    refused with a rate-limit answer that tells it how long to wait, and the operation
    behind the gate never runs.
  module: kernel
  entity: rate_limit
  category: policy
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/kernel/httpx/ratelimiter.go::RateLimiter.Allow
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/kernel/httpx/middleware.go::Middleware.RateLimit
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/kernel/httpx/ratelimiter.go::RateLimiter.Sweep
      layer: handler
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 429
  fixture: null
  verification:
    unit:
      - internal/kernel/httpx/ratelimiter_test.go::TestRateLimitMiddlewareDenial
      - internal/kernel/httpx/ratelimiter_test.go::TestRateLimiterSustainedCapped
      - internal/kernel/httpx/ratelimiter_test.go::TestRateLimiterIPsIsolated
      - internal/kernel/httpx/ratelimiter_test.go::TestRateLimiterStaleBucketsEvicted
    e2e: []
  notes: >
    Authority deviates from the category default (policy → domain): throttling is a
    transport decision with no domain participant. Facts the statement relies on: the
    key is the connection's RemoteAddr, never X-Forwarded-For (attacker-controlled unless
    a trusted proxy guarantees it); the denial carries Retry-After as a ceil'd
    whole-second count; a disabled limiter is transparent; a bucket idle longer than
    three minutes is evicted, and a denied request cancels its reservation so a rejection
    does not push the client's next slot further out. Two recorded boundaries, both
    stated in code and neither built: buckets are in memory, so limiting is per process
    (cross-replica limiting needs a shared store), and because the key is RemoteAddr, a
    deployment behind a load balancer throttles the balancer's address — every client
    shares one bucket. The second is a defect candidate, not drift.
    Renumbered at merge (was provisional R-KERNEL-010): R-KERNEL-009 was folded into R-IDENTITY-016/R-IDENTITY-017.

- id: R-KERNEL-010
  title: Cross-origin access is an exact allowlist, silently withheld otherwise
  statement: |
    Only origins named in the deployment's allowlist are granted cross-origin access, by
    exact match. An unlisted origin receives no cross-origin permission at all — the
    request still completes, and the browser withholds the response — and a preflight
    from an allowed origin is answered immediately, before any throttle token is spent
    and before any credential is read.
  module: kernel
  entity: cors_origin
  category: policy
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/kernel/httpx/middleware.go::Middleware.EnableCORS
      layer: handler
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: null
  fixture: null
  verification:
    e2e:
      - internal/e2e/cors_test.go::TestEnableCORS
  notes: >
    Authority deviates from the category default (policy → domain): CORS is
    browser-enforced framing, decided entirely by the transport. The allowlist arrives
    from the deployment (platform's parseCORSOrigins, R-PLATFORM-005, which refuses a
    wildcard at boot); the middleware only matches, echoes the matched origin, adds
    Vary: Origin, and advertises PUT/PATCH/DELETE plus the Authorization and
    Content-Type request headers with a one-day preflight cache. `refusal.http` is null
    because the server never refuses: an empty TrustedOrigins list means "not allowed",
    never "allow all". The silent-withholding choice is a deliberate trade (curl and
    server-to-server calls send no Origin), recorded in the code; it means a
    misconfigured allowlist is invisible server-side.
    Renumbered at merge (was provisional R-KERNEL-011): R-KERNEL-009 was folded into R-IDENTITY-016/R-IDENTITY-017.

- id: R-KERNEL-011
  title: A panic is answered as a server error, never explained
  statement: |
    A failure inside the request chain is answered with the generic server-error message
    and the connection is closed; the cause is recorded in the log and never returned to
    the caller. No internal detail — a stack, a driver message, a query — reaches a
    client through this path.
  module: kernel
  entity: http_request
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/kernel/httpx/middleware.go::Middleware.RecoverPanic
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/kernel/httpx/errors.go::ServerError
      layer: handler
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 500
  fixture: null
  verification:
    unit:
      - internal/kernel/httpx/middleware_test.go::TestRecoverPanicAnswersServerError
  notes: >
    RecoverPanic sits outermost in the chain (R-PLATFORM-014), so it also catches
    failures raised by the other middleware, and it sets Connection: close before
    writing. ServerError is the single 500 writer for every non-domain failure path
    (middleware lookups, unmapped repository errors), which is why an unmapped
    23514/42501 surfaces as the same generic message. A middleware probe now pins it:
    a panic raised in the chain is answered 500 with the generic message and
    Connection: close, and the body carries no panic value or stack.
    Renumbered at merge (was provisional R-KERNEL-012): R-KERNEL-009 was folded into R-IDENTITY-016/R-IDENTITY-017.

- id: R-KERNEL-012
  title: A request body is read under a one-megabyte cap
  statement: |
    No request body is read beyond one megabyte. A body over that limit is refused as too
    large before anything is decoded or deduplicated, so an oversized request claims no
    idempotency key and a retry with a normal body executes normally.
  module: kernel
  entity: http_request
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/kernel/httpx/json.go::MaxBodyBytes
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/kernel/httpx/json.go::ReadJSON
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/adapter/inbound/http/rides.go::Handler.createRideToken
      layer: handler
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 413
  fixture: null
  verification:
    e2e:
      - internal/e2e/rides_test.go::TestCreateRideHandlerBodyTooLarge
  notes: >
    One constant, two intake wraps, and they must agree: ReadJSON caps at decode, and
    the body-carrying idempotent command caps before it drains the body for the digest
    — capping only at decode would buffer an oversize body in full, store a digest of
    bytes the retry can never re-read, and turn an identical retry into a 409 (the
    comment at the site spells that failure out; the drain-then-restore is the reason
    the rule cannot live in ReadJSON alone). Tie: the two wraps share httpx.MaxBodyBytes,
    so the limits cannot diverge; the 413 writer names the limit it enforced.
    Renumbered at merge (was provisional R-KERNEL-013): R-KERNEL-009 was folded into R-IDENTITY-016/R-IDENTITY-017.
    Related but distinct: R-PLATFORM-005 parses the deployment's allowlist at startup, this
    rule matches a request's Origin against it — different authorities (config parsing
    vs request framing), so two rules.

# ─────────────────────────────────────────────────────────────────────────────
# kernel — eventbus (the in-process event seam)
# ─────────────────────────────────────────────────────────────────────────────

- id: R-KERNEL-013
  title: An event is a post-commit, same-process notification
  statement: |
    A domain event is delivered only after the publishing operation has committed, to
    subscribers inside the same process, in the order they subscribed. Nothing is stored
    and nothing is retried: a subscriber that fails, or a process that dies between the
    commit and the delivery, drops that event — the publisher's committed write stands
    and must not be rolled back.
  module: kernel
  entity: domain_event
  category: orchestration
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/kernel/eventbus/eventbus.go::Bus.Publish
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/kernel/eventbus/eventbus.go::Bus.Subscribe
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/service/service.go::publish
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/service/resolve_match.go::Service.ResolveMatch
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/service/round_lifecycle.go::RoundService.Close
      layer: service
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/kernel/eventbus/eventbus_test.go::TestBus_SubscribeAndPublish
      - internal/kernel/eventbus/eventbus_test.go::TestBus_PublishReturnsFirstHandlerError
    e2e:
      - internal/e2e/matches_test.go::TestResolveMatchSettlesRowOnce
  notes: >
    Four disjoint cases of one contract: the bus's delivery mechanics (synchronous,
    registration order, first handler error returned, no persistence) and each
    publisher's post-commit ordering (resolve and close both publish after Commit; the
    shared publish helper drops its context cancellation so a gone request cannot cut
    settlement short, and logs a failure as the accepted gap). Layer note: the kernel bus
    is infrastructure and the layer enum has no infrastructure value (D3 froze seven), so
    it is recorded as service — the layer that owns ordering. Deliberately NOT catalogued
    as implemented: the transactional outbox and at-least-once delivery that phase 08
    specifies (outbox_events table, dispatcher, published_at) do not exist; today's
    guarantee is strictly weaker (at-most-once, in memory). That belongs to the
    expert-docs/phase-08 sweep, not here.
    Renumbered at merge (was provisional R-KERNEL-014): R-KERNEL-009 was folded into R-IDENTITY-016/R-IDENTITY-017.
    No refusal: an event is a notification — nothing is refused when a delivery is dropped,
    which is precisely the gap (the refusal a dropped event would need does not exist; it
    is R-KERNEL-015..017's subject).

- id: R-KERNEL-014
  title: A subscriber claims the event before it acts
  statement: |
    A subscriber records the event's identity before it writes anything, so an event
    delivered twice is handled once: the second delivery finds the claim and completes
    as a no-op. A subscriber that fails leaves no claim behind, so the same event may be
    delivered and processed again.
  module: kernel
  entity: domain_event
  category: orchestration
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/game/internal/core/service/settlement.go::Service.runEvent
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/settlement.go::Service.OnMatchResultRecorded
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/settlement.go::Service.OnRoundCompleted
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/kernel/idempotency/idempotency.go::Repository.Claim
      layer: repository
      role: defense-in-depth
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/game/internal/core/service/service_test.go::TestService_OnMatchResultRecorded
      - internal/game/internal/core/service/service_test.go::TestService_OnRoundCompleted
    e2e:
      - internal/e2e/matches_test.go::TestResolveMatchSettlesRowOnce
  expert-ref: docs/league-tokens-learning-phases/phase-08-transactional-outbox-and-events.md
  notes: >
    The event's ID is the idempotency key and a digest of the payload is its request
    hash, so redelivery of the same event replays (no-op success) while a different
    payload under the same ID is the kernel's conflict — the subscriber inherits
    R-KERNEL-004's claim-first shape rather than inventing one. This is what makes
    R-KERNEL-013's drop-on-failure tolerable: the platform may re-deliver freely, and
    the outbox of phase 08 can replay without the subscriber changing. Recorded gap: the
    two handlers live in one context — a future subscriber elsewhere must adopt the same
    shape by hand; nothing in the kernel enforces that, and no test pins a foreign
    subscriber.
    Merged at gate B5 (dupe policy): the game sweep had catalogued the settlement event's
    claim a second time as its own rule — same `runEvent` site, same two handlers, same
    tests — and it is now this rule's game instantiation (retired R-GAME-022; see the
    header note above). The game call-sites stay listed here as enforcement sites of this
    one authority: `runEvent` is authoritative for the decision, the two handlers are
    authoritative for the same reason (both share the shape — the claim lives in `runEvent`
    and each handler only supplies its endpoint, payload and work, so the three are
    disjoint cases of one statement, not copies), and migration 000010's claim table is the
    shared mechanism the HTTP commands use too.
    Tie: the kernel claim is the same table the HTTP commands use,
    so it cannot drift from this rule without breaking the whole idempotency engine; and
    if the claim were dropped, a replay's arrivals would be refused by the
    state-and-version guard (P0001 → invalid transition), so the mistake is loud rather
    than double-applied. The in-transaction claim is also what makes a *failed*
    settlement retryable: the claim rolls back with the work, which is the opposite of
    caching a failure. No refusal of its own: a replay is a success by design
    (at-least-once delivery, idempotent consumer — phase 08's own wording; the catalog
    never claims "exactly once" delivery), so there is no client-facing refusal here.
    Renumbered at merge (was provisional R-KERNEL-015): R-KERNEL-009 was folded into R-IDENTITY-016/R-IDENTITY-017.

