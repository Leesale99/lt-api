  notes: >
    Specified only. Phase 06 §"Double-entry idea" (a movement has two sides, journal
    entries describe it), task 3 "create balance projections", task 6 "make balance
    operations transactional", and §"Done when" ("trace a buy, lock, loss, and burn
    operation from the API to the ledger journal and back to the player's visible
    balance"). The predicate is an aggregate across two tables (an account's entries vs
    its projected balance), so no CHECK can state it: the schema's sub-order leaves a
    deferred check in the posting transaction or a trigger on the balance row — the doc
    itself does not pick, and also allows the alternative of exposing balances only as a
    view over the journal. Recorded as cross-table deliberately, as the signal to read
    before anyone tries a row-local constraint. No tables exist; refusal undesigned.

- id: R-LEDGER-006
  title: A money operation repeats without moving money twice
  statement: |
    A ledger operation that is retried — after a crash, a restart or a duplicate request —
    applies its movement once: the retry is recognised as the same operation and changes
    no balance and no journal entry.
  module: ledger
  entity: journal_entry
  category: orchestration
  status: specified-only
