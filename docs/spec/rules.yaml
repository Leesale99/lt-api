    package (internal/arch/arch_test.go). What is missing is the refusal: the ledger
    owns no schema at all, so "game_app may not write a balance" has nothing to refuse
    — and today the direction is inverted, the ledger's only SQL being
    `UPDATE rides SET bonus_acc` in internal/ledger/postgres.go (a game table). The
    doc's design implies a ledger schema plus a ledger-only role; that is wiring and
    grants, hence authority: composition-root (the boundary default) rather than the
