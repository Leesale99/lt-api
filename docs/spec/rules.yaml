    matches: a bypassing writer gets 500.

- id: R-SCHEDULE-011
  title: A match belongs to a round of its own season
  statement: |
    A match's season and its round are the same season: the round it names must
    itself belong to the season it names, and both must exist. A calendar can
    therefore never hold a fixture that sits in one season while pointing at
    another season's round.
  module: schedule
  entity: match
  category: invariant
  status: implemented
  authority: database
  mechanism: composite-fk
  scope: cross-table
  enforcement:
    - site: migrations/000001_create_initial_game_models.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/handler/matches.go::createMatch
      layer: handler
      role: advisory-copy
      pinned_by: null
  refusal:
    code: "23503"
    constraint:
      - matches_season_id_round_id_fkey
    sentinel: null
    http: null
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/repository/constraints_test.go::TestMatchConstraints
    e2e:
      - internal/e2e/matches_test.go::TestCreateMatchHandler
    gherkin:
      - docs/spec/features/schedule/fixtures.feature::The database refuses a fixture moved into another season
  notes: >
    The mechanism is the pair rounds_season_id_id_key UNIQUE (season_id, id) +
    matches_season_id_round_id_fkey — a composite FK, i.e. cross-table
    consistency without procedural code. Season_id is denormalised onto matches
    deliberately (000001: "the whole season is one indexed lookup"), and this FK
    is what keeps the denormalised copy honest; matches_season_id_fkey and
    matches_round_id_fkey are the plain-FK halves of the same statement, and
    matches_home/away_team_id_fkey carry the team side. The handler's copy
    (round must belong to the season, both teams must exist -> 422) only changes
    the refusal shape and is advisory by definition. Mapping gap: 23503 is
    mapped to ErrRecordNotFound on match UPDATE only; at INSERT the repository
    returns it raw, so a race between the handler's existence checks and the
    insert answers 500.

- id: R-SCHEDULE-012
  title: A schedule record never changes parents
  statement: |
    A round stays in the season it was created in, and a match stays in the
    season and round it was created in. Re-parenting is not an edit; it is a
    different record.
  module: schedule
  entity: round
  category: invariant
  status: implemented
  authority: repository
  mechanism: null
  scope: cross-table
  enforcement:
    - site: internal/schedule/internal/repository/round_repo.go::RoundRepository.Update
      layer: repository
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/repository/match_repo.go::MatchRepository.Update
      layer: repository
      role: authoritative
      pinned_by: null
    - site: migrations/000001_create_initial_game_models.up.sql
      layer: db-constraint
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: "23503"
    constraint: matches_season_id_round_id_fkey
    sentinel: null
    http: null
  fixture: null
  verification:
    unit: []
    e2e:
      - internal/e2e/rounds_test.go::TestUpdateRoundHandler
      - internal/e2e/matches_test.go::TestUpdateMatchHandler
  notes: >
    Authority deviates from the invariant default (database) on purpose: the
    guarantee is the *absence* of season_id/round_id from the two UPDATE
    statements plus the absence of the fields from the update DTOs — a
    path-dependent guarantee, not a predicate any constraint can state (a CHECK
    cannot see "unchanged", and the DTO is the wire half). The database is a
    partial backstop only: re-parenting a round that already owns matches
    violates the composite FK, but a round with no matches can be re-parented in
    SQL and no CHECK notices. Tie: the DB copy fails loudly — a repository path
    that started writing season_id would trip matches_season_id_round_id_fkey
    (23503) for any round with matches. Coverage gap: the two e2e pointers prove
    the field is rejected on the wire (`{"season_id":2}` is a 400 unknown key)
    but nothing pins the SQL omission itself — there is no call-set fixture, so a
    new update statement that included the parent would fail no test.
    stale-pointer: RoundRepository.Update's own comment states the wrong reason for the
    omission (it says re-parenting would break the composite FK for every match
    "in it"; that is the DB backstop, not the reason the column is absent).

- id: R-SCHEDULE-013
  title: A round's number is one to thirty-eight
  statement: |
    A round is numbered within the season's fixture list: at least one, at most
    thirty-eight — ten matches a round, twenty teams home and away. There is no
    representable round zero or round thirty-nine.
  module: schedule
  entity: round
  category: invariant
  status: implemented
  authority: database
  mechanism: constraint
  scope: row-local
  enforcement:
    - site: migrations/000001_create_initial_game_models.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/model/round.go::ValidateRound
      layer: validator
      role: advisory-copy
      pinned_by: null
  refusal:
    code: "23514"
    constraint: rounds_number_check
    sentinel: null
    http: null
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/repository/constraints_test.go::TestRoundAndSeasonConstraints
    e2e:
      - internal/e2e/rounds_test.go::TestUpdateRoundHandler
      - internal/e2e/rounds_test.go::TestCreateRoundHandler
    gherkin:
      - docs/spec/features/schedule/fixtures.feature::The database refuses a round numbered outside the fixture list
  notes: >
    The bound is duplicated as calendar vocabulary in model.RoundsPerSeason = 38
    (the same constant the close flow reads as "is this the season's last
    round"), so the CHECK and the constant must move together — nothing ties
    them; a change to one alone is silent (the validator/CHECK drift detector,
    TestStatusVocabularyIsInSync, covers statuses only, and number bounds are
    probed only as 0 and 39). RoundsPerSeason is also load-bearing for
    R-SCHEDULE-018 and for the game context's final-round settlement.

- id: R-SCHEDULE-014
  title: A season has one round per number
  statement: |
    Within a season each round number is used once. Two rounds may share a
    number only if they belong to different seasons, so a season's fixture list
    has no duplicates.
  module: schedule
  entity: round
  category: invariant
  status: implemented
  authority: database
  mechanism: constraint
  scope: cross-row
  enforcement:
    - site: migrations/000001_create_initial_game_models.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/repository/round_repo.go::RoundRepository.Insert
      layer: repository
      role: advisory-copy
      pinned_by: null
    - site: internal/schedule/internal/repository/round_repo.go::RoundRepository.updateRound
      layer: repository
      role: advisory-copy
      pinned_by: null
  refusal:
    code: "23505"
    constraint: rounds_season_id_number_key
    sentinel: ErrDuplicateRecord
    http: 409
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/repository/constraints_test.go::TestRoundAndSeasonConstraints
    e2e:
      - internal/e2e/rounds_test.go::TestCreateRoundDuplicateNumber
      - internal/e2e/rounds_test.go::TestUpdateRoundHandler
    gherkin:
      - docs/spec/features/schedule/fixtures.feature::The organiser cannot add a second round 1
  notes: >
    The uniqueness is scoped to the season (UNIQUE (season_id, number)), which is
    the whole point: season 2's round 1 does not collide with season 1's. Both
    repository paths map 23505 to ErrDuplicateRecord and the handlers answer
    409 "a record with these unique values already exists" — the mapping is
    advisory in the copy-policy sense (it changes the refusal shape, the
    constraint still refuses). Note the interaction with R-SCHEDULE-015: because
    renumbering a live or closed round is gated by the sequence, "renumber into a
    free number" is largely unreachable, so most duplicate-number attempts are
    reached through the gate first (the e2e cases rely on that ordering).

- id: R-SCHEDULE-015
  title: A round only goes live under a live season with an unbroken sequence
  statement: |
    A round may only become open or closed while its season is open or in
    progress, and only when every earlier round of that season is already
    closed: the highest closed round must be exactly the predecessor. The season
    can never be one round ahead of its own fixture list, which is what makes
    the last-round flip sound.
  module: schedule
  entity: round
  category: invariant
  status: implemented
  authority: database
  mechanism: trigger
  scope: cross-row
  enforcement:
    - site: migrations/000008_add_round_lifecycle_gates.up.sql
      layer: db-trigger
      role: authoritative
      pinned_by: null
    - site: migrations/000019_add_status_rank_gates.up.sql
      layer: db-trigger
      role: authoritative
      pinned_by: null
  refusal:
    code: P0001
    constraint:
      - round_progress_season_not_live
      - round_sequence_incomplete
    sentinel: ErrRecordInUse
    http: 409
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/service/rounds_close_test.go::TestRoundClose_MidTxFailureLeavesNoTrace
    e2e:
      - internal/e2e/rounds_test.go::TestUpdateRoundHandler
    gherkin:
      - docs/spec/features/schedule/lifecycle.feature::The database refuses a round opened behind an unclosed predecessor
  notes: >
    rounds_progress_gate fires on INSERT beyond created, on every forward
    transition (created -> open/closed, open -> closed) and on any renumbering of
    a *live or closed* round (OLD.number IS DISTINCT FROM NEW.number, inside the
    NEW.status IN ('open','closed') branch), which is what stops a writer from
    renaming its way around the order; a created round renumbers freely, subject
    only to the per-season unique number. Both halves read sibling rows
    (seasons, sibling rounds), so a trigger. Two migration sites, because the
    function's current body is 000019's: 000008 created it, and 000019 gave the
    same function R-SCHEDULE-003's rank half — round_status_regression — checked
    before this gate's own two, so the rank message wins when both could fire
    (that name belongs to R-SCHEDULE-003's refusal list, not this one's). Two findings. (1) Verification gap:
    the season-live half is pinned by the close test, the *sequence* half has no
    direct test anywhere — the two schedule suites instead disable the trigger to
    build fixtures ("rounds_progress_gate requires an unbroken closed sequence,
    which no realistic fixture builds"), so the rule's central half is unpinned
    and the escape hatch is the only evidence it exists. (2) Refusal UX defect:
    every round-update refusal maps to ErrRecordInUse and the handler answers the
    *frozen* message ("a match has already started, so the hierarchy cannot move
    to an earlier stage"). A round going live under a created or closed season
    trips round_progress_season_not_live, and a close over unclosed matches trips
    rounds_close_gate, both with no started match anywhere, and both still get
    that message; those causes are indistinguishable to a client.
    misalignment-report §6 item 5 (docs/spec/history/misalignment-report.md) is
    therefore a false premise: it claims a created round in a created season
    cannot be renumbered, but the gate's renumber branch requires
    NEW.status IN ('open','closed'), so such a renumber is allowed and only the
    per-season unique number can refuse it (§6 item 4 repeats the same example).
    stale-pointer: round_repo.go::updateRound's IsTriggerViolation comment names only
    rounds_freeze_gate as the cause of the P0001 it maps to ErrRecordInUse, but the same
    SQLSTATE also comes from rounds_progress_gate (000008) and rounds_close_gate; the
    mapping is by SQLSTATE, not by raise name, so the comment's list of causes is one
    short (and the handler's frozen-hierarchy message is what makes the gap visible).

- id: R-SCHEDULE-016
  title: A round closes only when every match in it is closed
  statement: |
    A round may not be declared finished while any of its matches is still
    scheduled, running or postponed. Closing is the statement that the round's
    schedule is history, so every fixture in it must already have a result.
  module: schedule
  entity: round
  category: invariant
  status: implemented
  authority: database
  mechanism: trigger
  scope: cross-row
  enforcement:
    - site: migrations/000008_add_round_lifecycle_gates.up.sql
      layer: db-trigger
      role: authoritative
      pinned_by: null
    - site: migrations/000014_relax_rounds_close_gate.up.sql
      layer: db-trigger
      role: authoritative
      pinned_by: null
  refusal:
    code: P0001
    constraint: round_close_has_unclosed_matches
    sentinel: ErrRecordInUse
    http: 409
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/service/rounds_close_test.go::TestRoundClose
    e2e:
      - internal/e2e/rounds_test.go::TestUpdateRoundHandler
    gherkin:
      - docs/spec/features/schedule/lifecycle.feature::The database refuses a close over a match still running
  notes: >
    rounds_close_gate fires only on a transition INTO closed (a
    state-preserving rewrite of an already-closed round passes), then asks
    whether any match of the round is not closed. Two migration sites because the
    function body lives at its latest definition: 000008 created it and 000014
    replaced it to drop the *other* check (undecided won_pending rides), so the
    current body is 000014's and the unclosed-matches half is byte-identical. The
    rule is a genuine DB backstop: the repository's close path does not settle
    matches, so the only way a round closes is that its matches were resolved
    first, by any writer. The replay half of the ride story is in
    R-SCHEDULE-019 (close no longer refuses over undecided rides — a round with
    undecided rides closes fine). stale-pointer resolved: 000008's header claimed
    regressions "are NOT gated here", which was true only for this function's
    sibling (rounds_block_illegal_progress); that function gained its third
    definition in 000019 (R-SCHEDULE-003's rank half), while this rule's
    rounds_close_gate is byte-identical since 000014, so the overstatement is
    historical, not current; 000008 stays unedited as an applied migration.

- id: R-SCHEDULE-017
  title: Opening a round starts its season
  statement: |
    The moment a round is opened, its season starts running: the round's flip
    from created to open and the season's flip to in progress commit together or
    not at all. A live round therefore never sits under a season that has not
    started.
  module: schedule
  entity: round
  category: orchestration
  status: implemented
  authority: service
  mechanism: null
  scope: cross-table
  enforcement:
    - site: internal/schedule/internal/service/round_lifecycle.go::RoundService.UpdateRound
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/repository/round_repo.go::RoundRepository.Open
      layer: repository
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: P0001
    constraint: null
    sentinel: ErrRecordInUse
    http: 409
  fixture: null
  verification:
    unit: []
    e2e:
      - internal/e2e/rounds_test.go::TestOpenRoundStartsSeason
      - internal/e2e/rounds_test.go::TestOpenRoundSeasonFlipIsIdempotent
    gherkin:
      - docs/spec/features/schedule/lifecycle.feature::Opening round 1 starts the season
  notes: >
    The decision is split by nature and the catalog gives it to the service: the
    created -> open transition must be *dispatched* to Open rather than to the
    plain update (a PATCH that went through RoundRepository.Update would flip the
    round and leave the season open), and that dispatch is RoundService.UpdateRound's
    switch. The two writes then ride one transaction inside
    RoundRepository.Open, whose season statement is conditional on status = 'open'
    so it is idempotent. Tie: the repository copy fails loudly — a dispatch that
    bypassed Open makes TestOpenRoundStartsSeason fail (the season would read
    'open' instead of 'in_progress' at version 3), so the pair cannot drift
    silently. Nothing in the database can refuse the wrong order: a round opening
    under a merely *open* (not in_progress) season satisfies
    rounds_progress_gate, so this is not a DB invariant. No unit test exists for
    the service-level dispatch; the two e2e pointers are the whole coverage.

- id: R-SCHEDULE-018
  title: Closing the season's last round closes the season
  statement: |
    Closing round thirty-eight ends the season in the same transaction. That one
    transition is the season's own last step, so a completed fixture list and a
    finished season can never disagree.
  module: schedule
  entity: season
  category: orchestration
  status: implemented
  authority: repository
  mechanism: null
  scope: cross-table
  enforcement:
    - site: internal/schedule/internal/repository/round_repo.go::RoundRepository.Close
      layer: repository
      role: authoritative
      pinned_by: null
  refusal:
    code: P0001
    constraint: null
    sentinel: ErrRecordInUse
    http: 409
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/service/rounds_close_test.go::TestRoundClose
    gherkin:
      - docs/spec/features/schedule/lifecycle.feature::Closing round 38 closes the season
  notes: >
    Authority deviates from the orchestration default (service) because both the
    last-round predicate (round.Number == model.RoundsPerSeason) and the atomic
    pair live in Close: the round flip runs first, then the conditional season
    flip (WHERE status = 'in_progress', so it no-ops for rounds 1-37 and for a
    season that is not live). The statement order is load-bearing and documented
    at the site: the season must still be live while its round closes, or
    rounds_progress_gate (R-SCHEDULE-015) refuses the round flip — the mirror of
    Open, which flips the season before the round. The same predicate is
    re-derived in the service as the RoundCompleted payload's IsFinal
    (R-SCHEDULE-019), so the two halves of "final round" are stated twice: a
    change to RoundsPerSeason moves both, but nothing ties them. The
    "last round closes the season" path is only reachable in tests with
    rounds_progress_gate disabled (the fixture cannot build 37 closed rounds).

- id: R-SCHEDULE-019
  title: A round close announces its results and settles nothing itself
  statement: |
    Finishing a round commits the round and then announces the round's complete
    result set to the rest of the system. The close itself writes no ride and no
    player: settling what was riding on the round is the game context's own,
    later transaction, so undecided rides never block a close and a closed round
    may still carry them.
  module: schedule
  entity: round
  category: orchestration
  status: implemented
  authority: service
  mechanism: null
  scope: cross-table
  enforcement:
    - site: internal/schedule/internal/service/round_lifecycle.go::RoundService.Close
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/repository/match_repo.go::MatchRepository.ResultsForRound
      layer: repository
      role: defense-in-depth
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/service/rounds_close_test.go::TestRoundClose
  notes: >
    The transaction-to-event ordering is the rule: the repository commits the
    flip, the service reads the results and publishes RoundCompleted
    (post-commit, in-process, synchronous) with a fat payload and an EventID the
    subscriber claims. Tie: the repository copy fails loudly enough to be
    noticed — it filters status = 'closed' so a results read can never carry an
    unfinished match, and the close gate (R-SCHEDULE-016) refuses a close over
    unclosed matches, so a wrong read is refused one step earlier. No refusal of
    its own: a failed publish is logged and dropped (the accepted crash gap,
    swept in Phase 07), and the request still succeeds because its write is
    durable; undecided-ride refusal was removed by 000014 and is now the
    designed intermediate state (pinned by TestRoundClose's
    "close over undecided rides commits — settlement is eventual" subtest).
    Migration 000014's header is accurate about this; the ride-side settlement
    rules are game's (R-GAME-009).

- id: R-SCHEDULE-020
  title: A match may only be resolved after it has ended
  statement: |
    A result is accepted only with an end time that lies in the past. Resolving
    a match with an end that has not happened yet is refused before anything is
    written, so no result can be recorded from the future.
  module: schedule
  entity: match
  category: policy
  status: implemented
  authority: service
  mechanism: null
  scope: row-local
  enforcement:
    - site: internal/schedule/internal/service/resolve_match.go::Service.ResolveMatch
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/handler/matches.go::resolveMatch
      layer: handler
      role: advisory-copy
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrEndedAtInFuture
    http: 422
  fixture: null
  verification:
    unit: []
    e2e:
      - internal/e2e/matches_test.go::TestResolveMatchHandler
    gherkin:
      - docs/spec/features/schedule/resolve.feature::A result ending in the future is refused
  notes: >
    Authority deviates from the policy default (domain) deliberately: the rule
    is checked at the *use-case door*, before any transaction is opened, so every
    caller — not only the HTTP handler — passes the same test, and so a legality
    answer can never be outranked by a storage conflict (a closed match would
    otherwise turn this into a 409 first). The validator
    (model.ValidateResolveMatch) deliberately does NOT check the clock: it is
    request shape only, field presence and score arithmetic, and says so at the
    site. Boundary: strictly before now, so ended_at == now is refused. The
    handler's copy is advisory — it turns the sentinel into the same 422 body
    shape the validator produces, which is the pre-split wire contract. No unit
    test covers the service door (the service test suite is close-only); the e2e
    case "ended_at in the future" is the only pointer. See R-SCHEDULE-008: the
    value this rule validates is the one the ended_at trigger keeps on the resolve
    transition (000020 respects a supplied end), so the policy guards a number
    that is actually stored and echoed.

- id: R-SCHEDULE-021
  title: A match is resolved once, against the version the caller holds
  statement: |
    A result may only be written for a match that is in progress, has already
    started, has no end yet, whose round is still open, and whose version is the
    one the caller was shown. A second resolution, a stale caller or a closed
    round is refused and changes nothing.
  module: schedule
  entity: match
  category: orchestration
  status: implemented
  authority: repository
  mechanism: null
  scope: row-local
  enforcement:
    - site: internal/schedule/internal/repository/match_repo.go::MatchRepository.ResolveTx
      layer: repository
      role: authoritative
      pinned_by: null
    - site: internal/schedule/internal/repository/match_repo.go::MatchRepository.classifyResolveRefusal
      layer: repository
      role: advisory-copy
      pinned_by: null
    - site: internal/schedule/internal/service/resolve_match.go::Service.ResolveMatch
      layer: service
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrEditConflict
    http: 409
  fixture: null
  verification:
    unit:
      - internal/game/internal/core/service/rides_concurrency_test.go::TestResolveMatchRaces
    e2e:
      - internal/e2e/matches_test.go::TestResolveMatchHandler
      - internal/e2e/matches_test.go::TestResolveMatchSettlesRowOnce
    gherkin:
      - docs/spec/features/schedule/resolve.feature::A result written against an outdated reading is refused
  notes: >
    Authority deviates from the orchestration default (service) because the
    predicate needs the write instant: it is spelled as the UPDATE's own WHERE
    (status = 'in_progress' AND starts_at < now() AND ended_at IS NULL AND
    version = $n AND EXISTS(round still open)), so a blocked write re-evaluates
    on lock release and 0 rows is the refusal — path-dependent by definition,
    with no call-set fixture, so a new resolve statement that forgot the guard
    would pass every test. The service site is the transaction boundary and the
    ordering (time policy first, then the guarded write) and is listed as
    defense-in-depth. Tie: the service site fails loudly — a wrong boundary loses the
    serialization the race test asserts, so the refused write surfaces there first. Zero rows is ambiguous by construction (unknown match, stale
    version, wrong status, closed round), so classifyResolveRefusal reads beside
    the transaction and names the cause: absent row -> ErrRecordNotFound (404),
    everything else -> ErrEditConflict (409). The classification is advisory in
    the strict sense — the refusal already happened, the read only chooses the
    status code. stale-pointer: ResolveMatch's comment still says the payload's
    winner "is re-checked ... through the rides_state_gate", but 000017 removed
    that cross-context check from the trigger; the re-check is now game's
    resultAgreement in Go (R-GAME-010). The guarded UPDATE's RETURNING now
    carries ended_at, so ResolveTx returns the committed row rather than a
    pre-seeded request copy; the whole 200 body (and the post-commit
    MatchResultRecorded) is the row's values, which makes future trigger drift
    visible at the wire.

- id: R-SCHEDULE-022
  title: A round's gameplay phase follows its match times
  statement: |
    A round is in its action phase until one hour before its first match
    starts, in its match phase from then until one hour after its last match
    ends, and in its decision phase afterwards. A round with no ended match yet
    can never be in the decision phase, so the decision window cannot open on a
    match that is still running.
  module: schedule
  entity: round
  category: policy
  status: implemented
  authority: domain
  mechanism: null
  scope: cross-table
  enforcement:
    - site: internal/schedule/internal/model/round_phase.go::Phase
      layer: domain
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/model/round_phase_test.go::TestPhase
    gherkin:
      - docs/spec/features/schedule/resolve.feature::A lock landing exactly an hour before kickoff is refused
  notes: >
    A pure derivation from two real-world facts (earliest start, latest end of
    the round's matches) — no state of its own, so nothing can drift and nothing
    refuses. The boundary convention is a contract, not an implementation
    detail: an instant landing exactly on a phase edge belongs to the later
    phase, and the test locks that in with nanosecond cases on both edges. The
    facts come from MatchRepository.PhaseForMatch (one statement: round status
    plus min(starts_at)/max(ended_at), grouped by round id), which is a read, not
    an enforcement site; the nil-ended-at rule is what keeps a running round out
    of the decision window. This rule gates nothing by itself: the commands each
    phase allows and their refusal live in game (R-GAME-007), which is the
    catalogued direction of that dependency.

- id: R-SCHEDULE-023
  title: A season or round that has started is durable
  statement: |
    A round that is closed, or any round with a match that has already started,
    cannot be deleted; neither can a season that is in progress, closed, or has
    a started match. Deleting would take the history with it, so the calendar's
    past is not removable.
  module: schedule
  entity: round
  category: invariant
  status: implemented
  authority: database
  mechanism: trigger
  scope: cross-row
  enforcement:
    - site: migrations/000001_create_initial_game_models.up.sql
      layer: db-trigger
      role: authoritative
      pinned_by: null
  refusal:
    code: P0001
    constraint:
      - round_lifecycle_blocks_delete
      - season_lifecycle_blocks_delete
    sentinel: ErrRecordInUse
    http: 409
  fixture: null
  verification:
    unit:
      - internal/schedule/internal/repository/gates_test.go::TestRoundDeleteGateRejectsMatchHistory
      - internal/schedule/internal/repository/gates_test.go::TestSeasonDeleteGateRejectsMatchHistory
    e2e:
      - internal/e2e/rounds_test.go::TestDeleteRoundHandler
      - internal/e2e/seasons_test.go::TestDeleteSeasonHandler
      - internal/e2e/seasons_test.go::TestDeleteSeasonRefusalKeepsSeasonPlayers
    gherkin:
      - docs/spec/features/schedule/deletion.feature::The database refuses to delete a round with a started match
  notes: >
    Two delete gates, one statement (the round level and the season level, taken
    from ADR-007 one level up); both ask the same time fact as the freeze gates
    (round_has_started_match / season_has_started_match) and both are BEFORE
    DELETE, so a row-local constraint could not express them and the sibling read
    makes them cross-row. Matches have no gate of their own — deliberately: a
    closed match inside a still-open round is deletable (the e2e case documents
    that exposure, ADR-007 "one level up"). Refusal UX defect: the handlers write
    the *referential* message ("the record is referenced by other records and
    cannot be deleted") for these two gates, which are about durability, not
    references; a client cannot tell "still in use" from "this is history". The
    season half composes with R-SCHEDULE-026/R-SCHEDULE-027: the season DELETE is
    the refuse point of an all-or-nothing transaction that has already deleted
    the season's players through game (migration 000021), so a gate refusal rolls
    the registrations back instead of leaving the season alive without them — the
    misalignment-report §6 item #6 defect, closed in Phase G. Two refusals end
    that same tx: this gate's P0001 and game's rides_player_id_fkey 23503; both
    arrive as ErrRecordInUse (409).

- id: R-SCHEDULE-024
  title: Deleting a season or a round takes its matches with it
  statement: |
    Removing a season removes its rounds and their matches; removing a round
    removes its matches. Calendar children never outlive their parent, so no
    match can point at a round or season that is gone.
  module: schedule
  entity: match
  category: invariant
  status: implemented
  authority: database
  mechanism: constraint
  scope: cross-table
  enforcement:
