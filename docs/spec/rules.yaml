  notes: >
    Six authoritative sites on purpose: the window is per command, and each command
    states its own (they are disjoint cases, not copies of one statement). The
    `transitions` map supplies the state half of the guard; the phase constant each
    guard compares against supplies the window. The phase *value* is the calendar's
    (schedule derives it from real-world match times through the anti-corruption layer);
    that derivation is a schedule rule, not this one. The refusal is Go-only
    (ErrInvalidRoundPhase, 409) precisely so it stays distinguishable from a state
    refusal — the two are different client-facing errors.

- id: R-GAME-008
  title: A ride write requires an open round at the write instant
  statement: |
    A ride command may only write while the round it touches is open, and that fact is
    pinned at the moment of the write: the calendar's share-locked guard runs inside the
    command's transaction, so a concurrent round close either commits before the command
    reads (and the command is refused) or waits for it.
