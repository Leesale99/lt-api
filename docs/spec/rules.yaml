# ─────────────────────────────────────────────────────────────────────────────
# game — round settlement (the event seam)
# ─────────────────────────────────────────────────────────────────────────────

- id: R-GAME-009
  title: Round completion force-resolves undecided rides
  statement: |
    When a round completes, every ride still waiting on a decision is resolved by the
    system: on rounds one to thirty-seven it is unlocked and the accrued bonus is
    released; on the season's final round it is burned and the accrued bonus is kept,
    because a chase option no longer exists. Still-locked rides of the round's matches
    are settled first, and all of it happens in the one claimed settlement transaction.
  module: game
  entity: ride
  category: policy
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/game/internal/core/service/settlement.go::Service.OnRoundCompleted
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/settlement.go::Service.runEvent
      layer: service
      role: defense-in-depth
      pinned_by: null
    - site: internal/schedule/internal/service/round_lifecycle.go::RoundService.Close
      layer: service
      role: authoritative
      pinned_by: null
  refusal:
    code: P0001
    constraint: null
    sentinel: ErrInvalidTransition
    http: 409
  fixture: null
  verification:
    unit:
      - internal/game/internal/core/service/service_test.go::TestService_OnRoundCompleted
      - internal/game/internal/core/service/rides_concurrency_test.go::TestSettlementHandlersSerializeOnTheRound
    gherkin:
      - docs/spec/features/game/settlement.feature::A completing round unlocks the ride still waiting on a decision
  expert-ref: docs/league-tokens-learning-phases/phase-08-transactional-outbox-and-events.md
  notes: >
    Authority is the service, not the domain, and that is a deliberate deviation from
    the policy default: settlement is system-initiated, so the domain commands'
    DecisionPhase guards (R-GAME-007) do not apply — the settlement writes go through
    the same DB transition graph as every other writer, via guarded arrivals. The
    final-round fact is the publisher's (RoundService.Close derives IsFinal from
    closed.Number == model.RoundsPerSeason) and reaches game only in the payload, which
    is why two contexts' services appear as authoritative sites: each owns one half of
    the fact across the event seam. runEvent is listed because the ordering is
    load-bearing — claim the event id, take the per-round settlement lock, then read
    rides: without it two settlement handlers of one round race and the second reads a
    stale snapshot (TestSettlementHandlersSerializeOnTheRound). Tie: runEvent fails
    loudly — it never drifts silently, because a dropped claim lets a replay re-run the
    arrivals, which the state gate then refuses (P0001 → 409). Refusal surface: the
    force-resolve arrivals can only fail on the state gate (P0001 → ErrInvalidTransition,
    409). The accepted crash gap (close committed, settlement not yet run) is
    deliberately not a rule — it is swept in Phase 07.

- id: R-GAME-010
  title: A settled ride agrees with the committed match result
  statement: |
    A locked ride may only arrive at won_pending when the committed result of its match
    crowns the ride's team, and at lost when it does not; a draw crowns nobody. A
    settlement payload that claims the wrong destination is refused and the whole
    settlement transaction rolls back.
  module: game
  entity: ride
  category: invariant
  status: implemented
  authority: service
  mechanism: null
  scope: cross-table
  enforcement:
    - site: internal/game/internal/core/service/settlement.go::resultAgreement
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/service/settlement.go::Service.settleRideFromResult
      layer: service
      role: defense-in-depth
      pinned_by: scoreStateRule
    - site: internal/schedule/internal/model/match.go::Match.Winner
      layer: domain
      role: defense-in-depth
      pinned_by: scoreStateRule
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrInvalidTransition
    http: 409
  fixture: scoreStateRule
  verification:
    unit:
      - internal/game/internal/core/service/score_state_rule_test.go::TestWinnerScoreStateRule
      - internal/game/internal/core/service/score_state_rule_test.go::TestScoreStateRuleDB
      - internal/schedule/internal/model/matches_winner_test.go::TestWinner
      - internal/game/internal/core/service/service_test.go::TestService_OnMatchResultRecorded
      - internal/game/internal/adapter/outbound/postgres/ride_repo_test.go::TestRideRepository_ArriveTx
    gherkin:
      - docs/spec/features/game/settlement.feature::Each ride arrives where the committed result puts it
      - docs/spec/features/game/settlement.feature::A settlement that misreports the odds is refused and pays nothing
  expert-ref: docs/league-tokens-learning-phases/phase-05-modular-monolith-boundaries.md
  notes: >
    stale-pointer: the rule holds and is fixture-pinned (scoreStateRule: three score
    pairings × both sides, asserted against all three encodings), but the three
    change-detector comments that lead a reader between them are stale. 000011 and
    000013 name "Match.Winner (internal/game/matches.go)" and "the CASE in
    RideStore.UpdateAllForMatchTx (internal/game/rides.go)", and 000017 says the check
    verifies "through the SchedulePort (Store.MatchResultTx)"; after the
    modular-monolith refactor the site is internal/schedule/internal/model/match.go::Match.Winner,
    the payload derivation is settlement.go::Service.settleRideFromResult (there is no
    CASE in SQL any more), the enforcement is settlement.go::resultAgreement, and the
    port method is Schedule.Match. internal/schedule/internal/model/match.go's own
    comment still points at "internal/game/score_state_rule_test.go", which no longer
    exists either. The rule's content is unchanged, so the status stays `implemented`
    (gate A2 / D2: a rotted pointer is not drift); fix the comments at the current
    sites (do not rewrite applied migrations), and this note surfaces in the Phase B
    misalignment report. Authority is the service, deviating from the invariant
    default on purpose: 000017 moved the check out of rides_state_gate because the
    trigger read schedule's matches table — the cross-context read the boundary rule
    removes — so the same refusal now happens in Go inside the same transaction, before
    the arrival write. The two historical refusal names survive as text in the Go
    errors (ride_result_scores_missing / ride_result_disagreement) with no SQLSTATE.
    Since Phase G (§6 item #11) the committed snapshot the agreement re-reads also
    carries the odds: the payload's rate claim is verified against it (refusal text
    ride_result_odds_disagreement, the same ErrInvalidTransition + rollback as the
    other two refusals), and the payout rate is read from the committed row with
    the side picked by the committed team assignment (a side-swapping payload that
    passed a bare pair-compare could not misprice a won ride). The loud refusal is
    this rule's claim-refusal pattern applied to the rate, and R-GAME-026's
    "unverified"/"loud error" language is the same choice.


