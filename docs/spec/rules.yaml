  notes: >
    stale-pointer: the rule holds — the CHECK is enforced, mapped by constraint name to
    ErrInvalidTransition (409), and probed by TestRideMoneyStateCoupling — but migration
    000013's change-detector prose no longer describes the code. It names the domain
    copies as "(internal/game/rides.go)", the persistence copy as
    "rideAutoUnlockSQL's bonus_acc = 0 (internal/game/rounds.go)" and the DB probe as
    "(internal/game/constraints_test.go)". None of those paths exist after the
    modular-monolith refactor: the domain operations are in
    internal/game/internal/core/domain/ride.go, the copy that actually reaches the row
    is internal/ledger/postgres.go::Repository.ReleaseBonus (the repository's UPDATE
    deliberately omits every money column), and the probe is
    internal/game/internal/core/service/constraints_test.go. The rule's content is
    unchanged, so the status stays `implemented` (gate A2 / D2: rot is not drift); the
    applied migration is immutable, so the fix is a comment at the current sites, not a
    migration rewrite, and this `stale-pointer` note surfaces in the Phase B
    misalignment report alongside every `drifted` rule. Second finding: the domain
    copies zero an in-memory Acc that the repository never persists, so they are
    documentation of intent — the load-bearing copies are the CHECK and the ledger's
    release-before-flip order.
    Tie: the ReleaseBonus and domain copies fail loudly — they never drift silently,
    because the CHECK refuses an unlocked/lost row carrying acc (23514 → 409) and
    TestRideMoneyStateCoupling pins the refusal name. A shared fixture (moneyStateRule:
    unlocked/lost/burned × acc 0/100, run through the ledger seam and direct SQL) would
    tie them without relying on the refusal.

- id: R-GAME-006
  title: A win accrues tokens × (odds − 1) × (1 + 0.20 × streak)
  statement: |
    Winning a ride accrues a bonus equal to the locked tokens, multiplied by the
    team's decimal odds minus one, multiplied by a streak multiplier of
    one plus twenty percent for each consecutive win already banked. A loss or an
    unlock forfeits the whole accrued amount; the formula changes with the product, so
    it lives in the domain and never in SQL.
  module: game
  entity: ride
  category: policy
  status: implemented
  authority: domain
  mechanism: null
  scope: null
  enforcement:
    - site: internal/game/internal/core/domain/ride.go::BonusDelta
      layer: domain
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/core/domain/ride.go::CalculateBonus
      layer: domain
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit:
      - internal/game/internal/core/domain/ride_bonus_test.go::TestCalculateBonus
      - internal/game/internal/core/service/service_test.go::TestService_OnMatchResultRecorded
    gherkin:
      - docs/spec/features/game/settlement.feature::A win accrues the stake times the odds minus one times the streak multiplier
  notes: >
    One formula, two entry points: BonusDelta is the one match's increment (what the
    ledger's AccrueBonus applies) and CalculateBonus is delta + acc (what the in-memory
    ride shows). They are listed as two authoritative sites because the accrual total
    and the delta must never disagree — BonusDelta is the statement, CalculateBonus
    delegates to it. The ledger owns the write, not the arithmetic (its AccrueBonus
    takes the delta). streakRate is a ≤2-dp decimal by contract (ADR-021): widening it
    re-opens silent rounding, and bonus_acc's scale assumes the budget. No phase
    document covers this rule; the contract lives in the code comments and ADR-021, so
    expert-ref is omitted rather than pointed at a doc that does not state it.

- id: R-GAME-007
  title: Each ride command opens only in its phase window
  statement: |
    Creating a ride is allowed only before the round's first match; recording a win or a
    loss only while the round's matches are running; continuing, burning or unlocking
    only after the last match of the round has ended. A command issued in the wrong
    window is refused and changes nothing.
  module: game
