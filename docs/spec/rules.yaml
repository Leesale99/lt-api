      - internal/e2e/matches_test.go::TestUpdateMatchHandler
      - internal/e2e/teams_test.go::TestUpdateTeamHandler
      - internal/e2e/seasons_test.go::TestUpdateSeasonHandler
    gherkin:
      - docs/spec/features/schedule/deletion.feature::An edit written against an outdated reading is refused
  notes: >
    Authority deviates from the orchestration default (service) because the
    guarantee is the `AND version = $n` clause inside each UPDATE and the 0-row
    read that follows it: path-dependent, so a new update statement without the
    clause would bypass it silently and no fixture pins the call set. Four
    disjoint cases (one statement per entity). The handler half is advisory in
    two senses: it refuses a mismatching X-Expected-Version *before parsing the
    body* (the documented wire contract, so a bad body cannot outrank a stale
    version), and RoundService.UpdateRound re-verifies the header because a use
    case must not trust that its caller checked. The version bump itself
    (version = version + 1, store-stamped) is a persistence fact, not a business
    decision, and is not catalogued separately. No unit test exists for the CAS
    itself — every pointer is an e2e case.

