      - internal/game/internal/core/service/service_test.go::TestService_OnMatchResultRecorded
      - internal/game/internal/adapter/outbound/postgres/ride_repo_test.go::TestRideRepository_Update
  expert-ref: docs/league-tokens-learning-phases/phase-05-modular-monolith-boundaries.md
  notes: >
    stale-pointer: the rule holds and is fixture-pinned (scoreStateRule: three score
    pairings × both sides, asserted against all three encodings), but the three
    change-detector comments that lead a reader between them are stale. 000011 and
    000013 name "Match.Winner (internal/game/matches.go)" and "the CASE in
    RideStore.UpdateAllForMatchTx (internal/game/rides.go)", and 000017 says the check
    verifies "through the SchedulePort (Store.MatchResultTx)"; after the
    modular-monolith refactor the site is internal/schedule/internal/model/match.go::Match.Winner,
    the payload derivation is settlement.go::Service.settleRideFromResult (there is no
    CASE in SQL any more), the enforcement is settlement.go::resultAgreement, and the
    port method is Schedule.Match. internal/schedule/internal/model/match.go's own
