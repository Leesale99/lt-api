- id: R-KERNEL-015
  title: An event is committed with the change that caused it
  statement: |
    The fact that an event must be published is committed in the same transaction as the
    state change itself: if the change commits the event is owed, and if the change rolls
    back the event was never owed.
  module: kernel
  entity: outbox_event
  category: orchestration
  status: specified-only
  authority: service
  mechanism: null
  scope: null
  enforcement: []
  refusal: null
  fixture: null
  verification: {}
  expert-ref: docs/league-tokens-learning-phases/phase-08-transactional-outbox-and-events.md
  notes: >
    Specified only. Phase 08 §"New concept" states the guarantee verbatim ("The state
    change and the fact that the event should be published are committed together"), and
    §"Example transaction" shows the INSERT INTO outbox_events inside the caller's tx;
    tasks 1-2 are the table and the same-transaction write. What exists is the opposite
    guarantee: delivery is post-commit, in-process and synchronous
    (internal/kernel/eventbus/eventbus.go; internal/schedule/internal/service/service.go
    ::publish on context.WithoutCancel), so a crash between commit and publish drops the
    event — documented as the accepted gap in both files. No outbox_events table exists
    (grep of migrations/ finds only comments pointing at this phase) and no transaction
    contains an append step. Authority is the service: the use case owns the transaction
    that must contain both writes.
    Numbered from the phase-doc sweep (was provisional R-KERNEL-201).

- id: R-KERNEL-016
  title: A relay delivers committed events and marks them published
  statement: |
    Events owed by committed transactions are read from the outbox by a relay that runs
    outside the request, delivered to their consumers, and marked published only after the
    delivery, so a crash leaves the event to be delivered again.
  module: kernel
  entity: outbox_event
  category: orchestration
  status: specified-only
  authority: service
  mechanism: null
  scope: null
  enforcement: []
  refusal: null
  fixture: null
  verification: {}
  expert-ref: docs/league-tokens-learning-phases/phase-08-transactional-outbox-and-events.md
  notes: >
    Specified only. Phase 08 §"Dispatcher" (start with one in-process dispatcher) and the
    orientation sequence diagram: read unpublished events -> deliver -> mark published;
    the minimal schema's nullable published_at is the marker; tasks 3 and 7 add the
    dispatcher and restart/retry tests. Today the bus pushes synchronously from the
    publishing request and carries no persistence, retry or dispatch loop — its own
    package comment says "There is no persistence, retry or at-least-once guarantee". The
    outbox_events table (id, type, aggregate_id, payload, occurred_at, published_at) does
    not exist, so nothing can be read or marked.
    Numbered from the phase-doc sweep (was provisional R-KERNEL-202).

- id: R-KERNEL-017
  title: Delivery is at-least-once and never claimed exactly-once
  statement: |
    An event a transaction committed to publish is eventually delivered at least once, and
    the system makes no exactly-once claim: a consumer must tolerate the same event
    arriving twice.
  module: kernel
  entity: outbox_event
  category: orchestration
  status: specified-only
  authority: service
  mechanism: null
  scope: null
  enforcement: []
  refusal: null
  fixture: null
  verification: {}
  expert-ref: docs/league-tokens-learning-phases/phase-08-transactional-outbox-and-events.md
  notes: >
    Specified only for the delivery half. Phase 08 §"Dispatcher": "A consumer must be
    idempotent. Do not claim 'exactly once'. Aim for: at-least-once delivery + idempotent
    consumers." The idempotent-consumer half IS implemented and belongs to the code sweep:
    both settlement handlers claim the EventID through kernel/idempotency before writing
    (internal/game/internal/core/service/settlement.go::runEvent — "claim the EventID
    first ... a replay is a no-op success"), and test coverage exists in
    service/idempotency_test.go. The delivery half is at-most-once today: a pubsub drop is
    gone forever (no persistence, no retry, no redelivery), so "eventually delivered"
    cannot hold.
    Numbered from the phase-doc sweep (was provisional R-KERNEL-203).

