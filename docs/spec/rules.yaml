- id: R-IDENTITY-001
  title: Identity requests are framed before anything else happens
  statement: |
    A registration must carry a non-empty name of at most five hundred bytes and
    an email that is non-empty and syntactically well formed. Every request that
    carries an email — registration, activation-token request and login alike —
    is held to the same email shape. A request that fails is refused with the
    field errors and creates or changes nothing.
  module: identity
  entity: user
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/identity/internal/model/user.go::ValidateRegistration
      layer: validator
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/model/user.go::ValidateEmail
      layer: validator
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 422
  fixture: null
  verification:
    unit:
      - internal/identity/internal/model/user_test.go::TestValidateRegistration
    e2e:
      - internal/e2e/users_test.go::TestRegisterUserHandler
  notes: >
    Request framing, so the authority is the transport edge (category default), and the
    layer is `validator` because the check lives in a `ValidateX` function the handler
    calls before the use case — the schema's own split (D3). Two sites, one framing step:
    ValidateRegistration is the registration shape (name bounds plus email plus password)
    and ValidateEmail is the standalone shape the token-request and login handlers call.
    Neither is a copy of the other — removing ValidateEmail drops the email check on two
    of the three flows. Callers: Handler.registerUser, Handler.createActivationToken,
    Handler.createAuthenticationToken (internal/identity/internal/handler/users.go,
    internal/identity/internal/handler/user_tokens.go); the handlers are where the 422 is
    written, which is why no handler site is listed (the seeds treat status mapping the
    same way). No phase document states identity's framing rules, so expert-ref is
    omitted. Validators keep collecting every bad field, so one bad field never hides
    another (a case TestValidateRegistration pins).

- id: R-IDENTITY-002
  title: A password is eight to seventy-two bytes, checked before it is hashed
  statement: |
    A password presented at registration or login must be at least eight bytes and
    at most seventy-two bytes long. The ceiling is not cosmetic: the password
    hashing step refuses anything longer than seventy-two bytes outright, while the
    comparison step ignores everything past the seventy-second — so an over-long
    password is either a server error or silently interchangeable with its own
    prefix. Both bounds are checked before any hashing runs, which turns the
    over-long case into a field refusal instead.
  module: identity
  entity: user
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/identity/internal/model/user.go::ValidatePasswordPlaintext
      layer: validator
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 422
  fixture: null
  verification:
    unit:
      - internal/identity/internal/model/user_test.go::TestValidateRegistration
    e2e:
      - internal/e2e/users_test.go::TestRegisterUserHandler
  notes: >
    Two bounds, one statement, one authority: the interval is one fact about the password
    field, so splitting it would create two rules nobody can enforce separately. The
    reason for the ceiling is bcrypt's own behaviour, and it is asymmetric in a way that
    matters: x/crypto/bcrypt's GenerateFromPassword returns ErrPasswordTooLong above 72
    bytes (so hashing first would surface a 500 instead of a 422, and would burn a cost-12
    hash on input about to be rejected — the reasoning the validator comment carries),
    while CompareHashAndPassword keeps the algorithm's historical truncation and compares
    only the first 72 bytes (so a 73-byte candidate matches its own 72-byte prefix). The
    ceiling therefore guards both directions: it is the only thing standing between two
    distinguishable passwords and one. The same validator runs on the login path
    (Handler.createAuthenticationToken), so the interval is a property of the credential,
    not only of registration. Both bounds sit at exactly the boundary in the pinned test
    (72 accepted, 73 refused, 8 refused, "short" refused). The 8-byte floor is a product
    choice with no lower-level backstop: nothing in storage refuses a weaker hash.

- id: R-IDENTITY-003
  title: A password is stored only as its hash, and never leaves the process
  statement: |
    The password a user types is never stored and never written down anywhere: the
    account row holds a deliberately slow, salted hash (bcrypt, work factor twelve)
    and nothing else. The cleartext exists only in memory while the request that
    carried it is in flight.
  module: identity
  entity: user
  category: invariant
  status: implemented
  authority: domain
  mechanism: null
  scope: null
  enforcement:
    - site: internal/identity/internal/model/user.go::password.Set
      layer: domain
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/repository/user_repo.go::UserRepository.Insert
      layer: repository
      role: defense-in-depth
      pinned_by: null
    - site: internal/identity/internal/repository/user_repo.go::UserRepository.update
      layer: repository
      role: defense-in-depth
      pinned_by: null
    - site: migrations/000002_create_users_table.up.sql
      layer: db-constraint
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 500
  fixture: null
  verification:
    unit:
      - internal/identity/internal/model/user_test.go::TestPasswordHashRoundTrip
      - internal/identity/internal/repository/user_repo_test.go::TestInsert
    e2e:
      - internal/e2e/users_test.go::TestRegisterUserHandlerSuccessState
  notes: >
    Authority is the domain, deviating from the invariant default (database) on purpose:
    no constraint can tell a hash from a cleartext, so the database can only demand that
    *something* is there. The decision "a password is only ever handed over hashed" is
    password.Set's, and it is unreachable from outside: the type is unexported, its
    fields are unexported, and callers can only Set (hash a cleartext), Matches (compare)
    or move an opaque hash in and out. The work factor twelve is part of this rule because
    it is the cost that makes the hash useless to an offline attacker at the project's
    chosen budget; the same 12 is what the kernel's DB budget comment warns about
    (hashing must run outside persistence.DBTimeout), and the seed fixtures store
    $2a$12$ hashes. Refusal surface: a nil hash is a programming error, not a client
    error — Insert/update panic ("missing password hash for the user") and the panic
    recovery renders 500; the migrations' password_hash NOT NULL is the last line of
    defence for a writer that bypasses Go. Tie: both repository sites fail loudly — they
    never drift silently, because dropping the panic lets 000002's NOT NULL refuse the
    row (23502) and TestInsert's "hashes are stored, plaintext is not" subtest fails
    first. Coverage gap: no test asserts the work factor (a cost-10 hash would keep every
    named test green); a fixture asserting bcrypt.Cost(hash) == 12 closes it.

- id: R-IDENTITY-004
  title: An account response never carries the hash or the internal version
  statement: |
    What the service says about an account is its id, when it was created, its name,
    its email, whether it is activated and which role it holds. The stored hash and
    the internal version counter are never part of a response.
  module: identity
  entity: user
  category: interface
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/identity/internal/handler/dto.go::newUserResponse
      layer: handler
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit: []
    e2e:
      - internal/e2e/users_test.go::TestRegisterUserHandlerSuccessState
      - internal/e2e/users_test.go::TestRegisterUserHandler
  notes: >
    The frozen wire shape is a presentation decision, so it belongs to the handler: the
    model carries no json tags at all, and the DTO replicates the wire format field by
    field, which is what keeps a future model change from silently publishing the hash.
    The rule is separated from R-IDENTITY-003 because the authority differs (there the
    hash's form is the domain's; here the leak surface is the transport's) — D4 splits on
    authority, not on subject. Refusal: null, because a rule about what is *absent* has
    nothing to refuse; the failure mode is a leak, and the only detector today is
    TestRegisterUserHandlerSuccessState's leak scan of the 201 body. Coverage gap: no
    test inspects a read path's body for the hash (the register response is the only
    account body the suite asserts) and there is no user-read endpoint to inspect.

- id: R-IDENTITY-005
  title: A token is twenty-six random characters
  statement: |
    Every token the service mints is twenty-six characters drawn from the crypto-grade
    random source — a hundred and twenty-eight bits and a bit of slack, so a token
    cannot be guessed and two tokens never collide. A presented credential that is not
    that shape is refused before any lookup runs.
  module: identity
  entity: user_token
  category: invariant
  status: implemented
  authority: domain
  mechanism: null
  scope: null
  enforcement:
    - site: internal/identity/internal/model/user_token.go::GenerateUserToken
      layer: domain
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/model/user_token.go::ValidateUserTokenPlaintext
      layer: validator
      role: defense-in-depth
      pinned_by: null
    - site: internal/identity/identity.go::Module.UserForToken
      layer: handler
      role: advisory-copy
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrInvalidToken
    http: 401
  fixture: null
  verification:
    unit:
      - internal/identity/internal/model/user_token_test.go::TestGenerateUserToken
    e2e:
      - internal/e2e/auth_test.go::TestAuthenticateMiddleware
  notes: >
    The generator is the authority (it produces the shape) and the two other sites are
    copies with different jobs. ValidateUserTokenPlaintext is defence-in-depth and cannot
    drift silently: the generator and the validator both read the named constant
    plaintextTokenLength, and TestGenerateUserToken asserts the minted length against that
    same constant, so a change on one side fails that test first — Tie: the length fact
    has exactly one home. Module.UserForToken is an advisory copy: it refuses a malformed
    credential as the same 401 an unknown token produces, which only avoids a database
    round trip (the lookup would have missed anyway), so its drift is a UX/cost divergence
    and never a security one. Authority deviates from the invariant default (database)
    because nothing in storage knows what a token should look like: the column is bytea and
    any length fits. crypto/rand.Text is the standard-library source the generator calls —
    the alphabet is RFC 4648 base32 and the guarantee is "at least 128 bits", which is why
    the comment names the length rather than inlining 26.

- id: R-IDENTITY-006
  title: Only a token's hash is ever stored
  statement: |
    The service keeps only a fingerprint of each token it issues; the token text itself
    exists in memory, travels to the user once, and is never written to the database.
    A presented token is fingerprinted the same way before the lookup, so a stolen copy
    of the table reveals nothing that works as a credential.
  module: identity
  entity: user_token
  category: invariant
  status: implemented
  authority: database
  mechanism: constraint
  scope: row-local
  enforcement:
    - site: migrations/000003_create_user_tokens_table.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/repository/user_repo.go::UserRepository.getForToken
      layer: repository
      role: defense-in-depth
      pinned_by: null
    - site: internal/identity/internal/repository/user_token_repo.go::UserTokenRepository.insert
      layer: repository
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrNotFound
    http: 401
  fixture: null
  verification:
    unit:
      - internal/identity/internal/repository/user_token_repo_test.go::TestNewAndGetForToken
      - internal/identity/internal/model/user_token_test.go::TestGenerateUserToken
  notes: >
    Database authority because the table's shape is the rule: user_tokens has hash,
    user_id, expiry and scope — there is no column a cleartext token could be stored in,
    and hash is the primary key, so the same fingerprint can never appear twice (a second
    row for one token is a 23505 on user_tokens_pkey, not a duplicate credential). That
    holds for every writer, including psql and a future service, which is exactly what the
    database-vs-repository distinction in the schema asks for. The two Go sites are the
    two halves of the fingerprint that must agree: GenerateUserToken hashes what it mints
    (SHA-256) and getForToken hashes what the caller presented before comparing — Tie:
    they cannot drift silently, because a mismatch makes every token unresolvable and
    TestNewAndGetForToken's "New persists a resolvable token" subtest fails first. The
    e2e fixture mirrors the same discipline: only SHA-256 digests live in seed_test.go and
    the preimages live in auth_test.go. Refusal: a token whose fingerprint is not in the
    table is simply "not found" — the authentication edge renders it 401 (and the
    activation edge renders the same sentinel as a 422 field error).

- id: R-IDENTITY-007
  title: Activation tokens live three days, authentication tokens one day
  statement: |
    A token minted to activate an account is good for three days — long enough for the
    user to find the mail — and a token minted by a successful login is good for one
    day. The lifetime is decided once per flow and stamped on the row at mint time, so
    every token of a kind lives exactly as long as its flow says.
  module: identity
  entity: user_token
  category: policy
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/identity/internal/service/activation.go::Service.Register
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/service/activation.go::Service.RequestActivationToken
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/service/activation.go::Service.Authenticate
      layer: service
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    gherkin:
      - docs/spec/features/identity/account.feature::Her activation token is good for three days
  notes: >
    Authority is the service, deviating from the policy default (domain) because the
    window is a property of the use case that mints the token, not of the token entity:
    the two constants live unexported in internal/identity/internal/service/tokens.go
    (activationTokenTTL = 3 * 24h, authenticationTokenTTL = 24h) and are named only at the
    three mint sites above, which is the code's own argument for keeping them unexported
    ("so the values stay unexported and cannot drift from their use sites"). Three
    authoritative sites on purpose: one per flow, disjoint cases (registration, re-request,
    login), not copies of one statement. Refusal: null — a lifetime is a value, it refuses
    nothing; the refusal an expired token produces is R-IDENTITY-008's. Coverage gap: no
    test pins either duration. Every test seeds tokens with its own time.Hour or
    -time.Minute, so changing 3 days to 3 hours would keep the whole suite green. A fixture
    asserting the minted expiry of each flow (Register / RequestActivationToken /
    Authenticate) against the two constants closes it. The value also has a product
    consequence worth stating at merge time: an authentication token is not sliding — a
    session simply ends 24 hours after login, with no refresh path.

- id: R-IDENTITY-008
  title: A token only works for what it was minted for, while it is fresh
  statement: |
    A presented token resolves to its account only if it was minted for the purpose the
    presenter is using it for and its lifetime has not run out. Both facts are part of
    the same lookup, so a spent, wrong-purpose or expired token is not a distinguishable
    state — it is simply "no such token", and the caller is refused as unauthenticated.
  module: identity
  entity: user_token
  category: policy
  status: implemented
  authority: repository
  mechanism: null
  scope: row-local
  enforcement:
    - site: internal/identity/internal/repository/user_repo.go::UserRepository.getForToken
      layer: repository
      role: authoritative
      pinned_by: null
    - site: internal/identity/identity.go::Module.UserForToken
      layer: handler
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrNotFound
    http: 401
  fixture: null
  verification:
    unit:
      - internal/identity/internal/repository/user_token_repo_test.go::TestNewAndGetForToken
    e2e:
      - internal/e2e/auth_test.go::TestAuthenticateMiddleware
    gherkin:
      - docs/spec/features/identity/account.feature::A sign-in token past its day is refused exactly as one that never existed
  notes: >
    Repository authority: the decision is a predicate on the token row (scope and expiry)
    that needs the fingerprint argument, so it can only live in the lookup SQL — and being
    path-dependent it is only as good as the set of queries that remember it, which is
    exactly the repository trade-off the schema describes. Category policy, so the
    deviation from the domain default needs this note: the *window* is the service's
    (R-IDENTITY-007) but "is this token still usable, and usable as this" is decided at
    read time by the lookup, and there is no second path that could answer differently
    today. The expiry test is `expiry > now()` inside the query, not a Go comparison after
    the read, which is deliberate: an expired row resolves as a miss, so nothing downstream
    has to remember to check. Tie: the facade site cannot drift silently — it maps
    ErrNotFound to httpx.ErrInvalidToken, and if it stopped doing so an expired token would
    surface as a 500 rather than the 401 TestAuthenticateMiddleware's "expired token is
    indistinguishable from unknown" case pins. One lookup serves both purposes (activation
    and authentication) with the scope passed in, so one rule covers both flows.

- id: R-IDENTITY-009
  title: Activating an account spends every activation token it holds
  statement: |
    An activation token is single-use. The moment an account is activated, the activation
    flag is flipped and every activation token that account holds is deleted in the same
    unit of work — so a second presentation of the same token finds nothing, and a crash
    halfway through leaves neither the flip nor the cleanup behind.
  module: identity
  entity: user_token
  category: orchestration
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/identity/internal/service/activation.go::Service.Activate
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/repository/user_repo.go::UserRepository.UpdateTx
      layer: repository
      role: defense-in-depth
      pinned_by: null
    - site: internal/identity/internal/repository/user_token_repo.go::UserTokenRepository.DeleteAllForUserTx
      layer: repository
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrNotFound
    http: 422
  fixture: null
  verification:
    unit:
      - internal/identity/internal/service/activation_test.go::TestActivate
      - internal/identity/internal/repository/user_token_repo_test.go::TestDeleteAllForUser
    gherkin:
      - docs/spec/features/identity/account.feature::The same activation token cannot be spent twice
  notes: >
    Orchestration, service authority, no deviation: the rule spans two repositories, so no
    single repository can own it, and the service holds the pool precisely to open that
    transaction (the ordering argument is in the package comment, and the rejected
    alternatives — a data-modifying CTE, or transaction choreography in the handler — are
    recorded there too). The two repository sites are the statements inside the unit, not
    decisions: Tie: they fail loudly, because leaving the transaction makes the test-only
    delete trigger's refusal commit a half-flip and TestActivate's "a failed cleanup rolls
    the flip back — nothing is left behind" subtest fails first. The cleanup is by scope
    and user, not by the presented token, so an old activation mail cannot be replayed after
    a successful activation, and the deep-link case (two mails in flight) ends with both
    tokens dead — TestDeleteAllForUser pins that only the target scope of the target user
    goes. The concurrent-activation subtest pins the exactly-once shape: a committed
    flip, or ErrEditConflict, or ErrNotFound, never a double bump. The refusal is the
    lookup's miss (unknown, expired, wrong-purpose or already-spent token) rendered as
    "invalid or expired activation token" — 422, deliberately not a 401, because the
    client is activating, not authenticating. Dead code note: the non-transactional
    UserTokenRepository.DeleteAllForUser is unreachable from production (only
    TestDeleteAllForUser calls it).

- id: R-IDENTITY-010
  title: A user row is only rewritten by a writer holding the version it read
  statement: |
    Every write to an account carries the version the writer read, the store bumps it,
    and a write whose claim no longer matches the stored row is refused instead of
    overwriting. Two writers that read the same version cannot both win, so no update is
    silently lost.
  module: identity
  entity: user
  category: invariant
  status: implemented
  authority: repository
  mechanism: null
  scope: null
  enforcement:
    - site: internal/identity/internal/repository/user_repo.go::UserRepository.update
      layer: repository
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/service/activation.go::Service.Activate
      layer: service
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrEditConflict
    http: 409
  fixture: null
  verification:
    unit:
      - internal/identity/internal/repository/user_repo_test.go::TestUpdate
      - internal/identity/internal/service/activation_test.go::TestActivate
  notes: >
    Authority is the repository, deviating from the invariant default (database): a
    compare-and-set on a version column is not expressible as a constraint, and it is
    path-dependent by nature — a new UPDATE that forgets `AND version = $n` bypasses it
    silently. Being honest about the cost: nothing pins the call set today (there is one
    guarded write and two thin wrappers, Update and UpdateTx, both delegating to the same
    statement), so the repository trade-off the schema warns about is currently cheap only
    because the surface is one method. The version counter is bumped by the same statement
    (`version = version + 1`) and returned by RETURNING, so the caller never has to
    remember to increment. Tie: the service site fails loudly — Activate reads the row
    inside its own transaction precisely so the flagged write re-checks against the
    snapshot the read produced, and if the read moved outside the transaction the
    concurrent-activation subtest of TestActivate would start double-bumping.
    Distinguishing the two zero-row causes: the same statement also maps a users_email_key
    violation to ErrDuplicateEmail before the no-rows case, so an email clash is never
    reported as an edit conflict (TestUpdate's duplicate-on-update subtest pins the order).
    Dead code note: the non-transactional UserRepository.Update has no production caller;
    the only production write path is UpdateTx from Activate.

- id: R-IDENTITY-011
  title: An email address identifies exactly one account, whatever its case
  statement: |
    Two accounts can never share an email address, and letter case does not distinguish
    them: registering ALICE@EXAMPLE.COM after alice@example.com is the same identity
    being asked for twice. The store refuses the second registration and the service
    answers it as a field error on the email, so the client sees one clear refusal rather
    than a server error. Logins and lookups compare the same way, case-insensitively.
  module: identity
  entity: user
  category: invariant
  status: implemented
  authority: database
  mechanism: constraint
  scope: row-local
  enforcement:
    - site: migrations/000002_create_users_table.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/repository/user_repo.go::UserRepository.Insert
      layer: repository
      role: defense-in-depth
      pinned_by: null
    - site: internal/identity/internal/repository/user_repo.go::UserRepository.update
      layer: repository
      role: defense-in-depth
      pinned_by: null
    - site: internal/identity/internal/repository/user_repo.go::UserRepository.GetByEmail
      layer: repository
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: "23505"
    constraint: users_email_key
    sentinel: ErrDuplicateEmail
    http: 422
  fixture: null
  verification:
    unit:
      - internal/identity/internal/repository/user_repo_test.go::TestInsert
      - internal/identity/internal/repository/user_repo_test.go::TestUpdate
      - internal/identity/internal/repository/user_repo_test.go::TestGetByEmail
    e2e:
      - internal/e2e/users_test.go::TestRegisterUserHandlerDuplicateIsolatedFromValidation
    gherkin:
      - docs/spec/features/identity/account.feature::An email already taken in another case is refused as a duplicate
  notes: >
    Database authority: one unique index on a citext column, so the refusal survives every
    writer (the app, psql, a future service, a backfill) and the case-insensitivity is a
    property of the column type rather than of any Go comparison. That is the whole reason
    the rule is not the repository's: a new INSERT cannot forget it. The three repository
    sites are the two write translations plus the read half — Tie: they cannot drift
    silently, because the translation is by constraint name (`persistence.IsUniqueViolation
    (err, "users_email_key")`), so renaming or replacing the index in a migration makes
    TestInsert's "duplicate email maps to ErrDuplicateEmail" subtest fail first, and
    GetByEmail's case-insensitive subtest fails the moment the column stops being citext.
    The refusal chain is the one the e2e test p10 was written for: 23505 → ErrDuplicateEmail
    → a single "email" field error with "a user with this email address already exists" and
    422, with no other field errors alongside it (a nil *pgconn.PgError dereference used to
    panic here). Note the mapping is by name only: any other unique violation on the table
    falls through to a 500. Case-insensitivity has a second consequence outside this rule:
    the login lookup is case-insensitive too, so a user may type their address in any case
    and still reach the same account.

- id: R-IDENTITY-012
  title: Registration assigns the standard user role, and a client cannot choose one
  statement: |
    An account always holds exactly one role, and an account created through registration
    always holds the standard user role. The client never supplies, hints at or upgrades
    the role — administrator rights are given, never self-granted — and a body that tries
    to carry one is refused before it reaches the store.
  module: identity
  entity: user
  category: policy
  status: implemented
  authority: repository
  mechanism: null
  scope: null
  enforcement:
    - site: internal/identity/internal/repository/user_repo.go::UserRepository.Insert
      layer: repository
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/handler/dto.go::registerUserInput
      layer: handler
      role: defense-in-depth
      pinned_by: null
    - site: migrations/000004_add_permissions.up.sql
      layer: db-constraint
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 400
  fixture: null
  verification:
    gherkin:
      - docs/spec/features/identity/account.feature::A registration arrives holding the standard user role
  notes: >
    Authority is the repository, deviating from the policy default (domain): the role is
    decided by the INSERT itself, which resolves `(SELECT id FROM roles WHERE name =
    'user')` server-side and never binds a caller value, so there is no domain value a
    caller could reach. Refusal is twofold: the request shape has no field for a role, so
    an attempt to send one is an unknown-key 400 from ReadJSON's DisallowUnknownFields
    (pinned for `activated`/`id` by TestRegisterUserHandler's "unknown fields rejected"), and
    the NOT NULL foreign key added by 000004 refuses any row that arrives without a role.
    Tie: the two copies fail loudly — the handler's DTO cannot accept a role key without a
    struct field, and the DTO site plus the constraint make a self-granted admin either a
    400 or a 23502/23503. Coverage gaps (two): no test asserts the role a registration
    actually receives (TestInsert exercises the INSERT but never reads role_id back, so
    pointing the SELECT at the 'admin' role would keep the suite green), and no test drives
    "role" as an unknown body key. One hazard worth naming: if the 'user' role row ever went
    missing, the sub-select yields NULL, 000004's NOT NULL refuses the insert with 23502,
    and the service returns a 500 — the client would see a server error for a missing
    reference row. Fixtures: a roleAssignmentRule asserting the inserted role_id equals the
    'user' row, run through the repository and through direct SQL, closes both gaps.

- id: R-IDENTITY-013
  title: Every permission code is unique and every grant is one role-permission pair
  statement: |
    A permission is identified by its code, and a code exists once: there is one row per
    thing a caller may do. A grant says "this role carries this permission", at most once
    per pair, and both sides of the pair must exist. So "does this role carry this code"
    has exactly one answer.
  module: identity
  entity: permission
  category: invariant
  status: implemented
  authority: database
  mechanism: constraint
  scope: row-local
  enforcement:
    - site: migrations/000004_add_permissions.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
  refusal:
    code: "23505"
    constraint:
      - permissions_code_key
      - roles_permissions_pkey
    sentinel: null
    http: null
  fixture: null
  verification:
    unit: []
    e2e:
      - internal/e2e/auth_test.go::TestRequirePermissionMiddleware
  notes: >
    Three declarative facts in one rule because they are one shape — the key of a
    permission and the key of a grant: permissions.code UNIQUE, roles_permissions' primary
    key on (role_id, permission_id), and the two foreign keys that keep a grant from naming
    a role or a permission that does not exist. All are constraints, so the database owns
    them and every writer is bound by them. Scope is row-local for the uniqueness half; the
    two foreign keys are the cross-table half, recorded here rather than split out because
    the refusal surface (a 23505 for the duplicate, a 23503 for the dangling reference) is
    the same rule: "there is one row per fact". Refusal is unmapped: nothing in Go translates
    these codes, and the app has no write path to these tables at all (they are seeded by an
    applied migration), so an http status would describe a surface clients cannot reach.
    Verification gap, recorded knowingly: no test probes these constraints directly. Only
    the e2e permission gate exercises the reference data, and it would keep passing if
    roles_permissions' primary key were dropped. A direct-SQL constraints test (attempt a
    duplicate code and a duplicate grant through the owner pool, assert 23505) closes it —
    the same deferred gap the catalog records for game's ride CHECKs. Case sensitivity is
    worth stating: codes are compared exactly, so 'Teams:read' and 'teams:read' would be two
    permissions, and only convention keeps the vocabulary lowercase.

- id: R-IDENTITY-014
  title: Two roles and eleven permission codes are seeded reference data
  statement: |
    The vocabulary of what a caller may do is fixed: eleven codes covering reading and
    writing the calendar, the players and the teams, plus the right to manage other
    people's players. Two roles exist — administrator, which holds all eleven, and the
    standard user, which holds the read codes plus the right to manage its own player.
    Nothing in the running service adds, removes or re-grants a permission.
  module: identity
  entity: permission
  category: policy
  status: implemented
  authority: database
  mechanism: constraint
  scope: row-local
  enforcement:
    - site: migrations/000004_add_permissions.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
  refusal:
    code: "23505"
    constraint:
      - permissions_code_key
      - roles_name_key
    sentinel: null
    http: null
  fixture: null
  verification:
    unit: []
    e2e:
      - internal/e2e/auth_test.go::TestRequirePermissionMiddleware
      - internal/e2e/rides_test.go::TestRideRoutesPermissionGate
    gherkin:
      - docs/spec/features/identity/access.feature::The standard user may read the calendar and manage her own player
  notes: >
    Authority deviates from the policy default (domain) because the matrix is data, not a
    computation: the eleven codes, the two roles and the twenty-two grants are rows an
    applied migration inserts, and the running service has no repository method that writes
    them — permissions are read-only to the application (PermissionRepository has exactly
    one method, GetAllForRole). The mechanism is `constraint` in the schema's closest sense:
    what pins the seed is the keys (a duplicated code is a 23505, a duplicated role name is
    a 23505) and the immutability of applied migrations, so the fix for a wrong matrix is a
    new migration, never an edit. The concrete matrix: admin = seasons, rounds, matches,
    players, teams (read and write) plus players:write:any; user = seasons:read,
    rounds:read, matches:read, players:read, players:write, teams:read. The split between
    the two roles is the actual product policy — a standard user may register and manage
    their own player but may not touch anyone else's, which is why players:write is granted
    and players:write:any is not. Verification is indirect and thin: only
    TestRequirePermissionMiddleware exercises the matrix (it pins that the user role carries
    teams:read and lacks teams:write), and a new migration re-seeding the roles would keep
    it green. Coverage gap: no test asserts the code count, the exact grant sets, or that the
    running service cannot mutate them. The ride surface names no ride-specific code —
    the vocabulary stays closed at eleven — and since Phase G (§6 item #10) the six
    /v1/rides routes are gated with players:read (the two reads) and players:write
    (the four commands): the ride surface is the player domain's action surface (a
    ride spends a named player's tokens), and players:write is the only write code
    the standard user role holds, so the lock flow stays open to an activated
    standard user.

- id: R-IDENTITY-015
  title: A caller's permissions are its role's, resolved on every request
  statement: |
    Permissions hang off roles, never off accounts: there is no per-account grant and no
    cached set, so two accounts holding the same role are indistinguishable to the gate and
    a grant change takes effect on the next request. An account whose role carries nothing
    resolves to an empty set rather than to an error.
  module: identity
  entity: permission
  category: persistence-fact
  status: implemented
  authority: repository
  mechanism: null
  scope: null
  enforcement:
    - site: internal/identity/internal/repository/permission_repo.go::PermissionRepository.GetAllForRole
      layer: repository
      role: authoritative
      pinned_by: null
  refusal: null
  fixture: null
  verification:
    unit: []
    e2e:
      - internal/e2e/auth_test.go::TestRequirePermissionMiddleware
  notes: >
    Persistence-fact with the default authority (repository), because the rule is a
    statement about the store's shape: the permission set is the three-table join through
    roles_permissions keyed on the account's role_id, and there is no table in which an
    account could be granted something on its own. The read happens per gated request with
    no caching, which is a deliberate consequence — it is one extra query per gated request
    in exchange for revocation being immediate, and the middleware times it out on the same
    DB budget as every other store call. Refusal: null, because a resolution never refuses;
    the empty set becomes a 403 at the gate (R-IDENTITY-017). Verification gap: there is no
    unit test for GetAllForRole at all — the only coverage is the e2e gate, which needs a
    live database and a seeded matrix. A repository test (a role with no grants → empty
    set and no error; two roles → no cross-contamination) closes it.

- id: R-IDENTITY-016
  title: An unactivated account is refused at every gated route
  statement: |
    An account that has not completed activation may authenticate, but it may do nothing
    else: every gated route refuses it before any permission is even resolved, with a
    refusal that says the account must be activated. Activation is therefore the gate
    between holding a credential and being allowed to act.
  module: identity
  entity: user
  category: policy
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/kernel/httpx/middleware.go::Middleware.RequirePermission
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/kernel/httpx/errors.go::AuthenticationRequired
      layer: handler
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 403
  fixture: null
  verification:
    unit: []
    e2e:
      - internal/e2e/auth_test.go::TestRequirePermissionMiddleware
      - internal/e2e/rides_test.go::TestRideRoutesPermissionGate
    gherkin:
      - docs/spec/features/identity/access.feature::An unactivated account is refused at every gated page
  notes: >
    The rule is identity's (activation is identity's fact) but it is enforced in the
    platform: the permission middleware consults the activation flag the authentication
    step carried, which is exactly the "enforcement site owned by another layer" case the
    schema asks to record honestly. Authority is the handler — the HTTP gate is the only
    place the decision is taken — deviating from the policy default (domain) because the
    domain holds no operation that refuses work on an unactivated account; the flag is
    carried, not consulted, below the transport. The fact travels a chain worth naming:
    users.activated (000002, NOT NULL) → model.User.Activated → httpx.AuthUser.Activated
    (built by identity.Module.UserForToken) → this branch. The rule covers exactly the
    routes that carry a gate — and since Phase G (§6 item #10) every internal/game route
    does (the six /v1/rides routes name players:read / players:write), so an unactivated
    — or anonymous — caller is refused there too, before the handler runs and before any
    idempotency key is claimed; the Phase B coverage boundary this note recorded is
    closed, and the registrations that carry the gates are naming sites catalogued on
    R-IDENTITY-017. Ordering is deliberate: activation is checked before the role's
    permissions are read, so an unactivated account never causes a permission query, and the
    refusal is 403 with "your user account must be activated to access this resource" —
    distinct from the missing-permission message (R-IDENTITY-017) and from the 401 an
    unauthenticated request receives.
    Folded at merge: provisional R-KERNEL-009 stated this fact as the first rung of the
    permission-gate ladder (anonymous -> 401 AuthenticationRequired, unactivated -> 403
    InactiveAccount, missing code -> 403 MissingPermission), so its activation half now
    lives here and its missing-code half in R-IDENTITY-017 — the kernel sweep's
    middleware internals and its TestRequirePermissionMiddleware pointer are the site and
    verification this rule now carries. The 401 writer (httpx.AuthenticationRequired) is
    listed as defense-in-depth: Tie: it is one branch of the same gate function, so
    deleting it cannot let the activation check pass an anonymous caller silently — the
    gate would answer 403 instead of 401 and the e2e ladder assertion fails first.

- id: R-IDENTITY-017
  title: A gated route requires the exact permission code it names
  statement: |
    A gated route is served only to a principal whose role carries the one permission code
    the route names; anything else is refused before the handler runs. The resolved set
    travels with the request so a handler can ask about further codes without a second
    lookup, and the codes are matched exactly, one at a time.
  module: identity
  entity: permission
  category: policy
  status: implemented
  authority: handler
  mechanism: null
  scope: null
  enforcement:
    - site: internal/kernel/httpx/middleware.go::Middleware.RequirePermission
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/kernel/httpx/context.go::Permissions.Include
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/kernel/httpx/errors.go::MissingPermission
      layer: handler
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/adapter/inbound/http/routes.go::Handler.RegisterRoutes
      layer: handler
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 403
  fixture: null
  verification:
    unit: []
    e2e:
      - internal/e2e/auth_test.go::TestRequirePermissionMiddleware
      - internal/e2e/rides_test.go::TestRideRoutesPermissionGate
    gherkin:
      - docs/spec/features/identity/access.feature::A code the standard user's role half carries is refused
  notes: >
    Authority is the handler, deviating from the policy default (domain): authorization is
    a transport verdict here — the module route tables compose each handler with its code
    (gate("teams:write", ...)), the middleware resolves the set and compares, and no domain
    operation re-checks it. The middleware stays identity-free by design: it declares
    httpx.PermissionLookup and the composition root hands it identity.Module, which is why
    the site is in the kernel while the rule is identity's. Split from R-IDENTITY-016
    against the letter of D4 (same authority, same function): the two branches decide
    different facts (a boolean on the account row versus a set derived from the role) and
    refuse with different messages, and each is independently falsifiable — deleting one
    branch leaves the other's test green. Reviewed and kept apart because merging would give
    one rule two client-facing messages and three status classes. Matching is exact and
    per-code (slices.Contains on the resolved slice), so there is no wildcard, no prefix
    matching and no hierarchy: a role that should be able to write must be granted the exact
    write code. Handler-level second asks (players:write:any) read the same carried set
    through httpx.GetPermissions, which returns an empty set when the gate never ran — so a
    handler that asks beyond its route's code silently sees "no permission" rather than an
    error. Tie: the module route tables name the code each route requires
    (gate("players:write", ...)), and a registration that drops its gate leaves
    the route ungated rather than mis-coded — the e2e ladder
    (TestRideRoutesPermissionGate plus the /v1/teams rungs in
    TestRequirePermissionMiddleware) fails first on the anonymous and unactivated
    rungs, which would receive a handler status instead of 401/403; same shape as
    R-IDENTITY-016's accepted Tie on httpx.AuthenticationRequired. Verification
    gap: the rule is only exercised end to end; there is no unit test of
    the middleware with a fake lookup, so a change to the gate's order or its carried set is
    only caught by the e2e matrix — the two /v1/teams rungs plus the six-route
    /v1/rides ladder (anonymous, unactivated, code-less role, admitted standard
    user).
    Folded at merge: provisional R-KERNEL-009 (the permission-gate ladder) contributes the
    carried-set and refusal-name sites here — httpx.Permissions.Include is the exact-match
    lookup a handler asks with, and it is also what makes the carried set usable beyond
    the route's own code; httpx.MissingPermission is the 403 writer this rule's refusal
    names. R-IDENTITY-016 carries the ladder's other two rungs (anonymous -> 401,
    unactivated -> 403), which is why the kernel rule was folded into two identity rules
    instead of kept as one.

- id: R-IDENTITY-018
  title: A failed login is one refusal, whichever half failed
  statement: |
    An email that no account holds and a password that does not match the account produce
    the same refusal: the same status, the same body, and the same sentence. The service
    never says which half was wrong, so a caller cannot use login to learn whether an
    address is registered.
  module: identity
  entity: user_token
  category: policy
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/identity/internal/service/activation.go::Service.Authenticate
      layer: service
      role: authoritative
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrInvalidCredentials
    http: 401
  fixture: null
  verification:
    unit:
      - internal/identity/internal/model/user_test.go::TestPasswordHashRoundTrip
      - internal/identity/internal/service/authenticate_test.go::TestAuthenticate
    gherkin:
      - docs/spec/features/identity/access.feature::An unknown email is refused as an invalid credential
  notes: >
    Authority is the service, deviating from the policy default (domain): the equivalence is
    created by the use case — an unknown email is translated into the same sentinel a wrong
    password produces (ErrInvalidCredentials), so nothing above it can tell the two apart and
    the handler has exactly one branch to map. The domain contributes the other half of the
    mechanism and cannot drift quietly: password.Matches reports a wrong password as a plain
    (false, nil) instead of bcrypt's sentinel error, so the service has no error to branch on
    — TestPasswordHashRoundTrip pins exactly that, including that a zero-value password is a
    genuine error rather than a silent mismatch. Refusal: 401 with "invalid authentication
    credentials", the same for both halves. Known residual: the equivalence holds in the
    refusal, not in the work done — an unknown email returns before any hash comparison, so
    the two failures have measurably different latency (the comment's "the same code path"
    is true at the level of results, not of timing), and a timing observer can still
    enumerate addresses. Closing it needs a dummy comparison on the unknown-email path; until
    then this should be reported as a candidate defect rather than a held rule. Coverage gap,
    recorded knowingly: there is no test at all for login — no service test and no e2e test
    for the authentication-token endpoint — so neither half of the equivalence is pinned end
    to end. Note the contrast that makes the risk concrete: the activation-token request
    endpoint answers 404 for an unknown email, so identity is enumeration-resistant on one
    endpoint and not on the other.

- id: R-IDENTITY-019
  title: An account is born unactivated
  statement: |
    A newly registered account is never active: activation is a separate, token-driven step
    that the user completes later from the mail. The flag a caller supplies is overwritten on
    the way in, so no registration — however framed — can create a working account.
  module: identity
  entity: user
  category: invariant
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/identity/internal/service/activation.go::Service.Register
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/handler/dto.go::registerUserInput
      layer: handler
      role: defense-in-depth
      pinned_by: null
    - site: internal/identity/internal/repository/user_repo.go::UserRepository.Insert
      layer: repository
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 400
  fixture: null
  verification:
    unit: []
    e2e:
      - internal/e2e/users_test.go::TestRegisterUserHandlerSuccessState
      - internal/e2e/users_test.go::TestRegisterUserHandler
    gherkin:
      - docs/spec/features/identity/account.feature::A newly registered account arrives unactivated
  notes: >
    Authority is the service, deviating from the invariant default (database): the flag is
    set by the use case — Register overwrites whatever the caller put on the entity with
    false before the write — and the database only demands that some value is present
    (000002's activated boolean is NOT NULL with no default, so it pins neither true nor
    false). That is a real deviation worth stating: were the overwrite removed, a caller that
    could reach the service would create an active account and the whole activation gate
    (R-IDENTITY-016) would be moot. The other two sites are copies that fail loudly: the
    request shape has no `activated` field, so a body carrying it is an unknown key (400,
    pinned by TestRegisterUserHandler's "unknown fields rejected" case with both `activated`
    and `id`), and Insert binds only what the service handed it. Tie: if the service stopped
    forcing false, TestRegisterUserHandlerSuccessState's "new user must not be activated"
    assertion fails first — it reads the persisted row, not the response. Coverage gap: the
    HTTP layer is the only place this is pinned; there is no service-level test of Register
    (the service package tests activation only).

- id: R-IDENTITY-020
  title: An account's identity facts are stamped by the store
  statement: |
    An account's id, its creation time and its version counter are produced by the store,
    never by the caller — a client cannot choose who it is or how old its row looks. The
    store hands them back with the write, so the service never has to invent one.
  module: identity
  entity: user
  category: persistence-fact
  status: implemented
  authority: database
  mechanism: constraint
  scope: row-local
  enforcement:
    - site: migrations/000002_create_users_table.up.sql
      layer: db-constraint
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/repository/user_repo.go::UserRepository.Insert
      layer: repository
      role: defense-in-depth
      pinned_by: null
    - site: internal/identity/internal/handler/dto.go::registerUserInput
      layer: handler
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: null
    http: 400
  fixture: null
  verification:
    unit:
      - internal/identity/internal/repository/user_repo_test.go::TestInsert
    e2e:
      - internal/e2e/users_test.go::TestRegisterUserHandler
  notes: >
    Authority deviates from the persistence-fact default (repository) because the values are
    the database's, not Go's: id is GENERATED ALWAYS AS IDENTITY (a client-supplied id is not
    merely ignored, it is refused by the database), created_at is DEFAULT now() at
    timestamp(0), and version is DEFAULT 1. The repository's part is the read-back — the
    INSERT ... RETURNING clause is how the stamped values reach the entity — and the DTO's
    part is that none of the three has a field, so a body carrying `id` is an unknown key
    (400). Tie: the copies fail loudly in the obvious way: binding a client value to id would
    make 000002 refuse the INSERT, and TestInsert's "returns the persisted user with
    server-generated fields" subtest asserts id 1 after a truncated restart, version 1 and a
    non-zero created_at. The version column's default of 1 is also the first half of
    R-IDENTITY-010's compare-and-set: the counter starts at one and every write bumps it.
    Note the timestamp precision is seconds (timestamp(0)) — a fact the catalog should keep
    because it is why two writes in one second are not distinguishable by created_at.

- id: R-IDENTITY-021
  title: Identity's tables are reachable only through identity's own database role
  statement: |
    Who logs in and what they may do lives in its own schema, writable and readable only by
    the role that speaks for that context. Every other context's role is denied on those
    tables, and identity's role is denied on theirs, so a cross-context read cannot sneak in
    through SQL even if someone forgets the import rule.
  module: identity
  entity: module
  category: boundary
  status: implemented
  authority: composition-root
  mechanism: null
  scope: null
  enforcement:
    - site: migrations/000018_context_roles.up.sql
      layer: repository
      role: authoritative
      pinned_by: null
    - site: migrations/000015_split_context_schemas.up.sql
      layer: repository
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: "42501"
    constraint: null
    sentinel: null
    http: null
  fixture: null
  verification:
    unit:
      - internal/testdb/boundary_test.go::TestIdentityAppBoundary
      - internal/testdb/boundary_test.go::TestIdentityAppInsertAllowed
  expert-ref: docs/league-tokens-learning-phases/phase-05-modular-monolith-boundaries.md
  notes: >
    Boundary, and the authority is the composition root rather than the database — the
    grants are Postgres's to enforce, but the decision they encode (which context owns which
    tables, and the direction of every reach) is wiring, recorded in a migration and
    exercised by the test harness, not a predicate any write could violate. The layer value
    is `repository` by the catalog's existing convention for SQL that carries a boundary
    (R-GAME-008 lists 000018 the same way). 000018 is the authoritative site (schema USAGE
    plus SELECT/INSERT/UPDATE/DELETE on identity's tables for identity_app, and the
    ALTER DEFAULT PRIVILEGES that keeps future identity tables under the same rule); 000015
    is the move itself — users, user_tokens, roles, permissions and roles_permissions leave
    public — and is defence-in-depth in the sense that without it there would be nothing to
    grant on. Refusal is Postgres's insufficient_privilege (42501), unmapped in Go because
    the application never crosses the line: the boundary test is the only code that tries.
    Tie: the copies fail loudly — TestIdentityAppBoundary asserts identity_app can read its
    own five tables and is denied on game.players and schedule.teams, and
    TestIdentityAppInsertAllowed asserts it may write its own rows, so a widened grant shows
    up as a failing "denied" assertion first. Two facts worth carrying into the report: the
    application connects with all three role memberships and SET ROLEs per connection
    (000018's header), so the boundary is a discipline the pool enforces rather than a
    privilege the login lacks; and identity_app holds DELETE on identity's tables, so nothing
    at the privilege level prevents an account deletion path from being added later.
    Renumbered at merge (was provisional R-IDENTITY-022): R-IDENTITY-021 was folded into R-PLATFORM-013.

- id: R-IDENTITY-022
  title: Activation happens once and asking discloses nothing
  statement: |
    Activation happens once. An account that is already active cannot be activated again,
    and a token that was already spent, has expired or was minted for another purpose is no
    longer an activation credential. Asking for a fresh activation mail is answered the same
    way whoever asks: an address no account holds and an address whose account is already
    active receive exactly the answer a genuine request receives — the same status, the same
    body — and neither mints a token nor sends a mail, so the endpoint never says whether an
    address is registered or whether its account is active.
  module: identity
  entity: user
  category: policy
  status: implemented
  authority: service
  mechanism: null
  scope: null
  enforcement:
    - site: internal/identity/internal/service/activation.go::Service.RequestActivationToken
      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/identity/internal/handler/user_tokens.go::Handler.createActivationToken
      layer: handler
      role: defense-in-depth
      pinned_by: null
    - site: internal/identity/internal/service/activation.go::Service.Activate
      layer: service
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
    sentinel: ErrNotFound
    http: 422
  fixture: null
  verification:
    unit:
      - internal/identity/internal/service/activation_test.go::TestActivate
      - internal/identity/internal/service/activation_test.go::TestRequestActivationToken
    gherkin:
      - docs/spec/features/identity/account.feature::An activated account collects no second activation mail
      - docs/spec/features/identity/account.feature::An address no account holds is answered like a registered one
  notes: >
    Authority is the service, deviating from the policy default (domain): the verdict is a
    use-case reading (is this account already active?) taken before any token is minted, and
    no domain operation knows about an account's activation state. The second service site is
    the other half of "once": Activate's guarded write and the token cleanup (R-IDENTITY-009)
    are what make a spent token worthless, and the activation test's
    unknown/expired/out-of-scope subtest pins that a token which no longer resolves is
    ErrNotFound rather than a new activation. Tie: the service site cannot drift silently —
    dropping the check would let an active account collect activation mails, which nothing
    else would refuse (the flag is already true, so the flip is a no-op write that would
    still succeed), and TestRequestActivationToken pins that the already-active verdict mints
    no token. The endpoint is deliberately existence-neutral (misalignment-report §6.9,
    resolved by decision): the service still forms its two verdicts (ErrNotFound for an
    unknown email, ErrAlreadyActivated for an active account) and mints nothing and mails
    nothing for either, but the handler answers both with the very envelope a successful
    request receives — 202 and "an email will be sent to you containing activation
    instructions" — so neither the status nor the body carries an existence bit. Neutralizing
    only the unknown-email half would not have been enough: a 422 for an active account still
    says the address is registered and its account active, so the oracle would have moved
    rather than closed. The handler site is that disclosure boundary and is a copy, not a
    second decision: Tie: if it reintroduced a distinguishable status, the account feature's
    two neutralization scenarios fail first — each compares the answer byte for byte with the
    answer a known unactivated account receives, and asserts no mail was booked for the
    ineligible address. Nothing else is weakened: the token TTL (R-IDENTITY-007), the scope
    and single-use lookup (R-IDENTITY-008, R-IDENTITY-009) and the refusal of a spent
    activation token at Activate are untouched, and the refusal catalogued here is that
    Activate refusal (422, "invalid or expired activation token"). The request half has no
    refusal left to catalogue — its two ineligible causes are answered as success — and
    calling that answer a small lie ("an email will be sent") is the accepted price of the
    neutral answer: the alternative is an account oracle. Coverage: TestRequestActivationToken
    drives the request use case's three outcomes and their token side effects; the gherkin
    scenarios drive the same cases through the HTTP handler.
    Renumbered at merge (was provisional R-IDENTITY-023): R-IDENTITY-021 was folded into R-PLATFORM-013.


# ─────────────────────────────────────────────────────────────────────────────
# ledger — money movement authority (specified, not built)
# ─────────────────────────────────────────────────────────────────────────────

- id: R-LEDGER-001
  title: No balance goes negative
  statement: |
    A player's currency or token balance can never fall below zero. A debit that would
    overdraw is refused before any journal entry or balance projection is written, so a
    negative balance is not a repairable state — it is unrepresentable.
  module: ledger
  entity: balance
  category: invariant
  status: specified-only
  authority: database
  mechanism: constraint
  scope: row-local
  enforcement: []
  refusal: null
  fixture: null
  verification: {}
  expert-ref: docs/league-tokens-learning-phases/phase-06-ledger-and-accounting.md
  notes: >
    Specified only. No balance table exists yet: the ledger's Repository currently
    persists the rides row's bonus_acc and nothing else, and LockTokens/Burn are
    intent seams that write nothing. The design intent from phase 06 is the ledger as
    the single authority for balance mutation ("game should never UPDATE
    ledger.balances"), which puts the *decision* in the ledger operation and the
    *refusal* in the row: a NOT NULL + CHECK (balance >= 0) per balance row, plus the
    ledger's pre-check for a clean client-facing refusal. Refusal surface undesigned —
    either a ledger sentinel (409) or a validation error (422); decide when the
    accounts/journal tables land.

- id: R-LEDGER-002
  title: Every money movement posts a balanced journal pair
  statement: |
    Every movement of money is recorded as a pair of journal entries whose debits equal
    their credits, in the same transaction as the balance projection update. A
    single-sided entry never commits, so the journal always explains every balance.
  module: ledger
  entity: journal_entry
  category: invariant
  status: specified-only
  authority: database
  mechanism: trigger
  scope: cross-row
  enforcement: []
  refusal: null
  fixture: null
  verification: {}
  expert-ref: docs/league-tokens-learning-phases/phase-06-ledger-and-accounting.md
  notes: >
    Specified only (phase 06: double-entry idea + "the ledger owns journal
    consistency"). Scope is cross-row — the predicate is "the entries of one journal
    group sum to zero", which no row-local CHECK can express, so the taxonomy's
    sub-order points at a deferred constraint trigger (or a schema in which entries can
    only be appended in pairs, with the sum exposed as a view). Recorded here as
    cross-row precisely so nobody tries to write it as a CHECK on a single row.
    Refusal surface undesigned.

- id: R-LEDGER-003
  title: Only the ledger moves money
  statement: |
    A balance changes only through a ledger operation. Other modules state what should
    happen to the money — deduct, lock, burn — and never compute or write a balance
    themselves, so there is exactly one place where the corruption rule can be
    enforced.
  module: ledger
  entity: balance
  category: boundary
  status: specified-only
  authority: composition-root
  mechanism: null
