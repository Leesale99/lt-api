      layer: service
      role: authoritative
      pinned_by: null
    - site: internal/game/internal/adapter/outbound/schedule_acl.go::ScheduleACL.RoundOpenTx
      layer: repository
      role: defense-in-depth
      pinned_by: null
    - site: migrations/000018_context_roles.up.sql
      layer: repository
      role: defense-in-depth
      pinned_by: null
  refusal:
    code: synthetic
    constraint: null
