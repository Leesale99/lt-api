# spec prove registry — the per-rule mutant detectors.
#
# Schema (one top-level key per rule id):
#
#   R-XXX-NNN:
#     scenarios:                 # required for a verifiable entry; one or more
#       - docs/spec/features/<module>/<file>.feature::<scenario name>
#     signoff: "Name <email> <commit-sha>"   # optional; only for UNVALIDATABLE
#     notes: "..."               # optional, free text
#
# `scenarios` are the executable scenarios that detect a bypass of the rule's
# enforcement (the Owner-pool write/refusal family, or the rule's own
# executable proof where the database has no sabotaged writer). `spec prove`
# resolves every pointer against the parsed feature tree before running it.
#
# `signoff` is the human gate for a rule whose enforcement cannot be expressed
# as an executable mutant today. It must carry a git-attributed identity and
# the commit that reviewed the exception; a signed UNVALIDATABLE rule passes,
# an unsigned one fails.
#
# The registry is seeded with the 30 database-authority rules named by the
# prove-gate seeding task. Most map to an Owner-pool write/refusal scenario;
# R-IDENTITY-011 and R-IDENTITY-014 have no sabotage scenario in today's tree,
# so they map to their own executable proof and say so in `notes`. The other
# rules have no entry on day one: they enter prove only when a change touches
# them, and then a human must either map a scenario or sign the unvalidatable
# entry.

R-SCHEDULE-003:
