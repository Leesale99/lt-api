# docs/spec/glossary.yaml — the seeded step vocabulary allowlist
#
# Checker policy 13 (`cmd/spec`, docs/spec/rules.schema.md §3) binds every token
# of every step in docs/spec/features/** to one of these sections:
#
#   * the section named after the feature file's module directory, or
#   * `common`, which every module may use.
#
# The denylist in gherkin-style.md §6 is absolute and runs first: a word denied
# there is an ERROR even when a section lists it (the seed declares `insert`
# because §8's sabotage steps legitimately say it; a facade step may not).
#
# Tokenizer (pinned, `tokenizeStep` in cmd/spec/vocabulary.go): lowercase; drop
# the English possessive suffix (`'s` / `’s`); drop quoted literals ("Spring
# 2026", "2–1", "ana@example.com"); replace every remaining run of characters
# that is not a letter, a digit or an underscore with a space; split. Bare
# numbers carry no vocabulary and are exempt — except a three-digit
# HTTP-range figure with no unit after it ("refused as 409"), which §6 denies.
# Underscore is NOT a separator: `rides_state_gate` is one token, so database
# object names are declared here like any other word.
#
# The seed is today's tree: this file describes the vocabulary the ten feature
# files already use. Extending a section is a deliberate edit made together with
# the scenario that needs the word — never an accident that slips review.
#
# `common` is the closed class only: articles, determiners, pronouns,
# prepositions, conjunctions, auxiliaries and copula, negation/degree particles,
# and cardinal/ordinal quantifiers. Anything that carries domain meaning — even
# a plain adjective like `new` — belongs to the module that says it.

common:
  # articles and determiners
  - a
  - all
  - an
  - another
  - both
  - "no"
  - one
  - only
  - other
  - same
  - that
  - the
  - this
  - two
  # pronouns
  - her
  - hers
  - it
  - its
  - she
  - someone
  # prepositions and particles (quoted where YAML 1.1 would read a boolean:
  # "no", "on", "off")
  - above
  - after
  - afterwards
  - again
  - against
  - ago
  - already
  - as
  - at
  - away
  - back
