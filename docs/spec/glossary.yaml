  - to
  - under
  - with
  - without
  - yet
  # conjunctions
  - and
  - else
  - or
  - when
  # auxiliaries and copula
  - are
  - been
  - being
  - does
  - has
  - have
  - is
  - not
  - was
  # quantifiers (cardinal, ordinal, bare)
  - eleven
  - first
  - five
  - last
  - second
  - ten
  - three
  - twenty
  - zero

