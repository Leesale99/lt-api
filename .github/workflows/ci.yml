# The quality gate from the Makefile (make audit), enforced on a machine
# nobody controls. Red = no merge.
#
# The Makefile is the single source of truth for WHAT is checked; this file
# only provides the environment the checks need:
#
#   - a pinned Go toolchain (go-version-file: go.mod), so CI can never drift
#     from the module's go directive;
#   - a Postgres service container reachable at localhost:5432, plus
#     LT_API_TEST_DSN at job level. The test harness fails hard when the DSN
#     is set but unreachable (internal/testdb), so a Postgres outage is red,
#     never a silently-skipped suite.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: CI needs no write access to pass the gate.
permissions:
  contents: read

# Superseded runs on the same ref are cancelled, not queued behind.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      # Same DSN shape as .envrc (which is not committed): the harness only
      # needs a LOGIN+CREATEDB role and treats the db name as a prefix.
      LT_API_TEST_DSN: postgres://lt_test:test@localhost:5432/lt_api_test?sslmode=disable
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: lt_test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: lt_api_test
        ports:
          - 5432:5432
        # Wait for Postgres to accept connections before any step runs.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          # Vendor dir is committed: builds download nothing, so the module
          # cache would be dead weight.
          cache: false
      - name: Audit
        run: make audit
